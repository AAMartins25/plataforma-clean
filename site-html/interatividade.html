<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Interatividade</title>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>
  <header style="padding-top:12px; padding-bottom:10px;">
    <div style="margin-top:20px;">
      <h1 id="titulo_disciplina" style="margin-bottom:2px;"></h1>
      <h2 id="titulo_assunto" style="margin-top:-6px; margin-bottom:1px;"></h2>
    </div>

    <div style="margin-top:4px;">
      <a class="btn" href="javascript:history.back()">Voltar</a>
      <a href="#" class="btn" onclick="logout()">Sair</a>
    </div>
  </header>

  <main class="container">
    <div class="card">
      <div class="list" id="acoes"></div>
      <div id="erro"></div>
    </div>
  </main>

  <footer>
    <p>© 2026 - Plataforma Quality Estudos</p>
  </footer>

  <script>
    const API_BASE = "http://127.0.0.1:8000";

    function qs(name) {
      return new URLSearchParams(window.location.search).get(name);
    }
    function esc(s) {
      return String(s ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;");
    }

    const pastaId = qs("pasta_id");
    const assuntoId = qs("assunto_id");

    const disciplinaNome = qs("disciplina_nome") || "";
    const assuntoNome = qs("assunto_nome") || "";

    const tituloDisciplina = document.getElementById("titulo_disciplina");
    const tituloAssunto = document.getElementById("titulo_assunto");

    if (tituloDisciplina) {
      tituloDisciplina.innerText = disciplinaNome
        ? `📘 ${disciplinaNome}`
        : "📘 Disciplina";
    }

    if (tituloAssunto) {
      tituloAssunto.innerText = assuntoNome;
    }

    const acoes = document.getElementById("acoes");
    const erro = document.getElementById("erro");

    if (!pastaId) {
      acoes.innerHTML = "<p>Erro: faltou pasta_id na URL.</p>";
    } else {
      acoes.innerHTML = `
        <div class="assunto">
          <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;">
            <div>
              <b>📝 QuizIA</b>
              <p style="opacity:.85">5 questões (objetivo e direto).</p>
            </div>

            <a class="btn"
              href="quiz.html?pasta_id=${encodeURIComponent(pastaId)}&assunto_id=${encodeURIComponent(assuntoId || "")}">
              Abrir
            </a>
          </div>
        </div>

        <div class="assunto">
          <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;">
            <div>
              <b>🃏 Cartões IA</b>
              <p style="opacity:.85">Pergunta (frente) → resposta (verso).</p>
            </div>

            <a class="btn"
              href="cartoes.html?pasta_id=${encodeURIComponent(pastaId)}&assunto_id=${encodeURIComponent(assuntoId || "")}">
              Abrir
            </a>
          </div>
        </div>

        <div class="assunto">
          <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;">
            <div>
              <b>🧠 QuestõesIA</b>
              <p style="opacity:.85">10 questões no estilo bateria.</p>
            </div>

            <a class="btn"
              href="questoes-ia.html?pasta_id=${encodeURIComponent(pastaId)}&assunto_id=${encodeURIComponent(assuntoId || "")}">
              Abrir
            </a>
          </div>
        </div>
      `;
    }
  </script>
</body>
</html>
