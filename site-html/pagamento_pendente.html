<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <script src="js/sessao.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pagamento pendente</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="js/cabecalho.js" defer></script>
</head>
<body class="retorno-pagamento-page">
  <header>
    <h1>⏳ Pagamento pendente</h1>
    <nav>
      <a href="cursos.html?refresh=1" class="btn">Voltar para cursos</a>
      <a href="index.html" class="btn">Início</a>
    </nav>
    <p>Assim que for aprovado, seu curso será liberado automaticamente.</p>
  </header>

  <main class="container">
    <div class="card">
      <h2>O que fazer?</h2>
      <p>
        Se o pagamento estiver em análise/pendente, aguarde um pouco e clique em
        <button
            class="btn"
            onclick="voltarParaCurso()">
            ← Voltar para o curso
        </button> para atualizar.
      </p>

      <a href="cursos.html?refresh=1" class="btn">Atualizar cursos</a>
    </div>
  </main>

  <footer>
    <p>© 2026 - QualityEstudos</p>
  </footer>

  <script>
  function voltarParaCurso() {

      const url = localStorage.getItem("voltar_para_compra");

      if (url) {
          window.location.href = url;
          return;
      }

      window.location.href = "index.html";
  }
  </script>
  
</body>
</html>
