<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Questões</title>

  <link
    rel="stylesheet"
    href="css/style.css"
  >
</head>

<body data-page="questoes-pratica">

  <header
    style="
      padding-top:8px;
      padding-bottom:24px;
      position:relative;
    "
  >

    <div
      style="
        margin-top:32px;
        display:flex;
        flex-direction:column;
        justify-content:center;
        align-items:center;
        text-align:center;
      "
    >

      <h1
        id="titulo_curso"
        style="
          margin:-6px 0 0 0;
          font-size:1.55rem;
          text-align:center;
        "
      >
      </h1>

      <h2
        id="titulo_assunto"
        style="
          margin:4px 0 0 0;
          font-size:1.05rem;
          text-align:center;
        "
      >
      </h2>

    </div>


    <nav
      style="
        position:absolute;
        right:24px;
        top:58px;
        display:flex;
        gap:10px;
        align-items:center;
      "
    >

      <a
        id="btnVoltarQuestoesAssuntos"
        class="btn"
        href="#"
        title="Voltar"
      >
        ⇦
      </a>

      <a
        class="btn"
        href="index.html"
        title="Início"
      >
        ⌂
      </a>

      <a
        class="btn"
        href="#"
        onclick="confirmarSaidaQuestoes(); return false;"
        title="Sair"
      >
        ⎋
      </a>

    </nav>

  </header>


  <main class="container">

    <div id="area_questao"></div>

  </main>


  <footer>

    <p>
      © <span id="ano_atual"></span> - Quality Estudos
    </p>

  </footer>


  <script src="js/app.js"></script>


  <script>

    function confirmarSaidaQuestoes() {
      const ok =
        confirm(
          "Deseja realmente sair da plataforma?"
        );

      if (!ok) {
        return;
      }

      logout();
    }


    const btnVoltar =
      document.getElementById(
        "btnVoltarQuestoesAssuntos"
      );

    if (btnVoltar) {

      btnVoltar.addEventListener(
        "click",
        function (e) {

          e.preventDefault();

          const p =
            new URLSearchParams(
              window.location.search
            );

          window.location.href =
            "questoes-assuntos.html" +
            "?curso_id=" +
            encodeURIComponent(
              p.get("curso_id") || ""
            ) +
            "&curso_nome=" +
            encodeURIComponent(
              p.get("curso_nome") || ""
            ) +
            "&disciplina_id=" +
            encodeURIComponent(
              p.get("disciplina_id") || ""
            ) +
            "&disciplina_nome=" +
            encodeURIComponent(
              p.get("disciplina_nome") || ""
            );

        }
      );

    }


    const anoAtual =
      document.getElementById(
        "ano_atual"
      );

    if (anoAtual) {

      anoAtual.textContent =
        new Date().getFullYear();

    }

  </script>

</body>

</html>
