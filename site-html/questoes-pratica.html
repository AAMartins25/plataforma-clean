<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Questões</title>

  <link
    rel="stylesheet"
    href="css/style.css"
  >
</head>

<body
  class="questoes-pratica-page"
  data-page="questoes-pratica"
>

  <header
    style="
      padding-top:8px;
      padding-bottom:24px;
      position:relative;
    "
  >

    <div class="questoes-pratica-header-identificacao">

      <h1 id="titulo_curso_nome"></h1>

      <h2 class="questoes-pratica-modulo">
        📝 Questões
      </h2>

    </div>


    <nav class="questoes-pratica-header-acoes">

      <a
        id="btnVoltarQuestoesAssuntos"
        class="btn"
        href="#"
        title="Voltar"
      >
        ⇦
      </a>

      <a
        class="btn"
        href="index.html"
        title="Início"
      >
        ⌂
      </a>

      <a
        class="btn"
        href="#"
        onclick="confirmarSaidaQuestoes(); return false;"
        title="Sair"
      >
        ⎋
      </a>

    </nav>

  </header>


  <main class="container">

    <div id="area_questao"></div>

  </main>


  <footer>

    <p>
      © <span id="ano_atual"></span> - Quality Estudos
    </p>

  </footer>


  <script src="js/app.js"></script>


  <script>

    function confirmarSaidaQuestoes() {
      const ok =
        confirm(
          "Deseja realmente sair da plataforma?"
        );

      if (!ok) {
        return;
      }

      logout();
    }


    const btnVoltar =
      document.getElementById(
        "btnVoltarQuestoesAssuntos"
      );

    if (btnVoltar) {

      btnVoltar.addEventListener(
        "click",
        function (e) {

          e.preventDefault();

          const p =
            new URLSearchParams(
              window.location.search
            );

          window.location.href =
            "questoes-assuntos.html" +
            "?curso_id=" +
            encodeURIComponent(
              p.get("curso_id") || ""
            ) +
            "&curso_nome=" +
            encodeURIComponent(
              p.get("curso_nome") || ""
            ) +
            "&disciplina_id=" +
            encodeURIComponent(
              p.get("disciplina_id") || ""
            ) +
            "&disciplina_nome=" +
            encodeURIComponent(
              p.get("disciplina_nome") || ""
            );

        }
      );

    }


    const anoAtual =
      document.getElementById(
        "ano_atual"
      );

    if (anoAtual) {

      anoAtual.textContent =
        new Date().getFullYear();

    }

  </script>

</body>

</html>
