<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Assuntos</title>
  <link rel="stylesheet" href="css/style.css"/>
</head>

<body class="assuntos-page" data-page="assuntos">
  <header class="assuntos-header">

    <div style="margin-top:0;">
      <h1 id="titulo_curso" style="margin-bottom:0;"></h1>
    </div>

    <div class="assuntos-header-acoes">

      <a
        class="btn"
        href="javascript:void(0)"
        onclick="voltarParaDisciplinas()"
        title="Voltar">
        ⇦
      </a>

      <a
        class="btn"
        href="javascript:void(0)"
        onclick="
          localStorage.setItem('pagina_antes_inicio', window.location.href);
          window.location.replace('index.html');
        "
        title="Página inicial"
      >
        ⌂
      </a>

      <a
        class="btn"
        href="javascript:void(0)"
        onclick="sairComConfirmacao()"
        title="Sair">
        ⎋
      </a>

    </div>

  </header>

  <main class="container" id="conteudo">

    <div class="card assuntos-disciplina-card">
      <h2 id="card_disciplina_titulo">
        Disciplina:
      </h2>
    </div>

    <div class="card assuntos-intro-card">
      <h2>
        Assuntos
        <span class="assuntos-subtitulo">
          em ordem de prioridade
        </span>
      </h2>
    </div>

    <div class="card">
      <div id="lista" class="list"></div>
    </div>

  </main>

  <footer>
    <p>© <span id="ano_atual"></span> - Quality Estudos</p>
  </footer>

  <script src="js/app.js"></script>

  <script>
    const anoAtual = document.getElementById("ano_atual");
    if (anoAtual) {
      anoAtual.textContent = new Date().getFullYear();
    }
  </script>
</body>
</html>
