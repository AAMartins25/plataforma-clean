<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Assuntos</title>
  <link rel="stylesheet" href="css/style.css"/>
</head>

<body data-page="assuntos">
  <header style="padding-top:22px;padding-bottom:24px; position:relative;">

    <div style="margin-top:0;">
      <h1 id="titulo_curso" style="margin-bottom:0;"></h1>
    </div>

    <div style="
        position:absolute;
        right:24px;
        top:22px;
        display:flex;
        gap:10px;
        align-items:center;
    ">

      <a
        class="btn"
        href="javascript:void(0)"
        onclick="voltarParaDisciplinas()"
        title="Voltar">
        ⇦
      </a>

      <a
        class="btn"
        href="javascript:void(0)"
        onclick="
          localStorage.setItem('pagina_antes_inicio', window.location.href);
          window.location.replace('index.html');
        "
        title="Página inicial"
      >
        ⌂
      </a>

      <a
        class="btn"
        href="javascript:void(0)"
        onclick="sairComConfirmacao()"
        title="Sair">
        ⎋
      </a>

    </div>

  </header>

  <main class="container" id="conteudo">

    <div class="card" style="padding-top:18px; padding-bottom:10px; margin-bottom:10px;">
      <h2 id="card_disciplina_titulo" style="font-weight:500;font-size:1.5rem;margin:0;">
        Disciplina:
      </h2>
    </div>

    <div class="card" style="padding-top:18px; padding-bottom:10px; margin-bottom:10px;">
      <h2 style="font-weight:500;font-size:1.25rem;margin:0;">
        Assuntos em ordem de prioridade
      </h2>
    </div>

    <div class="card">
      <div id="lista" class="list"></div>
    </div>

    <div class="card" style="padding:0;height:0px;"></div>

  </main>

  <footer>
    <p>© <span id="ano_atual"></span> - Quality Estudos</p>
  </footer>

  <script src="js/app.js"></script>

  <script>
    const anoAtual = document.getElementById("ano_atual");
    if (anoAtual) {
      anoAtual.textContent = new Date().getFullYear();
    }
  </script>
</body>
</html>
