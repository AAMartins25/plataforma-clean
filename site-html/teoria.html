<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Teoria e Questões</title>
  <link rel="stylesheet" href="css/style.css"/>
</head>

<body>
  <header style="padding-top:12px; padding-bottom:10px;">

    <div style="margin-top:20px;">
      <h1 id="titulo_disciplina" style="margin-bottom:8px;"></h1>
      <h2 id="titulo_assunto" style="margin-top:-6px; margin-bottom:1px;"></h2>
    </div>

    <div style="margin-top:4px;">
      <a class="btn" href="javascript:history.back()">Voltar</a>
      <a href="#" class="btn" onclick="logout()">Sair</a>
    </div>

  </header>

  <main class="container" id="conteudo">

    <div class="card">
      <!-- removido -->
      
      <div id="lista_aulas" class="list"></div>
    </div>

    <div id="detalhes_aula"></div>

  </main>

  <footer>
    <p>© 2026 - Plataforma Quality Estudos</p>
  </footer>

  <script>
    const API_BASE = "http://127.0.0.1:8002";
    
    // 🔥 variável global (controle da aula selecionada)
    let aulaAtualId = null;
    let pastaAtualId = null;
    let filtroAulas = "todas";
    let aulasCache = []; 

    function qs(name) {
      return new URLSearchParams(window.location.search).get(name);
    }

    function esc(s) {
      return String(s ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;");
    }

    function getToken() {
      return localStorage.getItem("access_token");
    }

    async function apiGet(path) {
      const token = getToken();

      const res = await fetch(`${API_BASE}${path}`, {
        headers: token ? {
          "Authorization": `Bearer ${token}`
        } : {}
      });

      if (!res.ok) {
        const txt = await res.text();
        throw new Error(`Erro ${res.status} em ${path}\n${txt}`);
      }

      return res.json();
    }

    async function apiPost(path, body = {}) {
      const token = getToken();

      const res = await fetch(`${API_BASE}${path}`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          ...(token ? { "Authorization": `Bearer ${token}` } : {})
        },
        body: JSON.stringify(body)
      });

      if (!res.ok) {
        const txt = await res.text();
        throw new Error(`Erro ${res.status} em ${path}\n${txt}`);
      }

      return res.json();
    }

    async function tryMany(endpoints) {
      let lastErr = null;
      for (const ep of endpoints) {
        try {
          return await apiGet(ep);
        } catch (err) {
          lastErr = err;
        }
      }
      throw new Error(
        `Falhou em todos os endpoints:\n${endpoints.join("\n")}\n\nÚltimo erro:\n${lastErr?.message || ""}`
      );
    }

    function renderError(title, msg) {
      return `
        <div class="card" style="border-top-color:#6B4F3F">
          <h2>${esc(title)}</h2>
          <pre style="white-space:pre-wrap">${esc(msg)}</pre>
        </div>
      `;
    }

    async function getProgressoBackend(pastaId) {
      try {
        const dados = await apiGet(`/me/progresso?pasta_id=${pastaId}`);
        return dados.map(p => p.aula_id);
      } catch (err) {
        console.warn("Falha ao buscar progresso no backend:", err);
        return [];
      }
    }

    function salvarProgresso(pastaId, lista) {
      localStorage.setItem(`progresso_${pastaId}`, JSON.stringify(lista));
    }

    function getRevisoes(pastaId) {
      try {
        const dados = localStorage.getItem(`revisoes_${pastaId}`);
        return dados ? JSON.parse(dados) : [];
      } catch {
        return [];
      }
    }

    function salvarRevisoes(pastaId, lista) {
      localStorage.setItem(`revisoes_${pastaId}`, JSON.stringify(lista));
    }

    function adicionarDias(data, dias) {
      const novaData = new Date(data);
      novaData.setDate(novaData.getDate() + dias);
      return novaData.toISOString().slice(0, 10);
    }

    function hojeISO() {
      return new Date().toISOString().slice(0, 10);
    }

    function calcularDiasAtraso(dataISO) {
      const hoje = new Date(hojeISO());
      const data = new Date(dataISO);
      const diff = hoje - data;
      return Math.floor(diff / (1000 * 60 * 60 * 24));
    }

    function criarRevisaoInicial(aulaId) {
      if (!pastaAtualId) return;

      const revisoes = getRevisoes(pastaAtualId);
      const jaExiste = revisoes.some(r => r.aulaId === aulaId);

      if (jaExiste) return;

      revisoes.push({
        aulaId: aulaId,
        etapa: 1,
        proximaRevisao: adicionarDias(new Date(), 7)
      });

      salvarRevisoes(pastaAtualId, revisoes);
    }

    function marcarRevisaoFeita(aulaId) {
      if (!pastaAtualId) return;

      const intervalos = {
        1: 7,
        2: 15,
        3: 21
      };

      const revisoes = getRevisoes(pastaAtualId);

      const novasRevisoes = revisoes.map(r => {
        if (r.aulaId !== aulaId) return r;

        const novaEtapa = r.etapa + 1;
        const dias = intervalos[r.etapa] || 28;

        return {
          ...r,
          etapa: novaEtapa,
          proximaRevisao: adicionarDias(new Date(), dias)
        };
      });

      salvarRevisoes(pastaAtualId, novasRevisoes);
      carregarAulas();
    }

    async function marcarConcluida(aulaId) {
      if (!pastaAtualId) return;

      try {
        await apiPost(`/me/progresso/aulas/${aulaId}/concluir`);
        criarRevisaoInicial(aulaId);

        await carregarAulas();

        aulaAtualId = null;
        abrirAula(aulaId);

      } catch (err) {
        alert("Erro ao salvar progresso no servidor.");
        console.error(err);
      }
    }

    function filtrarAulas(tipo) {
      filtroAulas = tipo;
      carregarAulas();
    }

    async function carregarAulas() {
      const pastaId = qs("pasta_id");
      const assuntoId = qs("assunto_id");
      const disciplinaNome = qs("disciplina_nome") || "";
      const assuntoNome = qs("assunto_nome") || "";

      const tituloDisciplina = document.getElementById("titulo_disciplina");
      const tituloAssunto = document.getElementById("titulo_assunto");

      if (tituloDisciplina) {
        tituloDisciplina.innerText = disciplinaNome
          ? `📘 ${disciplinaNome}`
          : "📘 Disciplina";
      }

      if (tituloAssunto) {
        tituloAssunto.innerText = assuntoNome;
      }

      pastaAtualId = pastaId; 

      // subtítulo removido do cabeçalho

      if (!pastaId) {
        document.getElementById("lista_aulas").innerHTML =
          "<p>Erro: faltou pasta_id na URL.</p>";
        return;
      }

      const endpointsAulas = [
        `/pastas/${pastaId}/aulas`,
        `/aulas?pasta_id=${pastaId}`
      ];

      let aulas;
      try {
        aulas = await tryMany(endpointsAulas);
      } catch (err) {
        document.getElementById("lista_aulas").innerHTML = renderError(
          "Não consegui listar aulas",
          err.message
        );
        return;
      }

      if (!aulas || aulas.length === 0) {
        document.getElementById("lista_aulas").innerHTML =
          "<p>Nenhuma aula encontrada nesta pasta.</p>";
        return;
      }

      aulas.sort((a, b) => (a.ordem ?? 0) - (b.ordem ?? 0));
      aulasCache = aulas;

      const lista = document.getElementById("lista_aulas");

      const progresso = await getProgressoBackend(pastaAtualId);
      const progressoSet = new Set(progresso);

      const totalAulas = aulas.length;
      const aulasConcluidas = aulas.filter(a => progressoSet.has(a.id)).length;
      const percentualProgresso = totalAulas > 0
        ? Math.round((aulasConcluidas / totalAulas) * 100)
        : 0;

      const ultimaAulaId = localStorage.getItem(`ultima_aula_${pastaAtualId}`);
      const ultimaAulaIdNum = Number(ultimaAulaId);

      // 🔥 valida se a aula ainda existe na lista
      const aulaExiste = aulas.some(a => a.id === ultimaAulaIdNum);
      
      if (!aulaExiste) {
        localStorage.removeItem(`ultima_aula_${pastaAtualId}`);
      }

      let html = "";

      const revisoes = getRevisoes(pastaAtualId);
      const hoje = hojeISO();

      const revisoesPendentes = revisoes.filter(r => {
        return r.proximaRevisao <= hoje;
      });

      const revisoesAtrasadas = revisoesPendentes.filter(r => r.proximaRevisao < hoje);

      if (revisoesPendentes.length > 0) {
        if (revisoesAtrasadas.length > 0) {
          html += `
            <div class="card alerta-revisoes">
              <h3>⚠️ Atenção: ${revisoesAtrasadas.length} revisão(ões) atrasada(s)</h3>
              <p>Priorize essas revisões.</p>
            </div>
          `;
        }

        html += `
          <div class="card" style="padding-left:0;">
            <h3>🔁 Revisões pendentes: ${revisoesPendentes.length}</h3>

            <div class="list">
              ${revisoesPendentes.map(r => {
                const aula = aulas.find(a => a.id === r.aulaId);

                const atrasada = r.proximaRevisao < hoje;

                return `
                  <div class="assunto ${atrasada ? 'revisao-atrasada' : 'revisao-hoje'}">
                    <b>${esc(aula?.titulo || "Aula")}</b><br/>

                    <span style="opacity:.85">
                      Revisão etapa ${esc(r.etapa)} • prevista para ${esc(r.proximaRevisao)}
                    </span><br/>

                    <span class="status-revisao">
                      ${
                        atrasada
                          ? `⚠️ Atrasada há ${calcularDiasAtraso(r.proximaRevisao)} dia(s)`
                          : "📌 Revisão para hoje"
                      }
                    </span><br/>

                    <button class="btn" onclick="marcarRevisaoFeita(${r.aulaId})">
                      Marcar revisão feita
                    </button>
                  </div>
                `;
              }).join("")}
            </div>
          </div>
        `;
      }

      // 🔽 lista normal de aulas (SEMPRE EXECUTA)
      const aulasFiltradas = aulas.filter(a => {
        const concluida = progressoSet.has(a.id);

        if (filtroAulas === "concluidas") return concluida;
        if (filtroAulas === "nao_concluidas") return !concluida;
        return true;
      });

      html += aulasFiltradas.map((a) => `
        <div class="disciplina ${progressoSet.has(a.id) ? 'concluida' : ''}" id="aula_${a.id}">
          <div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap">

            <div style="flex:1; min-width:240px;">
              <div style="font-weight:bold">
                ${esc(a.titulo)}
                ${progressoSet.has(a.id) ? '<span style="color:#16a34a; margin-left:6px;">✓</span>' : ''}
              </div>
            </div>

            <div style="display:flex;flex-direction:column;align-items:flex-end;gap:8px;min-width:220px;margin-top:6px;">
              <button class="btn" style="margin-top:-6px;" onclick="abrirAula(${a.id})">Abrir</button>
            </div>
          </div>
        </div>
      `).join("");

      lista.innerHTML = html;  
    }
    
    function renderVideo(url) {
      if (!url || typeof url !== "string") return "";

      if (url.includes("youtube.com") || url.includes("youtu.be")) {
        let videoId = "";

        if (url.includes("youtu.be")) {
          videoId = url.split("/").pop().split("?")[0];
        } else {
          try {
            const params = new URL(url).searchParams;
            videoId = params.get("v");
          } catch (e) {
            return `<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">Abrir vídeo</a>`;
          }
        }

        if (videoId) {
          return `
            <iframe 
              width="100%" 
              height="315" 
              src="https://www.youtube.com/embed/${videoId}" 
              frameborder="0"
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
              allowfullscreen>
            </iframe>
          `;
        }
      }

      return `<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">Abrir vídeo</a>`;
    }
    
    async function abrirAula(aulaId) {
      if (aulaAtualId === aulaId) return;
      aulaAtualId = aulaId; 

      // 🔥 salvar progresso
      if (pastaAtualId) {
        localStorage.setItem(`ultima_aula_${pastaAtualId}`, aulaId);
      }

      // 🔥 remove destaque anterior
      const anterior = document.querySelector(".disciplina.ativa");
      if (anterior) anterior.classList.remove("ativa");

      // 🔥 adiciona destaque na atual
      const elAula = document.getElementById(`aula_${aulaId}`);
      if (elAula) elAula.classList.add("ativa");

      const box = document.getElementById("detalhes_aula");

      // 🔽 scroll suave até o conteúdo (corrigido)
      box.scrollIntoView({ behavior: "smooth" });

      box.innerHTML = `
        <div class="card">
          <h2>Carregando aula ${esc(aulaId)}...</h2>
        </div>
      `;

      try {
        const endpointsVideos = [
          `/aulas/${aulaId}/videos`,
          `/videos?aula_id=${aulaId}`
        ];

        const endpointsMateriais = [
          `/aulas/${aulaId}/materiais`,
          `/materiais?aula_id=${aulaId}`
        ];

        const endpointsBaterias = [
          `/aulas/${aulaId}/baterias`,
          `/baterias?aula_id=${aulaId}`
        ];

        const [videosRes, materiaisRes, bateriasRes] = await Promise.allSettled([
          tryMany(endpointsVideos),
          tryMany(endpointsMateriais),
          tryMany(endpointsBaterias)
        ]);

        const videos = videosRes.status === "fulfilled" ? videosRes.value : [];
        const materiais = materiaisRes.status === "fulfilled" ? materiaisRes.value : [];
        const baterias = bateriasRes.status === "fulfilled" ? bateriasRes.value : [];

        let avisos = "";

        if (videosRes.status === "rejected") {
          avisos += `<p style="color:orange">⚠️ Vídeos ainda não disponíveis. Por favor, aguarde!</p>`;
        }

        if (materiaisRes.status === "rejected") {
          avisos += `<p style="color:orange">⚠️ Material ainda não disponível. Por favor, aguarde!</p>`;
        }

        if (bateriasRes.status === "rejected") {
          avisos += `<p style="color:orange">⚠️ Sprints ainda não disponíveis. Favor aguardar!</p>`;
        }
             
        const progresso = await getProgressoBackend(pastaAtualId);
        const aulaConcluida = progresso.includes(aulaId);

        const aulaSelecionada = aulasCache.find(a => a.id === aulaId);
        const tituloAula = aulaSelecionada?.titulo || `Aula ${aulaId}`;
        const disciplinaNome = qs("disciplina_nome") || "Disciplina";

        let html = `
          <div class="card">
            <div style="font-weight:bold; opacity:.85; margin-bottom:6px;">
              ${esc(disciplinaNome)}
            </div>
            <h2>📌 ${esc(tituloAula)}</h2>

            ${avisos}

          </div>
        `;

        const mats = Array.isArray(materiais) ? materiais : [];
        html += `
          <div class="card">
            <h2>📄 Teoria em Texto</h2>
            ${mats.length === 0 ? "<p>Nenhum material cadastrado.</p>" : `
              <div class="list">
                ${mats.map(m => `
                  <div class="assunto">
                    <b>${esc(m.tipo || "Material")}</b><br/>
                    ${m.url ? `<a href="${esc(m.url)}" target="_blank" rel="noopener noreferrer">Abrir</a>` : ""}
                    ${m.texto ? `
                      <div style="margin-top:10px;">
                        <pre style="white-space:pre-wrap">${esc(m.texto)}</pre>
                      </div>` : ""
                    }
                    ${m.descricao ? `<div style="margin-top:8px;opacity:.85">${esc(m.descricao)}</div>` : ""}
                  </div>
                `).join("")}
              </div>
            `}
          </div>
        `;

        const vids = Array.isArray(videos) ? videos : [];
        vids.sort((a, b) => (a.ordem ?? 0) - (b.ordem ?? 0));

        html += `
          <div class="card">
            <h2>🎥 Resumo em Vídeo</h2>
            ${vids.length === 0 ? "<p>Nenhum vídeo cadastrado.</p>" : `
              <div class="list">
                ${vids.map(v => `
                  <div class="assunto">
                    <b>Ordem ${esc(v.ordem ?? "-")}</b><br/>
                    <span>${esc(v.titulo || "Vídeo")}</span><br/>
                    ${renderVideo(v.url)}
                  </div>
                `).join("")}
              </div>
            `}
          </div>
        `;

        

        const bats = Array.isArray(baterias) ? baterias : [];
        bats.sort((a, b) => (a.ordem ?? 0) - (b.ordem ?? 0));

        html += `
          <div class="card">
            <h2>🏁 Questões</h2>
            ${bats.length === 0 ? "<p>Nenhuma bateria cadastrada.</p>" : `
              <div class="list">
                ${bats.map(b => `
                  <div class="assunto">
                    <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center">
                      <div>
                        <b>${esc(b.titulo || "Bateria")}</b><br/>
                        <span style="opacity:.85">bateria_id=${esc(b.id)} • ordem=${esc(b.ordem ?? "-")}</span>
                      </div>
                      <button class="btn" onclick="carregarQuestoes(${b.id})">Ver questões</button>
                    </div>
                    <div id="questoes_${b.id}" style="margin-top:12px"></div>
                  </div>
                `).join("")}
              </div>
            `}
          </div>
        `;

        box.innerHTML = html;

      } catch (err) {
        box.innerHTML = renderError("Erro ao carregar aula", err.message);
      }
    }

    async function carregarQuestoes(bateriaId) {
      const alvo = document.getElementById(`questoes_${bateriaId}`);
      if (!alvo) return;
      
      // 🔥 EVITA RECARREGAR
      if (alvo.dataset.loaded === "true") return;

      alvo.innerHTML = "<p>Carregando questões...</p>";

      const endpointsQuestoes = [
        `/baterias/${bateriaId}/questoes`,
        `/questoes?bateria_id=${bateriaId}`
      ];

      try {
        const questoes = await tryMany(endpointsQuestoes);

        if (!questoes || questoes.length === 0) {
          alvo.innerHTML = "<p>Nenhuma questão cadastrada para esta bateria.</p>";
          return;
        }

        questoes.sort((a, b) => (a.ordem ?? 0) - (b.ordem ?? 0));

        alvo.innerHTML = questoes.map((q, idx) => `
          <div class="card" style="margin-top:12px">
            <h2>${idx + 1}. ${esc(q.enunciado || q.pergunta || "Questão")}</h2>

            ${q.alternativas ? `
              <div class="list">
                ${["A", "B", "C", "D", "E"].map(L => `
                  <div class="assunto">
                    <b>${L})</b> ${esc(q.alternativas?.[L] || "")}
                    ${q.comentario?.[L] ? `<div style="opacity:.9;margin-top:6px"><b>Coment:</b> ${esc(q.comentario[L])}</div>` : ""}
                  </div>
                `).join("")}
              </div>
            ` : ""}

            ${q.comentario?.geral ? `<p><b>Comentário:</b> ${esc(q.comentario.geral)}</p>` : ""}
          </div>
        `).join("");

        alvo.dataset.loaded = "true";

        // 🔥 marcar aula como concluída automaticamente
        if (pastaAtualId && aulaAtualId) {
          marcarConcluida(aulaAtualId);
        }

      } catch (err) {
        alvo.innerHTML = renderError("Erro ao carregar questões", err.message);
      }
    }

    window.abrirAula = abrirAula;
    window.carregarQuestoes = carregarQuestoes;
    window.filtrarAulas = filtrarAulas;
    window.marcarRevisaoFeita = marcarRevisaoFeita;
    window.marcarConcluida = marcarConcluida;
    carregarAulas();
  </script>
</body>
</html>
