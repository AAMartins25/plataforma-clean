<!DOCTYPE html>

      align-items: center;
      justify-content: center;
      gap: 1px;

      font-family: inherit;
      font-size: 0.78rem;

      box-shadow: 0 1px 4px rgba(0,0,0,.08);

      background: #f4f8ff;

    .botao-estudo-lateral.ativo {

      border-color: #6ca8ff;

      margin-bottom: 4px;
    }

    .menu-estudo-lateral.menu-questoes {

<body>
  <header style="padding-top:22px;padding-bottom:24px; position:relative;">

    <div style="margin-top:0;">

      position:absolute;

    ">
      <a
        class="btn"
        href="javascript:void(0)"

      <a

  <main class="container" id="conteudo">

            font-weight:400;

        </h2>

      <div id="lista_aulas" style="display:none;"></div>

      <div id="detalhes_aula" style="margin-top:-14px;"></div>

      <div class="card" style="padding:0;height:0px;"></div>

      <div

          text-align:right;

      <div id="menu_estudo_lateral" class="menu-estudo-lateral" style="display:none;">

  </main>

  <div id="menu_estudo_lateral" class="menu-estudo-lateral" style="display:none;">
    <button id="btn_teoria" class="botao-estudo-lateral" onclick="abrirSecaoTeoria(aulaAtualId)" title="Texto">
      <span class="icone-menu-lateral">📖</span>
      <span>T</span>
      <span>e</span>
      <span>x</span>
      <span>t</span>
      <span>o</span>
    </button>

    <button id="btn_video" class="botao-estudo-lateral" onclick="abrirSecaoVideo(aulaAtualId)" title="Vídeo">
      <span class="icone-menu-lateral">🎥</span>
      <span>V</span>
      <span>í</span>
      <span>d</span>
      <span>e</span>
      <span>o</span>
    </button>

    <button id="btn_questoes" class="botao-estudo-lateral" onclick="abrirSecaoQuestoes(aulaAtualId)" title="Questões">
      <span class="icone-menu-lateral">🏁</span>
      <span>Q</span>
      <span>u</span>
      <span>e</span>

    </button>

  <footer style="margin-top:4px;">
    <p>© <span id="ano_atual"></span> - Quality Estudos</p>
  </footer>

  <script>
    const API_BASE = "https://plataforma-quality-backend.onrender.com";
    
    // 🔥 variável global (controle da aula selecionada)
    let aulaAtualId = null;
    let pastaAtualId = null;
    let filtroAulas = "todas";
    let aulasCache = []; 
    let paginasTeoria = [];
    let paginaTeoriaAtual = 0;

    function qs(name) {
      return new URLSearchParams(window.location.search).get(name);
    }

    function esc(s) {
      return String(s ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;");
    }

    function getToken() {
      return localStorage.getItem("access_token");
    }

    function voltarParaAssuntos() {
      const urlSalva = localStorage.getItem("voltar_para_assuntos");

      if (urlSalva) {
        window.location.href = urlSalva;
        return;
      }

      const disciplinaId = qs("disciplina_id");
      const disciplinaNome = qs("disciplina_nome") || "";
      const cursoNome = qs("curso_nome") || "";

      if (disciplinaId) {
        window.location.href =
          `assuntos.html?disciplina_id=${encodeURIComponent(disciplinaId)}` +
          `&disciplina_nome=${encodeURIComponent(disciplinaNome)}` +
          `&curso_nome=${encodeURIComponent(cursoNome)}`;
        return;
      }

      alert("Não foi possível identificar a disciplina para voltar.");
      window.location.href = "cursos.html";
    }

    function confirmarSair() {
      const ok = confirm("Deseja realmente sair da plataforma?");

      if (!ok) return;

      localStorage.removeItem("access_token");
      localStorage.removeItem("me_cache");

      window.location.href = "login.html";
    }

    async function apiGet(path) {
      const token = getToken();

      const res = await fetch(`${API_BASE}${path}`, {
        headers: token ? {
          "Authorization": `Bearer ${token}`
        } : {}
      });

      if (!res.ok) {
        const txt = await res.text();
        throw new Error(`Erro ${res.status} em ${path}\n${txt}`);
      }

      return res.json();
    }

    async function apiPost(path, body = {}) {
      const token = getToken();

      const res = await fetch(`${API_BASE}${path}`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          ...(token ? { "Authorization": `Bearer ${token}` } : {})
        },
        body: JSON.stringify(body)
      });

      if (!res.ok) {
        const txt = await res.text();
        throw new Error(`Erro ${res.status} em ${path}\n${txt}`);
      }

      return res.json();
    }

    async function apiPut(path, body = {}) {
      const token = getToken();

      const res = await fetch(`${API_BASE}${path}`, {
        method: "PUT",
        headers: {
          "Content-Type": "application/json",
          ...(token ? { "Authorization": `Bearer ${token}` } : {})
        },
        body: JSON.stringify(body)
      });

      if (!res.ok) {
        const txt = await res.text();
        throw new Error(`Erro ${res.status} em ${path}\n${txt}`);
      }

      return res.json();
    }

    async function tryMany(endpoints) {
      let lastErr = null;
      for (const ep of endpoints) {
        try {
          return await apiGet(ep);
        } catch (err) {
          lastErr = err;
        }
      }
      throw new Error(
        `Falhou em todos os endpoints:\n${endpoints.join("\n")}\n\nÚltimo erro:\n${lastErr?.message || ""}`
      );
    }

    function renderError(title, msg) {
      return `
        <div class="card" style="border-top-color:#6B4F3F">
          <h2>${esc(title)}</h2>
          <pre style="white-space:pre-wrap">${esc(msg)}</pre>
        </div>
      `;
    }

    function destacarBotaoSecao(secao) {
      const botoes = {
        teoria: document.getElementById("btn_teoria"),
        video: document.getElementById("btn_video"),
        questoes: document.getElementById("btn_questoes")
      };

      Object.values(botoes).forEach(btn => {
        if (btn) btn.classList.remove("ativo");
      });

      if (botoes[secao]) {
        botoes[secao].classList.add("ativo");
      }

      const menu = document.getElementById("menu_estudo_lateral");

      if (menu) {
        if (secao === "questoes") {
          menu.classList.add("menu-questoes");
        } else {
          menu.classList.remove("menu-questoes");
        }
      }
    }

    async function getProgressoBackend(pastaId) {
      try {
        const dados = await apiGet(`/me/progresso?pasta_id=${pastaId}`);
        return dados.map(p => p.aula_id);
      } catch (err) {
        console.warn("Falha ao buscar progresso no backend:", err);
        return [];
      }
    }

    function salvarProgresso(pastaId, lista) {
      localStorage.setItem(`progresso_${pastaId}`, JSON.stringify(lista));
    }

    function getRevisoes(pastaId) {
      try {
        const dados = localStorage.getItem(`revisoes_${pastaId}`);
        return dados ? JSON.parse(dados) : [];
      } catch {
        return [];
      }
    }

    function salvarRevisoes(pastaId, lista) {
      localStorage.setItem(`revisoes_${pastaId}`, JSON.stringify(lista));
    }

    function adicionarDias(data, dias) {
      const novaData = new Date(data);
      novaData.setDate(novaData.getDate() + dias);
      return novaData.toISOString().slice(0, 10);
    }

    function hojeISO() {
      return new Date().toISOString().slice(0, 10);
    }

    function calcularDiasAtraso(dataISO) {
      const hoje = new Date(hojeISO());
      const data = new Date(dataISO);
      const diff = hoje - data;
      return Math.floor(diff / (1000 * 60 * 60 * 24));
    }

    function criarRevisaoInicial(aulaId) {
      if (!pastaAtualId) return;

      const revisoes = getRevisoes(pastaAtualId);
      const jaExiste = revisoes.some(r => r.aulaId === aulaId);

      if (jaExiste) return;

      revisoes.push({
        aulaId: aulaId,
        etapa: 1,
        proximaRevisao: adicionarDias(new Date(), 7)
      });

      salvarRevisoes(pastaAtualId, revisoes);
    }

    function criarOuAtualizarRevisaoDoAssunto() {
      if (!pastaAtualId) return;

      const revisoes = getRevisoes(pastaAtualId);
      const hoje = hojeISO();

      const modoRevisao =
        localStorage.getItem(`modo_revisao_assunto_${pastaAtualId}`) === "1";

      const assuntoRefeito =
        localStorage.getItem(`assunto_refeito_${pastaAtualId}`) === "1";

      let revisaoAtual = revisoes.find(r =>
        r.tipo === "ASSUNTO" && r.concluida !== true
      );

      if (!revisaoAtual) {
        revisoes.push({
          tipo: "ASSUNTO",
          etapa: 1,
          proximaRevisao: adicionarDias(new Date(), 7),
          concluida: false
        });

        salvarRevisoes(pastaAtualId, revisoes);
        localStorage.removeItem(`assunto_refeito_${pastaAtualId}`);
        return;
      }

      if (revisaoAtual.proximaRevisao > hoje) {
        if (!assuntoRefeito) return;

        revisaoAtual.etapa = 1;
        revisaoAtual.proximaRevisao = adicionarDias(new Date(), 7);
        revisaoAtual.concluida = false;

        salvarRevisoes(pastaAtualId, revisoes);
        localStorage.removeItem(`assunto_refeito_${pastaAtualId}`);
        return;
      }

      if (revisaoAtual.proximaRevisao <= hoje) {
        if (!modoRevisao || !assuntoRefeito) return;

        if (revisaoAtual.etapa >= 4) {
          revisaoAtual.concluida = true;

          salvarRevisoes(pastaAtualId, revisoes);

          localStorage.removeItem(`modo_revisao_assunto_${pastaAtualId}`);
          localStorage.removeItem(`assunto_refeito_${pastaAtualId}`);
          return;
        }

        const proximaEtapa = revisaoAtual.etapa + 1;

        const intervalos = {
          2: 15,
          3: 21,
          4: 28
        };

        revisaoAtual.etapa = proximaEtapa;
        revisaoAtual.proximaRevisao = adicionarDias(
          new Date(),
          intervalos[proximaEtapa]
        );
        revisaoAtual.concluida = false;

        salvarRevisoes(pastaAtualId, revisoes);

        localStorage.removeItem(`modo_revisao_assunto_${pastaAtualId}`);
        localStorage.removeItem(`assunto_refeito_${pastaAtualId}`);
      }
    }

    function marcarRevisaoFeita(aulaId) {
      if (!pastaAtualId) return;

      const intervalos = {
        1: 7,
        2: 15,
        3: 21
      };

      const revisoes = getRevisoes(pastaAtualId);

      const novasRevisoes = revisoes.map(r => {
        if (r.aulaId !== aulaId) return r;

        const novaEtapa = r.etapa + 1;
        const dias = intervalos[r.etapa] || 28;

        return {
          ...r,
          etapa: novaEtapa,
          proximaRevisao: adicionarDias(new Date(), dias)
        };
      });

      salvarRevisoes(pastaAtualId, novasRevisoes);
      carregarAulas();
    }

    async function marcarConcluida(aulaId) {
      if (!pastaAtualId) return;

      try {
        await apiPost(`/me/progresso/aulas/${aulaId}/concluir`);

        await carregarAulas();

        aulaAtualId = null;
        abrirAula(aulaId);

      } catch (err) {
        alert("Erro ao salvar progresso no servidor.");
        console.error(err);
      }
    }

    function filtrarAulas(tipo) {
      filtroAulas = tipo;
      carregarAulas();
    }

    async function carregarAulas() {
      const pastaId = qs("pasta_id");
      const assuntoId = qs("assunto_id");
      const disciplinaNome = qs("disciplina_nome") || "";
      const assuntoNome = qs("assunto_nome") || "";
      const abrir = qs("abrir");

      const tituloDisciplina = document.getElementById("titulo_disciplina");
      const cardAssuntoTitulo = document.getElementById("card_assunto_titulo");
      if (tituloDisciplina) {
        tituloDisciplina.innerText = disciplinaNome
          ? `📘 ${disciplinaNome}`
          : "📘 Disciplina";
      }

      if (cardAssuntoTitulo) {
        cardAssuntoTitulo.innerText = assuntoNome
          ? `${assuntoNome} - Parte I`
          : "Assunto - Parte I";
      }

      pastaAtualId = pastaId; 

      // subtítulo removido do cabeçalho

      if (!pastaId) {
        document.getElementById("lista_aulas").innerHTML =
          "<p>Erro: faltou pasta_id na URL.</p>";
        return;
      }

      const endpointsAulas = [
        `/pastas/${pastaId}/aulas`,
        `/aulas?pasta_id=${pastaId}`
      ];

      let aulas;
      try {
        aulas = await tryMany(endpointsAulas);
      } catch (err) {
        document.getElementById("lista_aulas").innerHTML = renderError(
          "Não consegui listar aulas",
          err.message
        );
        return;
      }

      if (!aulas || aulas.length === 0) {
        document.getElementById("lista_aulas").innerHTML =
          "<p>Nenhuma aula encontrada nesta pasta.</p>";
        return;
      }

      aulas.sort((a, b) => (a.ordem ?? 0) - (b.ordem ?? 0));
      aulasCache = aulas;

      const aulaPrincipal = aulas[0];

      if (!aulaPrincipal) {
        document.getElementById("lista_aulas").innerHTML =
          "<p>Nenhuma aula encontrada para este assunto.</p>";
        return;
      }

      aulaAtualId = aulaPrincipal.id;

      document.getElementById("lista_aulas").innerHTML = "";
      document.getElementById("menu_estudo_lateral").style.display = "flex";

      document.getElementById("detalhes_aula").innerHTML = "";

      if (abrir === "questoes") {
        abrirSecaoQuestoes(aulaPrincipal.id);
      } else if (abrir === "video") {
        abrirSecaoVideo(aulaPrincipal.id);
      } else {
        abrirSecaoTeoria(aulaPrincipal.id);
      }

      return;

      const lista = document.getElementById("lista_aulas");

      const progresso = await getProgressoBackend(pastaAtualId);
      const progressoSet = new Set(progresso);

      const totalAulas = aulas.length;
      const aulasConcluidas = aulas.filter(a => progressoSet.has(a.id)).length;
      const percentualProgresso = totalAulas > 0
        ? Math.round((aulasConcluidas / totalAulas) * 100)
        : 0;

      const ultimaAulaId = localStorage.getItem(`ultima_aula_${pastaAtualId}`);
      const ultimaAulaIdNum = Number(ultimaAulaId);

      // 🔥 valida se a aula ainda existe na lista
      const aulaExiste = aulas.some(a => a.id === ultimaAulaIdNum);
      
      if (!aulaExiste) {
        localStorage.removeItem(`ultima_aula_${pastaAtualId}`);
      }

      let html = "";

      const revisoes = getRevisoes(pastaAtualId);
      const hoje = hojeISO();

      const revisoesPendentes = revisoes.filter(r => {
        return r.proximaRevisao <= hoje;
      });

      const revisoesAtrasadas = revisoesPendentes.filter(r => r.proximaRevisao < hoje);

      if (revisoesPendentes.length > 0) {
        if (revisoesAtrasadas.length > 0) {
          html += `
            <div class="card alerta-revisoes">
              <h3>⚠️ Atenção: ${revisoesAtrasadas.length} revisão(ões) atrasada(s)</h3>
              <p>Priorize essas revisões.</p>
            </div>
          `;
        }

        html += `
          <div class="card" style="padding-left:0;">
            <h3>🔁 Revisões pendentes: ${revisoesPendentes.length}</h3>

            <div class="list">
              ${revisoesPendentes.map(r => {
                const aula = aulas.find(a => a.id === r.aulaId);

                const atrasada = r.proximaRevisao < hoje;

                return `
                  <div class="assunto ${atrasada ? 'revisao-atrasada' : 'revisao-hoje'}">
                    <b>${esc(aula?.titulo || "Aula")}</b><br/>

                    <span style="opacity:.85">
                      Revisão etapa ${esc(r.etapa)} • prevista para ${esc(r.proximaRevisao)}
                    </span><br/>

                    <span class="status-revisao">
                      ${
                        atrasada
                          ? `⚠️ Atrasada há ${calcularDiasAtraso(r.proximaRevisao)} dia(s)`
                          : "📌 Revisão para hoje"
                      }
                    </span><br/>

                    <button class="btn" onclick="marcarRevisaoFeita(${r.aulaId})">
                      Marcar revisão feita
                    </button>
                  </div>
                `;
              }).join("")}
            </div>
          </div>
        `;
      }

      // 🔽 lista normal de aulas (SEMPRE EXECUTA)
      const aulasFiltradas = aulas.filter(a => {
        const concluida = progressoSet.has(a.id);

        if (filtroAulas === "concluidas") return concluida;
        if (filtroAulas === "nao_concluidas") return !concluida;
        return true;
      });

      html += aulasFiltradas.map((a) => `
        <div class="disciplina ${progressoSet.has(a.id) ? 'concluida' : ''}" id="aula_${a.id}">
          <div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap">

            <div style="flex:1; min-width:240px;">
              <div style="font-weight:bold">
                ${esc(a.titulo)}
                ${progressoSet.has(a.id) ? '<span style="color:#16a34a; margin-left:6px;">✓</span>' : ''}
              </div>
            </div>

            <div style="display:flex;flex-direction:column;align-items:flex-end;gap:8px;min-width:220px;margin-top:6px;">
              <button class="btn" style="margin-top:-6px;" onclick="abrirAula(${a.id})">Abrir</button>
            </div>
          </div>
        </div>
      `).join("");

      lista.innerHTML = html;  
    }
    
    function renderVideo(url) {
      if (!url || typeof url !== "string") return "";

      if (url.includes("youtube.com") || url.includes("youtu.be")) {
        let videoId = "";

        if (url.includes("youtu.be")) {
          videoId = url.split("/").pop().split("?")[0];
        } else {
          try {
            const params = new URL(url).searchParams;
            videoId = params.get("v");
          } catch (e) {
            return `<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">Abrir vídeo</a>`;
          }
        }

        if (videoId) {
          return `
            <iframe 
              width="100%" 
              height="315" 
              src="https://www.youtube.com/embed/${videoId}" 
              frameborder="0"
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
              allowfullscreen>
            </iframe>
          `;
        }
      }

      return `<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">Abrir vídeo</a>`;
    }
    
    async function abrirAula(aulaId) {
      if (aulaAtualId === aulaId) return;
      aulaAtualId = aulaId; 

      // 🔥 salvar progresso
      if (pastaAtualId) {
        localStorage.setItem(`ultima_aula_${pastaAtualId}`, aulaId);
      }

      // 🔥 remove destaque anterior
      const anterior = document.querySelector(".disciplina.ativa");
      if (anterior) anterior.classList.remove("ativa");

      // 🔥 adiciona destaque na atual
      const elAula = document.getElementById(`aula_${aulaId}`);
      if (elAula) elAula.classList.add("ativa");

      const box = document.getElementById("detalhes_aula");

      // 🔽 scroll suave até o conteúdo (corrigido)
      box.scrollIntoView({ behavior: "smooth" });

      box.innerHTML = `
        <div class="card">
          <h2>Carregando aula ${esc(aulaId)}...</h2>
        </div>
      `;

      try {
        const endpointsVideos = [
          `/aulas/${aulaId}/videos`,
          `/videos?aula_id=${aulaId}`
        ];

        const endpointsMateriais = [
          `/aulas/${aulaId}/materiais`,
          `/materiais?aula_id=${aulaId}`
        ];

        const endpointsBaterias = [
          `/aulas/${aulaId}/baterias`,
          `/baterias?aula_id=${aulaId}`
        ];

        const [videosRes, materiaisRes, bateriasRes] = await Promise.allSettled([
          tryMany(endpointsVideos),
          tryMany(endpointsMateriais),
          tryMany(endpointsBaterias)
        ]);

        const videos = videosRes.status === "fulfilled" ? videosRes.value : [];
        const materiais = materiaisRes.status === "fulfilled" ? materiaisRes.value : [];
        const baterias = bateriasRes.status === "fulfilled" ? bateriasRes.value : [];

        let avisos = "";

        if (videosRes.status === "rejected") {
          avisos += `<p style="color:orange">⚠️ Vídeos ainda não disponíveis. Por favor, aguarde!</p>`;
        }

        if (materiaisRes.status === "rejected") {
          avisos += `<p style="color:orange">⚠️ Material ainda não disponível. Por favor, aguarde!</p>`;
        }

        if (bateriasRes.status === "rejected") {
          avisos += `<p style="color:orange">⚠️ Sprints ainda não disponíveis. Favor aguardar!</p>`;
        }
             
        const progresso = await getProgressoBackend(pastaAtualId);
        const aulaConcluida = progresso.includes(aulaId);

        const aulaSelecionada = aulasCache.find(a => a.id === aulaId);
        const tituloAula = aulaSelecionada?.titulo || `Aula ${aulaId}`;
        const disciplinaNome = qs("disciplina_nome") || "Disciplina";

        let html = `
          <div class="card">
            <div style="font-weight:bold; opacity:.85; margin-bottom:6px;">
              ${esc(disciplinaNome)}
            </div>
            <h2>📌 ${esc(tituloAula)}</h2>

            ${avisos}

          </div>
        `;

        const mats = Array.isArray(materiais) ? materiais : [];
        html += `
          <div class="card">
            <h2>📄 Teoria em Texto</h2>
            ${mats.length === 0 ? "<p>Nenhum material cadastrado.</p>" : `
              <div class="list">
                ${mats.map(m => `
                  <div class="assunto">
                    <b>${esc(m.tipo || "Material")}</b><br/>
                    ${m.url ? `<a href="${esc(m.url)}" target="_blank" rel="noopener noreferrer">Abrir</a>` : ""}
                    ${m.texto ? `
                      <div style="margin-top:10px;">
                        <pre style="white-space:pre-wrap">${esc(m.texto)}</pre>
                      </div>` : ""
                    }
                    ${m.descricao ? `<div style="margin-top:8px;opacity:.85">${esc(m.descricao)}</div>` : ""}
                  </div>
                `).join("")}
              </div>
            `}
          </div>
        `;

        const vids = Array.isArray(videos) ? videos : [];
        vids.sort((a, b) => (a.ordem ?? 0) - (b.ordem ?? 0));

        html += `
          <div class="card">
            <h2>🎥 Resumo em Vídeo</h2>
            ${vids.length === 0 ? "<p>Nenhum vídeo cadastrado.</p>" : `
              <div class="list">
                ${vids.map(v => `
                  <div class="assunto">
                    <b>Ordem ${esc(v.ordem ?? "-")}</b><br/>
                    <span>${esc(v.titulo || "Vídeo")}</span><br/>
                    ${renderVideo(v.url)}
                  </div>
                `).join("")}
              </div>
            `}
          </div>
        `;

        

        const bats = Array.isArray(baterias) ? baterias : [];
        bats.sort((a, b) => (a.ordem ?? 0) - (b.ordem ?? 0));

        html += `
          <div class="card">
            <h2>🏁 Questões</h2>
            ${bats.length === 0 ? "<p>Nenhuma bateria cadastrada.</p>" : `
              <div class="list">
                ${bats.map(b => `
                  <div class="assunto">
                    <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center">
                      <div>
                        <b>${esc(b.titulo || "Bateria")}</b><br/>
                        <span style="opacity:.85">bateria_id=${esc(b.id)} • ordem=${esc(b.ordem ?? "-")}</span>
                      </div>
                      <button class="btn" onclick="carregarQuestoes(${b.id})">Ver questões</button>
                    </div>
                    <div id="questoes_${b.id}" style="margin-top:12px"></div>
                  </div>
                `).join("")}
              </div>
            `}
          </div>
        `;

        box.innerHTML = html;

      } catch (err) {
        box.innerHTML = renderError("Erro ao carregar aula", err.message);
      }
    }

    async function carregarQuestoes(bateriaId) {
      const alvo = document.getElementById(`questoes_${bateriaId}`);
      if (!alvo) return;
      
      // 🔥 EVITA RECARREGAR
      if (alvo.dataset.loaded === "true") return;

      alvo.innerHTML = "<p>Carregando questões...</p>";

      const endpointsQuestoes = [
        `/baterias/${bateriaId}/questoes`,
        `/questoes?bateria_id=${bateriaId}`
      ];

      try {
        const questoes = await tryMany(endpointsQuestoes);

        if (!questoes || questoes.length === 0) {
          alvo.innerHTML = "<p>Nenhuma questão cadastrada para esta bateria.</p>";
          return;
        }

        questoes.sort((a, b) => (a.ordem ?? 0) - (b.ordem ?? 0));

        alvo.innerHTML = questoes.map((q, idx) => `
          <div class="card" style="margin-top:12px">
            <h2>${idx + 1}. ${esc(q.enunciado || q.pergunta || "Questão")}</h2>

            ${q.alternativas ? `
              <div class="list">
                ${["A", "B", "C", "D", "E"].map(L => `
                  <div class="assunto">
                    <b>${L})</b> ${esc(q.alternativas?.[L] || "")}
                    ${q.comentario?.[L] ? `<div style="opacity:.9;margin-top:6px"><b>Coment:</b> ${esc(q.comentario[L])}</div>` : ""}
                  </div>
                `).join("")}
              </div>
            ` : ""}

            ${q.comentario?.geral ? `<p><b>Comentário:</b> ${esc(q.comentario.geral)}</p>` : ""}
          </div>
        `).join("");

        alvo.dataset.loaded = "true";

        // 🔥 marcar aula como concluída automaticamente
        if (pastaAtualId && aulaAtualId) {
          marcarConcluida(aulaAtualId);
        }

      } catch (err) {
        alvo.innerHTML = renderError("Erro ao carregar questões", err.message);
      }
    }

    function limparTextoTeoria(texto) {
      return String(texto || "")
        .split("\n")
        .map(linha => linha.trim())
        .join("\n");
    }

    function dividirTextoEmPaginas(texto, limite = 2600) {
      const partes = String(texto || "").split(/\n\s*\n/);
      const paginas = [];
      let atual = "";

      for (const parte of partes) {
        if ((atual + "\n\n" + parte).length > limite && atual.trim()) {
          paginas.push(atual.trim());
          atual = parte;
        } else {
          atual += atual ? "\n\n" + parte : parte;
        }
      }

      if (atual.trim()) paginas.push(atual.trim());

      return paginas.length ? paginas : [""];
    }

    function renderizarPaginaTeoria() {
      const box = document.getElementById("detalhes_aula");
      const texto = paginasTeoria[paginaTeoriaAtual] || "";

      box.innerHTML = `
        <div class="card" style="padding:14px 18px 18px; position:relative;">
          <div style="
            line-height:1.8;
            white-space:pre-line;
            text-indent:0;
            text-align:justify;
          ">
            ${esc(texto)}
          </div>

          ${
            paginasTeoria.length > 1 && paginaTeoriaAtual < paginasTeoria.length - 1
              ? `
                <div style="
                  position:absolute;
                  right:0;
                  bottom:-38px;
                ">
                  <button class="btn" onclick="proximaPaginaTeoria()" title="Próxima página">
                    ⇨
                  </button>
                </div>
              `
              : ""
          }
        </div>
      `;

      const paginacao = document.getElementById("paginacao_teoria");
      if (paginacao) {
        paginacao.innerText = `${paginaTeoriaAtual + 1}/${paginasTeoria.length}`;
      }

    }

    function proximaPaginaTeoria() {
      if (paginaTeoriaAtual < paginasTeoria.length - 1) {
        paginaTeoriaAtual++;
        renderizarPaginaTeoria();
        document.getElementById("detalhes_aula").scrollIntoView({ behavior: "smooth" });
      }
    }

    async function abrirSecaoTeoria(aulaId) {
      aulaAtualId = aulaId;

      destacarBotaoSecao("teoria");

      const box = document.getElementById("detalhes_aula");
      box.innerHTML = `
        <div class="card">
          <p>Carregando teoria...</p>
        </div>
      `;

      box.scrollIntoView({ behavior: "smooth" });

      try {
        const materiais = await tryMany([
          `/aulas/${aulaId}/materiais`,
          `/materiais?aula_id=${aulaId}`
        ]);

        const textos = (materiais || []).filter(m => m.tipo === "TEXTO");

        if (textos.length === 0) {
          box.innerHTML = `
            <div class="card">
              <p>Nenhum texto cadastrado.</p>
            </div>
          `;
          return;
        }

        const textoCompleto = textos
          .map(t => limparTextoTeoria(t.conteudo || t.texto || ""))
          .join("\n\n");

        paginasTeoria = dividirTextoEmPaginas(textoCompleto, 2600);
        paginaTeoriaAtual = 0;

        renderizarPaginaTeoria();

      } catch (err) {
        box.innerHTML = renderError("Erro ao carregar teoria", err.message);
      }
    }

    async function abrirSecaoVideo(aulaId) {
      aulaAtualId = aulaId;

      destacarBotaoSecao("video");

      const box = document.getElementById("detalhes_aula");
      const paginacao = document.getElementById("paginacao_teoria");
      if (paginacao) paginacao.innerText = "";

      box.innerHTML = `
        <div class="card">
          <p>Carregando vídeos...</p>
        </div>
      `;

      box.scrollIntoView({ behavior: "smooth" });

      try {
        const videos = await tryMany([
          `/aulas/${aulaId}/videos`,
          `/videos?aula_id=${aulaId}`
        ]);

        const vids = Array.isArray(videos) ? videos : [];
        vids.sort((a, b) => (a.ordem ?? 0) - (b.ordem ?? 0));

        box.innerHTML = `
          <div class="card">

            ${
              vids.length === 0
                ? "<p>Nenhum vídeo cadastrado.</p>"
                : vids.map(v => `
                    <div class="assunto">
                      <h3>${esc(v.titulo || "Vídeo")}</h3>
                      ${renderVideo(v.url)}
                    </div>
                  `).join("")
            }
          </div>
        `;

      } catch (err) {
        box.innerHTML = renderError("Erro ao carregar vídeos", err.message);
      }
    }

    async function limparRefazerSprint(bateriaId) {
      const ok = confirm("Confirma recomeçar a sprint?");

      if (!ok) return;

      if (pastaAtualId) {
        localStorage.setItem(`assunto_refeito_${pastaAtualId}`, "1");
      }

      try {
        await apiPut(`/baterias/${bateriaId}/limpar-minha-sprint`, {});

        const urlRetorno = window.location.href.includes("abrir=questoes")
          ? window.location.href
          : window.location.href + "&abrir=questoes";

        localStorage.setItem("voltar_para_questoes", urlRetorno);

        window.location.href =
          `sprint.html?bateria_id=${bateriaId}` +
          `&titulo=${encodeURIComponent("Bateria de questões")}` +
          `&assunto_nome=${encodeURIComponent(qs("assunto_nome") || "")}`;

      } catch (err) {
        console.error(err);
        alert("Erro ao limpar sprint.");
      }
    }

    async function abrirSecaoQuestoes(aulaId) {
      aulaAtualId = aulaId;

      destacarBotaoSecao("questoes");

      const paginacao = document.getElementById("paginacao_teoria");
      if (paginacao) paginacao.innerText = "";

      const box = document.getElementById("detalhes_aula");
      box.innerHTML = `
        <div class="card">
          <p>Carregando baterias...</p>
        </div>
      `;

      box.scrollIntoView({ behavior: "smooth" });

      try {
        const baterias = await apiGet(`/aulas/${aulaId}/baterias-com-status`);

        const concluidas = (baterias || []).filter(
          b => b.status_bateria === "CONCLUIDA" || b.status === "CONCLUIDA"
        );

        const todasAsBateriasDoAssuntoFeitas =
          concluidas.length > 0 &&
          concluidas.every(b => b.status_aluno === "FEITA");

        if (todasAsBateriasDoAssuntoFeitas) {
          criarOuAtualizarRevisaoDoAssunto();
        }

        box.innerHTML = `
          <div class="card" style="padding:14px 18px 18px;">
            ${
              concluidas.length === 0
                ? "<p>Nenhuma bateria concluída disponível ainda.</p>"
                : `
                  <div class="list">
                    ${concluidas.map(b => `
                      <div class="assunto" style="padding:12px 14px;">
                        <div style="
                          display:flex;
                          justify-content:space-between;
                          align-items:center;
                          gap:12px;
                          flex-wrap:wrap;
                        ">
                          <div style="flex:1; min-width:220px;">
                            <div style="font-weight:700;">
                              ${esc(b.titulo || "Bateria de questões")}
                            </div>

                            ${
                              b.status_aluno === "FEITA"
                                ? `
                                  <div style="
                                    margin-top:6px;
                                    font-size:0.86rem;
                                    color:#4b5563;
                                  ">
                                    Desempenho: ${b.percentual_acerto}%
                                  </div>
                                `
                                : ""
                            }
                          </div>

                          <div style="
                            display:flex;
                            align-items:center;
                            gap:8px;
                            flex-wrap:wrap;
                            justify-content:flex-end;
                          ">
                            ${
                              b.status_aluno === "EM_ANDAMENTO"
                                ? `
                                  <span style="
                                    padding:4px 10px;
                                    border:1px solid #8a5a00;
                                    border-radius:999px;
                                    font-size:0.82rem;
                                  ">
                                    EM ANDAMENTO
                                  </span>
                                `
                                : ""
                            }

                            ${
                              b.status_aluno === "FEITA"
                                ? `
                                  <span style="
                                    padding:4px 10px;
                                    border:1px solid #2f5e46;
                                    border-radius:999px;
                                    font-size:0.82rem;
                                    position:relative;
                                    top:6.5px;
                                  ">
                                    FEITA
                                  </span>
                                `
                                : ""
                            }

                            ${
                              b.status_aluno === "FEITA"
                                ? `
                                  <a
                                    class="btn"
                                    onclick="localStorage.setItem('voltar_para_questoes', window.location.href + '&abrir=questoes')"
                                    href="sprint.html?bateria_id=${b.id}&titulo=${encodeURIComponent(b.titulo || "Bateria de questões")}&modo=visualizar&assunto_nome=${encodeURIComponent(qs("assunto_nome") || "")}"
                                    style="
                                      min-width:112px;
                                      height:40px;
                                      padding:0 14px;
                                      display:inline-flex;
                                      align-items:center;
                                      justify-content:center;
                                      font-weight:700;
                                      font-size:0.8rem;
                                      font-family:inherit;
                                    "
                                  >
                                    visualizar
                                  </a>
                                `
                                : b.status_aluno === "EM_ANDAMENTO"
                                  ? `
                                    <a
                                      class="btn"
                                      onclick="localStorage.setItem('voltar_para_questoes', window.location.href + '&abrir=questoes')"
                                      href="sprint.html?bateria_id=${b.id}&titulo=${encodeURIComponent(b.titulo || "Bateria de questões")}&assunto_nome=${encodeURIComponent(qs("assunto_nome") || "")}"
                                      style="
                                        min-width:132px;
                                        height:40px;
                                        padding:0 14px;
                                        display:inline-flex;
                                        align-items:center;
                                        justify-content:center;
                                        font-weight:700;
                                        font-size:0.9rem;
                                        font-family:inherit;
                                      "
                                    >
                                      continuar
                                    </a>
                                  `
                                  : `
                                    <a
                                      class="btn"
                                      onclick="localStorage.setItem('voltar_para_questoes', window.location.href + '&abrir=questoes')"
                                      href="sprint.html?bateria_id=${b.id}&titulo=${encodeURIComponent(b.titulo || "Bateria de questões")}&assunto_nome=${encodeURIComponent(qs("assunto_nome") || "")}"
                                      style="
                                        min-width:112px;
                                        height:40px;
                                        padding:0 14px;
                                        display:inline-flex;
                                        align-items:center;
                                        justify-content:center;
                                        font-weight:700;
                                        font-size:0.9rem;
                                        font-family:inherit;
                                      "
                                    >
                                      fazer
                                    </a>
                                  `
                            }

                            ${
                              b.status_aluno === "FEITA" || b.status_aluno === "EM_ANDAMENTO"
                                ? `
                                  <button
                                    class="btn"
                                    type="button"
                                    onclick="limparRefazerSprint(${b.id})"
                                    style="
                                      min-width:126px;
                                      height:40px;
                                      padding:0 14px;
                                      border:none;
                                      box-shadow:none;
                                      display:inline-flex;
                                      align-items:center;
                                      justify-content:center;
                                      font-weight:700;
                                      font-size:0.9rem;
                                      font-family:inherit;
                                    "
                                  >
                                    limpar e refazer
                                  </button>
                                `
                                : ""
                            }
                          </div>
                        </div>
                      </div>
                    `).join("")}
                  </div>
                `
            }
          </div>
        `;

      } catch (err) {
        box.innerHTML = renderError("Erro ao carregar baterias", err.message);
      }
    }

    window.abrirAula = abrirAula;
    window.carregarQuestoes = carregarQuestoes;
    window.filtrarAulas = filtrarAulas;
    window.marcarRevisaoFeita = marcarRevisaoFeita;
    window.marcarConcluida = marcarConcluida;
    carregarAulas();
    window.abrirSecaoTeoria = abrirSecaoTeoria;
    window.abrirSecaoVideo = abrirSecaoVideo;
    window.limparRefazerSprint = limparRefazerSprint;
    window.abrirSecaoQuestoes = abrirSecaoQuestoes;

    const anoAtual = document.getElementById("ano_atual");
    if (anoAtual) {
      anoAtual.textContent = new Date().getFullYear();
    }

    window.proximaPaginaTeoria = proximaPaginaTeoria;

  </script>
</body>
</html>
