<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minhas anotações</title>

  <link rel="stylesheet" href="css/style.css">
</head>

<body
  class="minhas-anotacoes-page"
  data-page="minhas-anotacoes"
>

<header class="minhas-anotacoes-header">

  <div class="minhas-anotacoes-header-identificacao">

    <h1 id="titulo_curso_minhas_anotacoes"></h1>

    <h2>
      📝 Anotações
    </h2>

  </div>

  <nav class="minhas-anotacoes-header-acoes">

    <a
      class="btn"
      href="javascript:history.back()"
      title="Voltar"
      aria-label="Voltar"
    >
      ⇦
    </a>

    <a
      class="btn"
      href="index.html"
      title="Início"
      aria-label="Início"
    >
      ⌂
    </a>

    <a
      class="btn"
      href="javascript:void(0)"
      onclick="logout()"
      title="Sair"
      aria-label="Sair"
    >
      ⎋
    </a>

  </nav>

</header>

<main class="container">

  <div class="card minhas-anotacoes-escolha-card">

    <h2 class="minhas-anotacoes-escolha-titulo">
      Escolha
    </h2>

    <div class="minhas-anotacoes-filtros">

      <div class="minhas-anotacoes-filtro-grupo">

        <label for="filtro_disciplina">
          Disciplina
        </label>

        <select
          id="filtro_disciplina"
          class="minhas-anotacoes-select"
        >
        </select>

      </div>

      <div class="minhas-anotacoes-filtro-grupo">

        <label for="filtro_assunto">
          Assunto
        </label>

        <select
          id="filtro_assunto"
          class="minhas-anotacoes-select"
        >
        </select>

      </div>

    </div>

  </div>

  <div class="card minhas-anotacoes-total-card">

    <h2
      id="total_anotacoes"
      class="minhas-anotacoes-total-titulo"
    >
      Total: 0 anotações
    </h2>

  </div>

  <div id="area_anotacoes">

  </div>

</main>

<footer>
  <p>
    © <span id="ano_atual"></span> - Quality Estudos
  </p>
</footer>

<script>

const API_BASE =
"https://plataforma-quality-backend.onrender.com";

let anotacoes = [];

const tituloCursoMinhasAnotacoes =
  document.getElementById(
    "titulo_curso_minhas_anotacoes"
  );

if (tituloCursoMinhasAnotacoes) {
  tituloCursoMinhasAnotacoes.innerText =
    new URLSearchParams(
      window.location.search
    ).get("curso_nome") ||
    "Curso";
}

function logout() {

  localStorage.removeItem("access_token");

  window.location.href = "index.html";
}

function getToken() {

  return localStorage.getItem("access_token");
}

function esc(texto) {

  if (texto == null) return "";

  return String(texto)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}

async function apiGet(path) {

  const token = getToken();

  const res = await fetch(
    `${API_BASE}${path}`,
    {
      headers: {
        Authorization: `Bearer ${token}`
      }
    }
  );

  if (!res.ok) {

    throw new Error(
      `Erro ${res.status}`
    );
  }

  return await res.json();
}

async function exibirNomeUsuarioLogadoAnotacoes() {
  const token = getToken();

  if (!token) {
    return;
  }

  try {
    const me = await apiGet("/me");

    if (!me || !me.nome) {
      return;
    }

    const partesNome = String(me.nome)
      .trim()
      .split(/\s+/)
      .filter(Boolean);

    if (partesNome.length === 0) {
      return;
    }

    const primeiroNome =
      partesNome[0];

    const ultimoNome =
      partesNome.length > 1
        ? partesNome[partesNome.length - 1]
        : "";

    const nomeCompletoResumido =
      ultimoNome
        ? `${primeiroNome} ${ultimoNome}`
        : primeiroNome;

    const identificacao =
      document.createElement("div");

    identificacao.id =
      "nomeUsuarioLogadoGlobal";

    identificacao.textContent =
      primeiroNome.toUpperCase();

    identificacao.title =
      nomeCompletoResumido.toUpperCase();

    identificacao.style.position =
      "fixed";

    identificacao.style.top =
      "9px";

    identificacao.style.right =
      "47px";

    identificacao.style.zIndex =
      "9999";

    identificacao.style.fontSize =
      "0.68rem";

    identificacao.style.fontWeight =
      "600";

    identificacao.style.letterSpacing =
      "0.4px";

    identificacao.style.color =
      "#4b5563";

    identificacao.style.opacity =
      "0.78";

    identificacao.style.cursor =
      "default";

    identificacao.style.whiteSpace =
      "nowrap";

    document.body.appendChild(
      identificacao
    );

  } catch (err) {
    console.warn(
      "Não foi possível exibir o nome do aluno:",
      err
    );
  }
}

async function carregarAnotacoes() {

  try {

    anotacoes =
      await apiGet("/me/minhas-anotacoes");

    preencherFiltroDisciplinas();

    renderizarAnotacoes();

  } catch (err) {

    console.error(err);

    document.getElementById(
      "area_anotacoes"
    ).innerHTML = `
      <div class="card">
        Erro ao carregar anotações.
      </div>
    `;
  }
}

function preencherFiltroDisciplinas() {

  const select =
    document.getElementById(
      "filtro_disciplina"
    );

  const disciplinas = [
    ...new Map(
      anotacoes.map(a => [
        a.disciplina_id,
        {
          id: a.disciplina_id,
          nome: a.disciplina_nome,
          ordem: a.disciplina_ordem
        }
      ])
    ).values()
  ];

  disciplinas.sort(
    (a,b) => a.ordem - b.ordem
  );

  select.innerHTML =
    `<option value="">TODAS</option>`;

  disciplinas.forEach(d => {

    select.innerHTML += `
      <option value="${d.id}">
        ${esc(d.nome)}
      </option>
    `;
  });

  preencherFiltroAssuntos();

  select.onchange = () => {

    preencherFiltroAssuntos();

    renderizarAnotacoes();
  };
}

function preencherFiltroAssuntos() {

  const disciplinaId =
    document.getElementById(
      "filtro_disciplina"
    ).value;

  let dados = anotacoes;

  if (disciplinaId) {

    dados = dados.filter(
      a =>
      String(a.disciplina_id)
      === disciplinaId
    );
  }

  const assuntos = [
    ...new Map(
      dados.map(a => [
        a.assunto_id,
        {
          id: a.assunto_id,
          nome: a.assunto_nome,
          ordem: a.assunto_ordem
        }
      ])
    ).values()
  ];

  assuntos.sort(
    (a,b) => a.ordem - b.ordem
  );

  const select =
    document.getElementById(
      "filtro_assunto"
    );

  select.innerHTML =
    `<option value="">TODOS</option>`;

  assuntos.forEach(a => {

    select.innerHTML += `
      <option value="${a.id}">
        ${esc(a.nome)}
      </option>
    `;
  });

  select.onchange =
    renderizarAnotacoes;
}

function renderizarAnotacoes() {
  const disciplinaId =
    document.getElementById(
      "filtro_disciplina"
    ).value;

  const assuntoId =
    document.getElementById(
      "filtro_assunto"
    ).value;

  let dados = [...anotacoes];

  if (disciplinaId) {
    dados = dados.filter(
      a =>
        String(a.disciplina_id) ===
        disciplinaId
    );
  }

  if (assuntoId) {
    dados = dados.filter(
      a =>
        String(a.assunto_id) ===
        assuntoId
    );
  }

  document.getElementById(
    "total_anotacoes"
  ).innerText =
    dados.length === 1
      ? "Total: 1 anotação"
      : `Total: ${dados.length} anotações`;

  if (!dados.length) {
    document.getElementById(
      "area_anotacoes"
    ).innerHTML = `
      <div class="card minhas-anotacoes-vazio-card">
        Nenhuma anotação encontrada.
      </div>
    `;

    return;
  }

  let html = "";

  let disciplinaAtual = null;
  let assuntoAtual = null;

  dados.forEach(a => {
    const mudouGrupo =
      disciplinaAtual !==
        a.disciplina_id ||
      assuntoAtual !==
        a.assunto_id;

    if (mudouGrupo) {
      disciplinaAtual =
        a.disciplina_id;

      assuntoAtual =
        a.assunto_id;

      html += `
        <div class="card minhas-anotacoes-identificacao-card">

          <h2 class="minhas-anotacoes-disciplina-titulo">
            ${esc(a.disciplina_nome)}
          </h2>

          <div class="minhas-anotacoes-assunto-titulo">
            ${esc(a.assunto_nome)}
          </div>

        </div>
      `;
    }

    html += montarCardAnotacao(a);
  });

  document.getElementById(
    "area_anotacoes"
  ).innerHTML = html;
}

function textoJustificado(extra = "") {
  return `
    white-space:normal;
    text-align:justify;
    text-indent:0;
    margin-left:0;
    padding-left:0;
    line-height:1.6;
    ${extra}
  `;
}

function montarCardAnotacao(a) {
  const ehCertoErrado =
    a.tipo === "CERTO_ERRADO" ||
    a.tipo_questao === "CERTO_ERRADO";

  const respostaCorretaCE =
    a.gabarito === "C"
      ? "CERTO"
      : a.gabarito === "E"
        ? "ERRADO"
        : "";

  const textoResposta =
    a.texto_resposta ||
    a.alternativa_correta_texto ||
    a.resposta_texto ||
    "";

  const enunciadoHtml =
    ehCertoErrado
      ? `${esc(a.enunciado)} (${respostaCorretaCE})`
      : esc(a.enunciado);

  return `
    <div class="card minhas-anotacoes-anotacao-card">

      <div class="minhas-anotacoes-enunciado">
        ${enunciadoHtml}
      </div>

      ${
        ehCertoErrado
          ? ""
          : `
            <div class="minhas-anotacoes-resposta">

              <strong>Resposta:</strong>

              <div class="minhas-anotacoes-resposta-texto">
                ${esc(textoResposta)}
              </div>

            </div>
          `
      }

      <div class="minhas-anotacoes-comentario">

        <strong>Comentário:</strong>

        <div class="minhas-anotacoes-comentario-texto">
          ${esc(
            a.comentario ||
            "Comentário não cadastrado."
          )}
        </div>

      </div>

      <div
        id="box_anotacao_${a.anotacao_id}"
        class="minhas-anotacoes-bloco-aluno"
      >
        <div class="minhas-anotacoes-bloco-aluno-titulo">
          Minha anotação:
        </div>

        <div class="minhas-anotacoes-bloco-aluno-texto">
          ${esc(a.anotacao)}
        </div>
      </div>

      <div class="minhas-anotacoes-acoes">

        <button
          class="btn minhas-anotacoes-btn minhas-anotacoes-btn-editar"
          onclick="editarAnotacao(${a.anotacao_id})"
        >
          Editar
        </button>

        <button
          class="btn minhas-anotacoes-btn minhas-anotacoes-btn-excluir"
          onclick="excluirAnotacao(${a.anotacao_id})"
        >
          Excluir
        </button>

      </div>

    </div>
  `;
}

function editarAnotacao(id) {
  const anotacao =
    anotacoes.find(
      a => a.anotacao_id === id
    );

  if (!anotacao) {
    return;
  }

  const box =
    document.getElementById(
      `box_anotacao_${id}`
    );

  if (!box) {
    return;
  }

  box.innerHTML = `
    <div class="minhas-anotacoes-bloco-aluno-titulo">
      Editar minha anotação:
    </div>

    <textarea
      id="texto_edicao_${id}"
      class="minhas-anotacoes-textarea-edicao"
      oninput="mostrarSalvar(${id})"
    >${esc(anotacao.anotacao)}</textarea>

    <div class="minhas-anotacoes-edicao-acoes">

      <button
        id="btn_salvar_${id}"
        class="btn minhas-anotacoes-btn"
        style="display:none;"
        onclick="salvarEdicaoAnotacao(${id})"
      >
        Salvar
      </button>

      <button
        class="btn minhas-anotacoes-btn"
        onclick="renderizarAnotacoes()"
      >
        Cancelar
      </button>

    </div>
  `;
}

function mostrarSalvar(id) {
  const btn = document.getElementById(`btn_salvar_${id}`);
  if (btn) btn.style.display = "inline-block";
}

async function salvarEdicaoAnotacao(id) {
  const campo = document.getElementById(`texto_edicao_${id}`);
  if (!campo) return;

  const texto = campo.value.trim();

  if (!texto) {
    alert("A anotação não pode ficar vazia.");
    return;
  }

  const totalPalavras = texto.split(/\s+/).filter(Boolean).length;

  if (totalPalavras > 300) {
    alert("A anotação deve ter no máximo 300 palavras.");
    return;
  }

  try {
    await apiPut(`/me/anotacoes-questoes/${id}`, {
      texto
    });

    const anotacao = anotacoes.find(a => a.anotacao_id === id);
    if (anotacao) {
      anotacao.anotacao = texto;
    }

    renderizarAnotacoes();

  } catch (err) {
    console.error(err);
    alert("Erro ao salvar anotação.");
  }
}

function excluirAnotacao(id) {
  const confirmar = confirm("Deseja realmente excluir esta anotação?");

  if (!confirmar) return;

  excluirAnotacaoConfirmada(id);
}

async function excluirAnotacaoConfirmada(id) {
  try {
    await apiDelete(`/me/anotacoes-questoes/${id}`);

    anotacoes = anotacoes.filter(a => a.anotacao_id !== id);

    preencherFiltroDisciplinas();
    renderizarAnotacoes();

  } catch (err) {
    console.error(err);
    alert("Erro ao excluir anotação.");
  }
}

async function apiPut(path, body) {
  const token = getToken();

  const res = await fetch(
    `${API_BASE}${path}`,
    {
      method: "PUT",
      headers: {
        "Content-Type": "application/json",
        Authorization: `Bearer ${token}`
      },
      body: JSON.stringify(body || {})
    }
  );

  if (!res.ok) {
    throw new Error(`Erro ${res.status}`);
  }

  return await res.json();
}

async function apiDelete(path) {
  const token = getToken();

  const res = await fetch(
    `${API_BASE}${path}`,
    {
      method: "DELETE",
      headers: {
        Authorization: `Bearer ${token}`
      }
    }
  );

  if (!res.ok) {
    throw new Error(`Erro ${res.status}`);
  }

  return true;
}

const anoAtual =
  document.getElementById(
    "ano_atual"
  );

if (anoAtual) {
  anoAtual.textContent =
    new Date().getFullYear();
}

exibirNomeUsuarioLogadoAnotacoes();
carregarAnotacoes();

</script>

</body>
</html>
