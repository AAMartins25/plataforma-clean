<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Solicitar reembolso</title>

  <link
    rel="stylesheet"
    href="css/style.css"
  >
</head>

<body>

  <header
    style="
      padding-top:8px;
      padding-bottom:24px;
      position:relative;
    "
  >

    <div
      style="
        margin-top:32px;
        display:flex;
        justify-content:center;
        align-items:center;
      "
    >

      <h1
        style="
          margin:-6px 0 0 0;
          font-size:1.55rem;
          text-align:center;
        "
      >
        💰 Solicitar reembolso
      </h1>

    </div>


    <nav
      style="
        position:absolute;
        right:24px;
        top:22px;
        display:flex;
        gap:10px;
        align-items:center;
      "
    >

      <a
        id="btnVoltarReembolso"
        class="btn"
        href="#"
        title="Voltar"
      >
        ⇦
      </a>


      <a
        class="btn"
        href="#"
        onclick="
          irParaInicio('index.html');
          return false;
        "
        title="Início"
      >
        ⌂
      </a>


      <a
        class="btn"
        href="#"
        onclick="
          confirmarSaidaReembolso();
          return false;
        "
        title="Sair"
      >
        ⎋
      </a>

    </nav>

  </header>


  <main class="container">

    <div class="card">

      <div
        id="listaReembolsos"
        class="list"
      >
        <p>
          Carregando compras...
        </p>
      </div>

    </div>

  </main>


  <footer>

    <p>
      © <span id="ano_atual"></span> - Quality Estudos
    </p>

  </footer>


  <script src="js/app.js"></script>
  <script src="js/reembolso.js"></script>


  <script>

    function confirmarSaidaReembolso() {

      const ok =
        confirm(
          "Deseja realmente sair da plataforma?"
        );

      if (!ok) {
        return;
      }

      logout();

    }


    const btnVoltarReembolso =
      document.getElementById(
        "btnVoltarReembolso"
      );

    if (btnVoltarReembolso) {
      btnVoltarReembolso.addEventListener(
        "click",
        function (event) {
          event.preventDefault();

          window.location.href =
            "index.html?atendimento=aberto";
        }
      );
    }


    const anoAtual =
      document.getElementById(
        "ano_atual"
      );


    if (anoAtual) {

      anoAtual.textContent =
        new Date().getFullYear();

    }

  </script>

</body>

</html>
