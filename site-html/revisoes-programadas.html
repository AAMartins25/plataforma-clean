<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Assuntos que precisa rever</title>
  <link rel="stylesheet" href="css/style.css"/>
</head>

<body class="revisoes-programadas-page">
<header class="revisoes-programadas-header">

  <div class="revisoes-programadas-header-identificacao">

    <h1 id="titulo_curso"></h1>

    <h2>
      🔁 Minhas revisões
    </h2>

  </div>

  <nav class="revisoes-programadas-header-acoes">

    <a
      class="btn"
      href="javascript:void(0)"
      onclick="voltarParaCurso()"
      title="Voltar"
      aria-label="Voltar"
    >
      ⇦
    </a>

    <a
      class="btn"
      href="index.html"
      title="Início"
      aria-label="Início"
    >
      ⌂
    </a>

    <a
      class="btn"
      href="javascript:void(0)"
      onclick="logout()"
      title="Sair"
      aria-label="Sair"
    >
      ⎋
    </a>

  </nav>

</header>

<main class="container">

  <div class="card revisoes-programadas-card">

    <div
      id="qtd_hoje"
      class="revisoes-programadas-titulo"
    >
      Revisões para hoje: 0
    </div>

    <button
      class="btn revisoes-programadas-btn"
      onclick="alternarLista('lista_revisoes_hoje')"
    >
      Acessar revisões
    </button>

    <div
      id="lista_revisoes_hoje"
      class="list revisoes-programadas-lista"
      style="display:none;"
    ></div>

  </div>


  <div class="card revisoes-programadas-card">

    <div
      id="qtd_atrasadas"
      class="revisoes-programadas-titulo"
    >
      Revisões atrasadas: 0
    </div>

    <button
      class="btn revisoes-programadas-btn"
      onclick="alternarLista('lista_revisoes_atrasadas')"
    >
      Acessar atrasadas
    </button>

    <div
      id="lista_revisoes_atrasadas"
      class="list revisoes-programadas-lista"
      style="display:none;"
    ></div>

  </div>


  <div class="card revisoes-programadas-card">

    <div
      id="qtd_proximas"
      class="revisoes-programadas-titulo"
    >
      Próximas revisões: 0
    </div>

    <button
      class="btn revisoes-programadas-btn"
      onclick="alternarLista('lista_revisoes_proximas')"
    >
      Visualizar as próximas revisões
    </button>

    <div
      id="lista_revisoes_proximas"
      class="list revisoes-programadas-lista"
      style="display:none;"
    ></div>

  </div>

</main>

<footer>
  <p>
    © <span id="ano_atual"></span> - Quality Estudos
  </p>
</footer>

<script>
const API_BASE = "https://plataforma-quality-backend.onrender.com";

function qs(name) {
  return new URLSearchParams(window.location.search).get(name);
}

function getToken() {
  return localStorage.getItem("access_token");
}

function logout() {
  localStorage.removeItem("access_token");
  localStorage.removeItem("me_cache");
  window.location.href = "index.html";
}

function esc(s) {
  return String(s ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;");
}

async function apiGet(path) {
  const token = getToken();

  const res = await fetch(`${API_BASE}${path}`, {
    headers: token ? { "Authorization": `Bearer ${token}` } : {}
  });

  if (!res.ok) {
    const txt = await res.text();
    throw new Error(`Erro ${res.status} em ${path}\n${txt}`);
  }

  return res.json();
}

async function exibirNomeUsuarioLogadoRevisoes() {
  const token = getToken();

  if (!token) {
    return;
  }

  try {
    const me = await apiGet("/me");

    if (!me || !me.nome) {
      return;
    }

    const partesNome = String(me.nome)
      .trim()
      .split(/\s+/)
      .filter(Boolean);

    if (partesNome.length === 0) {
      return;
    }

    const primeiroNome =
      partesNome[0];

    const ultimoNome =
      partesNome.length > 1
        ? partesNome[partesNome.length - 1]
        : "";

    const nomeTooltip =
      ultimoNome
        ? `${primeiroNome} ${ultimoNome}`
        : primeiroNome;

    let identificacao =
      document.getElementById(
        "nomeUsuarioLogadoGlobal"
      );

    if (!identificacao) {
      identificacao =
        document.createElement("div");

      identificacao.id =
        "nomeUsuarioLogadoGlobal";

      identificacao.style.position =
        "fixed";

      identificacao.style.top =
        "9px";

      identificacao.style.right =
        "47px";

      identificacao.style.zIndex =
        "9999";

      identificacao.style.fontSize =
        "0.68rem";

      identificacao.style.fontWeight =
        "600";

      identificacao.style.letterSpacing =
        "0.4px";

      identificacao.style.color =
        "#4b5563";

      identificacao.style.opacity =
        "0.78";

      identificacao.style.cursor =
        "default";

      identificacao.style.userSelect =
        "none";

      identificacao.style.whiteSpace =
        "nowrap";

      document.body.appendChild(
        identificacao
      );
    }

    identificacao.textContent =
      primeiroNome.toUpperCase();

    const tooltip =
      document.createElement("div");

    tooltip.textContent =
      nomeTooltip.toUpperCase();

    tooltip.style.position =
      "absolute";

    tooltip.style.right =
      "calc(100% + 8px)";

    tooltip.style.top =
      "50%";

    tooltip.style.transform =
      "translateY(-50%)";

    tooltip.style.padding =
      "0";

    tooltip.style.background =
      "transparent";

    tooltip.style.color =
      "#4b5563";

    tooltip.style.fontSize =
      "0.68rem";

    tooltip.style.fontWeight =
      "500";

    tooltip.style.whiteSpace =
      "nowrap";

    tooltip.style.opacity =
      "0";

    tooltip.style.visibility =
      "hidden";

    tooltip.style.pointerEvents =
      "none";

    tooltip.style.transition =
      "opacity 0.15s";

    identificacao.appendChild(
      tooltip
    );

    identificacao.addEventListener(
      "mouseenter",
      () => {
        tooltip.style.opacity =
          "1";

        tooltip.style.visibility =
          "visible";
      }
    );

    identificacao.addEventListener(
      "mouseleave",
      () => {
        tooltip.style.opacity =
          "0";

        tooltip.style.visibility =
          "hidden";
      }
    );

  } catch (err) {
    console.warn(
      "Não foi possível exibir o nome do aluno:",
      err
    );
  }
}

function hojeISO() {
  return new Date().toISOString().slice(0, 10);
}

function diasEntre(dataISO) {
  const hoje = new Date(hojeISO());
  const data = new Date(dataISO);
  const diff = data - hoje;
  return Math.round(diff / (1000 * 60 * 60 * 24));
}

function getRevisoes(pastaId) {
  try {
    const dados = localStorage.getItem(`revisoes_${pastaId}`);
    return dados ? JSON.parse(dados) : [];
  } catch {
    return [];
  }
}

function alternarLista(id) {
  const el = document.getElementById(id);
  if (!el) return;

  el.style.display = el.style.display === "none" ? "block" : "none";
}

async function carregarCursoAtual() {
  const cursos = await apiGet("/me/cursos");
  const cursoIdUrl = Number(qs("curso_id") || 0);

  if (!cursos || cursos.length === 0) return null;

  return cursos.find(c => Number(c.curso_id) === cursoIdUrl) || cursos[0];
}

async function carregarDisciplinasDoCurso(cursoId) {
  return await apiGet(`/cursos/${cursoId}/disciplinas-proprias`);
}

async function carregarAssuntosDaDisciplina(disciplinaId) {
  return await apiGet(`/disciplinas-proprias/${disciplinaId}/assuntos-proprios`);
}

async function carregarPastaTeoriaDoAssunto(assuntoId) {
  try {
    return await apiGet(`/assuntos-proprios/${assuntoId}/pasta-teoria`);
  } catch {
    return null;
  }
}

async function carregarAulasDaPasta(pastaId) {
  return await apiGet(`/pastas/${pastaId}/aulas`);
}

function abrirRevisaoAgora(pastaId, aulaId, disciplinaNome, assuntoNome) {
  const cursoId = qs("curso_id");
  const cursoNome = qs("curso_nome") || "";

  localStorage.setItem(
    "voltar_para_assuntos",
    `revisoes-programadas.html?curso_id=${encodeURIComponent(cursoId || "")}&curso_nome=${encodeURIComponent(cursoNome)}`
  );

  window.location.href =
    `teoria.html?pasta_id=${encodeURIComponent(pastaId)}` +
    `&disciplina_nome=${encodeURIComponent(disciplinaNome)}` +
    `&assunto_nome=${encodeURIComponent(assuntoNome)}` +
    `&curso_nome=${encodeURIComponent(cursoNome)}` +
    `&abrir=teoria`;
}

function voltarParaCurso() {
  const cursoId = qs("curso_id");
  const cursoNome = qs("curso_nome") || "";

  window.location.replace(
    `curso.html?curso_id=${encodeURIComponent(cursoId || "")}&curso_nome=${encodeURIComponent(cursoNome)}`
  );
}

async function carregarRevisoesProgramadas() { 
  try {
    await apiGet("/me");

    const cursoAtual = await carregarCursoAtual();

    const tituloCurso =
      document.getElementById(
        "titulo_curso"
      );

    if (!cursoAtual) {
      if (tituloCurso) {
        tituloCurso.innerText =
          "Nenhum curso disponível";
      }

      return;
    }

    if (tituloCurso) {
      tituloCurso.innerText =
        cursoAtual.nome_curso;
    }

    const hoje = hojeISO();
    const hojeRevisoes = [];
    const atrasadas = [];
    const proximas = [];

    const disciplinas = await carregarDisciplinasDoCurso(cursoAtual.curso_id);

    for (const disciplina of disciplinas) {
      const assuntos = await carregarAssuntosDaDisciplina(disciplina.id);

      for (const assunto of assuntos) {
        const pastaTeoria = await carregarPastaTeoriaDoAssunto(assunto.id);
        if (!pastaTeoria || !pastaTeoria.id) continue;

        const aulas = await carregarAulasDaPasta(pastaTeoria.id);
        const revisoes = getRevisoes(pastaTeoria.id);
        const revisoesValidas = revisoes.filter(r => r.concluida !== true);

        for (const rev of revisoesValidas) {
          const aula = aulas.find(a => Number(a.id) === Number(rev.aulaId));
          const dias = diasEntre(rev.proximaRevisao);

          const item = {
            ...rev,
            pastaId: pastaTeoria.id,
            aulaId: rev.aulaId,
            disciplinaNome: disciplina.nome,
            assuntoNome: assunto.nome,
            aulaTitulo: aula?.titulo || rev.titulo || "Aula",
            dias
          };

          if (rev.proximaRevisao < hoje) {
            atrasadas.push(item);
          } else if (rev.proximaRevisao === hoje) {
            hojeRevisoes.push(item);
          } else {
            proximas.push(item);
          }
        }
      }
    }

    atrasadas.sort((a, b) => a.dias - b.dias);
    hojeRevisoes.sort((a, b) => a.disciplinaNome.localeCompare(b.disciplinaNome));
    proximas.sort((a, b) => a.dias - b.dias);

    document.getElementById("qtd_hoje").innerText =
      `Revisões para hoje: ${hojeRevisoes.length}`;

    document.getElementById("qtd_atrasadas").innerText =
      `Revisões atrasadas: ${atrasadas.length}`;

    document.getElementById("qtd_proximas").innerText =
      `Próximas revisões: ${proximas.length}`;

    document.getElementById("lista_revisoes_hoje").innerHTML =
      hojeRevisoes.length === 0
        ? "<p>Não há revisão para hoje.</p>"
        : hojeRevisoes.map(r => `
          <div class="disciplina">
            <div style="display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap;">
              <div>
                <div style="font-weight:bold;">${esc(r.disciplinaNome)}</div>
                <div style="margin-top:4px;">
                  ${esc(r.assuntoNome)}
                </div>
              </div>

              <button
                class="btn"
                onclick="abrirRevisaoAgora(${r.pastaId}, ${r.aulaId}, '${esc(r.disciplinaNome)}', '${esc(r.assuntoNome)}')"
              >
                Revisar agora mesmo
              </button>
            </div>
          </div>
        `).join("");

    document.getElementById("lista_revisoes_atrasadas").innerHTML =
      atrasadas.length === 0
        ? `
          <p>Não há revisões atrasadas.</p>

          <button
            class="btn"
            disabled
            style="opacity:.45; cursor:not-allowed; margin-top:8px;"
          >
            Revisar agora mesmo
          </button>
        `
        : atrasadas.map(r => {
            const diasAtraso = Math.abs(r.dias);
            const textoDias = diasAtraso === 1 ? "dia" : "dias";

            return `
              <div class="disciplina" style="border-left:6px solid #d32f2f;">
                <div style="display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap;">
                  <div>
                    <div style="font-weight:bold;">${esc(r.disciplinaNome)}</div>
                    <div style="margin-top:4px;">
                      ${esc(r.assuntoNome)}
                      <span style="
                          margin-left:10px;
                          color:#d32f2f;
                          font-weight:bold;
                      ">
                        (${diasAtraso} ${textoDias})
                      </span>
                    </div>
                  </div>

                  <button
                    class="btn"
                    onclick="abrirRevisaoAgora(${r.pastaId}, ${r.aulaId}, '${esc(r.disciplinaNome)}', '${esc(r.assuntoNome)}')"
                  >
                    Revisar agora mesmo
                  </button>
                </div>
              </div>
            `;
          }).join("");

    document.getElementById("lista_revisoes_proximas").innerHTML =
      proximas.length === 0
        ? "<p>Não há revisão programada.</p>"
        : proximas.map(r => `
          <div class="disciplina">
            <div style="font-weight:bold;">${esc(r.disciplinaNome)}</div>
            <div style="margin-top:4px;">
              ${esc(r.assuntoNome)}
            </div>
          </div>
        `).join("");

  } catch (err) {
    document.querySelector("main").innerHTML = `
      <div class="card">
        <h2>Erro ao carregar revisões</h2>
        <pre style="white-space:pre-wrap">${esc(err.message)}</pre>
      </div>
    `;
  }
}

const anoAtual =
  document.getElementById(
    "ano_atual"
  );

if (anoAtual) {
  anoAtual.textContent =
    new Date().getFullYear();
}

exibirNomeUsuarioLogadoRevisoes();
carregarRevisoesProgramadas();
</script>

</body>
</html>
