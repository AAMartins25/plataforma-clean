<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Assuntos que precisa rever</title>
  <link rel="stylesheet" href="css/style.css"/>
</head>

<body class="revisoes-programadas-page">
<header class="revisoes-programadas-header">

  <div class="revisoes-programadas-header-identificacao">

    <h1 id="titulo_curso"></h1>

    <h2>
      Revisões
    </h2>

  </div>

  <nav class="revisoes-programadas-header-acoes">

    <a
      class="btn"
      href="javascript:void(0)"
      onclick="voltarParaCurso()"
      title="Voltar"
      aria-label="Voltar"
    >
      ⇦
    </a>

    <a
      class="btn"
      href="index.html"
      title="Início"
      aria-label="Início"
    >
      ⌂
    </a>

    <a
      class="btn"
      href="javascript:void(0)"
      onclick="logout()"
      title="Sair"
      aria-label="Sair"
    >
      ⎋
    </a>

  </nav>

</header>

<main class="container">

  <div class="card revisoes-programadas-card">

    <div
      id="qtd_hoje"
      class="revisoes-programadas-titulo"
    >
      Revisões para hoje: 0
    </div>

    <button
      class="btn revisoes-programadas-btn"
      onclick="alternarLista('lista_revisoes_hoje')"
    >
      Acessar
    </button>

    <div
      id="lista_revisoes_hoje"
      class="list revisoes-programadas-lista"
      style="display:none;"
    ></div>

  </div>


  <div class="card revisoes-programadas-card">

    <div
      id="qtd_atrasadas"
      class="revisoes-programadas-titulo"
    >
      Revisões atrasadas: 0
    </div>

    <button
      class="btn revisoes-programadas-btn"
      onclick="alternarLista('lista_revisoes_atrasadas')"
    >
      Acessar
    </button>

    <div
      id="lista_revisoes_atrasadas"
      class="list revisoes-programadas-lista"
      style="display:none;"
    ></div>

  </div>


  <div class="card revisoes-programadas-card">

    <div
      id="qtd_proximas"
      class="revisoes-programadas-titulo"
    >
      Próximas revisões: 0
    </div>

    <button
      class="btn revisoes-programadas-btn"
      onclick="alternarLista('lista_revisoes_proximas')"
    >
      Visualizar
    </button>

    <div
      id="lista_revisoes_proximas"
      class="list revisoes-programadas-lista"
      style="display:none;"
    ></div>

  </div>

</main>

<footer>
  <p>
    © <span id="ano_atual"></span> - Quality Estudos
  </p>
</footer>

<script>
const API_BASE = "https://plataforma-quality-backend.onrender.com";
const params = new URLSearchParams(location.search);
function contexto() {
  const q = new URLSearchParams();
  for (const key of ['contratacao_id','demonstracao_id']) if (params.get(key)) q.set(key, params.get(key));
  return q;
}
function esc(value) { const el=document.createElement('span'); el.textContent=String(value ?? ''); return el.innerHTML; }
function logout() { localStorage.removeItem('access_token'); location.href='index.html'; }
function voltarParaCurso() { location.href='curso.html?'+params.toString(); }
function alternarLista(id) { const el=document.getElementById(id); if (el) el.style.display=el.style.display === "none" ? "block" : "none"; }
async function request(path, method='GET') {
  const response=await fetch(API_BASE+path,{method,headers:{Authorization:'Bearer '+localStorage.getItem('access_token')}});
  if (!response.ok) throw new Error(await response.text());
  return response.json();
}
async function abrirRevisao(id) {
  try {
    const r=await request(`/me/revisoes/${id}/reconciliar?${contexto()}`,'POST');
    if (r.status !== 'PENDENTE') { alert('Revisão cancelada por perda de objeto.'); await carregar(); return; }
    const q=new URLSearchParams(params);
    q.set('revisao_id',r.id); q.set('pasta_id',r.pasta_id); q.set('assunto_id',r.assunto_id);
    q.set('disciplina_id',r.disciplina_id); q.set('assunto_nome',r.titulo);
    location.href='teoria.html?'+q;
  } catch(e) { alert(e.message); }
}
async function carregar() {
  try {
    const revisoes=await request('/me/revisoes?'+contexto());
    const hoje=new Date().toISOString().slice(0,10);
    for (const [id,predicate] of [
      ['lista_revisoes_hoje',r=>r.data_prevista.slice(0,10)===hoje],
      ['lista_revisoes_atrasadas',r=>r.data_prevista.slice(0,10)<hoje],
      ['lista_revisoes_proximas',r=>r.data_prevista.slice(0,10)>hoje]]) {
      const rows=revisoes.filter(predicate);
      const categoria=id.replace('lista_revisoes_', '');
      const rotulos={hoje:'Revisões para hoje', atrasadas:'Revisões atrasadas', proximas:'Próximas revisões'};
      document.getElementById('qtd_'+categoria).textContent=rotulos[categoria]+': '+rows.length;
      document.getElementById(id).innerHTML=rows.length ? rows.map(r=>`<div class="card"><strong>${esc(r.titulo)}</strong><p>${r.etapa}ª revisão — ${esc(r.data_prevista.slice(0,10))}</p>${r.data_prevista.slice(0,10)<=hoje ? `<button class="btn" onclick="abrirRevisao(${Number(r.id)})">Revisar</button>` : ''}</div>`).join('') : '<p>Nenhuma revisão nesta lista.</p>';
    }
  } catch(e) { document.querySelector('main').textContent='Erro ao carregar revisões: '+e.message; }
}
carregar();
</script>

</body>
</html>
