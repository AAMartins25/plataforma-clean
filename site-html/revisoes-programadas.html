<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Assuntos que precisa rever</title>
  <link rel="stylesheet" href="css/style.css"/>
</head>

<body>
<header>
  <h1>🔁 Assuntos que precisa rever</h1>

  <nav style="display:flex; justify-content:center; gap:10px; flex-wrap:wrap; margin-top:10px;">
    <a
      class="btn"
      href="javascript:void(0)"
      onclick="voltarParaCurso()"
    >
      Voltar
    </a>
    <a href="javascript:void(0)" class="btn" onclick="logout()">Sair</a>
  </nav>
</header>

<main class="container">

  <div class="card">
    <h2 id="nome_curso">📘 Carregando curso...</h2>
  </div>

  <div class="card">
    <div id="qtd_hoje" style="font-weight:bold; margin-bottom:10px;">
        Revisões para hoje: 0
    </div>

    <button class="btn" onclick="alternarLista('lista_revisoes_hoje')">
        Revisões para hoje
    </button>

    <div id="lista_revisoes_hoje" class="list" style="display:none; margin-top:14px;"></div>
  </div>

  <div class="card">
    <div id="qtd_atrasadas" style="font-weight:bold; margin-bottom:10px;">
      Revisões atrasadas: 0
    </div>

    <button class="btn" onclick="alternarLista('lista_revisoes_atrasadas')">
      Revisões atrasadas
    </button>

    <div id="lista_revisoes_atrasadas" class="list" style="display:none; margin-top:14px;"></div>
  </div>

  <div class="card">
    <div id="qtd_proximas" style="font-weight:bold; margin-bottom:10px;">
      Próxima(s) revisão(ões): 0
    </div>

    <button class="btn" onclick="alternarLista('lista_revisoes_proximas')">
      Próxima(s) revisão(ões)
    </button>

    <div id="lista_revisoes_proximas" class="list" style="display:none; margin-top:14px;"></div>
  </div>

</main>

<footer>
  <p>© 2026 - Plataforma Quality Estudos</p>
</footer>

<script>
const API_BASE = "https://plataforma-quality-backend.onrender.com";

function qs(name) {
  return new URLSearchParams(window.location.search).get(name);
}

function getToken() {
  return localStorage.getItem("access_token");
}

function logout() {
  localStorage.removeItem("access_token");
  localStorage.removeItem("me_cache");
  window.location.href = "index.html";
}

function esc(s) {
  return String(s ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;");
}

async function apiGet(path) {
  const token = getToken();

  const res = await fetch(`${API_BASE}${path}`, {
    headers: token ? { "Authorization": `Bearer ${token}` } : {}
  });

  if (!res.ok) {
    const txt = await res.text();
    throw new Error(`Erro ${res.status} em ${path}\n${txt}`);
  }

  return res.json();
}

function hojeISO() {
  return new Date().toISOString().slice(0, 10);
}

function diasEntre(dataISO) {
  const hoje = new Date(hojeISO());
  const data = new Date(dataISO);
  const diff = data - hoje;
  return Math.round(diff / (1000 * 60 * 60 * 24));
}

function getRevisoes(pastaId) {
  try {
    const dados = localStorage.getItem(`revisoes_${pastaId}`);
    return dados ? JSON.parse(dados) : [];
  } catch {
    return [];
  }
}

function alternarLista(id) {
  const el = document.getElementById(id);
  if (!el) return;

  el.style.display = el.style.display === "none" ? "block" : "none";
}

async function carregarCursoAtual() {
  const cursos = await apiGet("/me/cursos");
  const cursoIdUrl = Number(qs("curso_id") || 0);

  if (!cursos || cursos.length === 0) return null;

  return cursos.find(c => Number(c.curso_id) === cursoIdUrl) || cursos[0];
}

async function carregarDisciplinasDoCurso(cursoId) {
  return await apiGet(`/cursos/${cursoId}/disciplinas-proprias`);
}

async function carregarAssuntosDaDisciplina(disciplinaId) {
  return await apiGet(`/disciplinas-proprias/${disciplinaId}/assuntos-proprios`);
}

async function carregarPastaTeoriaDoAssunto(assuntoId) {
  try {
    return await apiGet(`/assuntos-proprios/${assuntoId}/pasta-teoria`);
  } catch {
    return null;
  }
}

async function carregarAulasDaPasta(pastaId) {
  return await apiGet(`/pastas/${pastaId}/aulas`);
}

function abrirRevisaoAgora(pastaId, aulaId, disciplinaNome, assuntoNome) {
  const cursoId = qs("curso_id");
  const cursoNome = qs("curso_nome") || "";

  localStorage.setItem(
    "voltar_para_assuntos",
    `revisoes-programadas.html?curso_id=${encodeURIComponent(cursoId || "")}&curso_nome=${encodeURIComponent(cursoNome)}`
  );

  window.location.href =
    `teoria.html?pasta_id=${encodeURIComponent(pastaId)}` +
    `&disciplina_nome=${encodeURIComponent(disciplinaNome)}` +
    `&assunto_nome=${encodeURIComponent(assuntoNome)}` +
    `&curso_nome=${encodeURIComponent(cursoNome)}` +
    `&abrir=teoria`;
}

function voltarParaCurso() {
  const cursoId = qs("curso_id");
  const cursoNome = qs("curso_nome") || "";

  window.location.replace(
    `curso.html?curso_id=${encodeURIComponent(cursoId || "")}&curso_nome=${encodeURIComponent(cursoNome)}`
  );
}

async function carregarRevisoesProgramadas() { 
  try {
    await apiGet("/me");

    const cursoAtual = await carregarCursoAtual();

    if (!cursoAtual) {
      document.getElementById("nome_curso").innerText = "📘 Nenhum curso disponível";
      return;
    }

    document.getElementById("nome_curso").innerText = `📘 ${cursoAtual.nome_curso}`;

    const hoje = hojeISO();
    const hojeRevisoes = [];
    const atrasadas = [];
    const proximas = [];

    const disciplinas = await carregarDisciplinasDoCurso(cursoAtual.curso_id);

    for (const disciplina of disciplinas) {
      const assuntos = await carregarAssuntosDaDisciplina(disciplina.id);

      for (const assunto of assuntos) {
        const pastaTeoria = await carregarPastaTeoriaDoAssunto(assunto.id);
        if (!pastaTeoria || !pastaTeoria.id) continue;

        const aulas = await carregarAulasDaPasta(pastaTeoria.id);
        const revisoes = getRevisoes(pastaTeoria.id);
        const revisoesValidas = revisoes.filter(r => r.concluida !== true);

        for (const rev of revisoesValidas) {
          const aula = aulas.find(a => Number(a.id) === Number(rev.aulaId));
          const dias = diasEntre(rev.proximaRevisao);

          const item = {
            ...rev,
            pastaId: pastaTeoria.id,
            aulaId: rev.aulaId,
            disciplinaNome: disciplina.nome,
            assuntoNome: assunto.nome,
            aulaTitulo: aula?.titulo || rev.titulo || "Aula",
            dias
          };

          if (rev.proximaRevisao < hoje) {
            atrasadas.push(item);
          } else if (rev.proximaRevisao === hoje) {
            hojeRevisoes.push(item);
          } else {
            proximas.push(item);
          }
        }
      }
    }

    atrasadas.sort((a, b) => a.dias - b.dias);
    hojeRevisoes.sort((a, b) => a.disciplinaNome.localeCompare(b.disciplinaNome));
    proximas.sort((a, b) => a.dias - b.dias);

    document.getElementById("qtd_hoje").innerText =
      `Revisões para hoje: ${hojeRevisoes.length}`;

    document.getElementById("qtd_atrasadas").innerText =
      `Revisões atrasadas: ${atrasadas.length}`;

    document.getElementById("qtd_proximas").innerText =
      `Próxima(s) revisão(ões): ${proximas.length}`;

    document.getElementById("lista_revisoes_hoje").innerHTML =
      hojeRevisoes.length === 0
        ? "<p>Não há revisão para hoje.</p>"
        : hojeRevisoes.map(r => `
          <div class="disciplina">
            <div style="display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap;">
              <div>
                <div style="font-weight:bold;">${esc(r.disciplinaNome)}</div>
                <div style="margin-top:4px;">
                  ${esc(r.assuntoNome)}
                </div>
              </div>

              <button
                class="btn"
                onclick="abrirRevisaoAgora(${r.pastaId}, ${r.aulaId}, '${esc(r.disciplinaNome)}', '${esc(r.assuntoNome)}')"
              >
                Revisar agora mesmo
              </button>
            </div>
          </div>
        `).join("");

    document.getElementById("lista_revisoes_atrasadas").innerHTML =
      atrasadas.length === 0
        ? `
          <p>Não há revisões atrasadas.</p>

          <button
            class="btn"
            disabled
            style="opacity:.45; cursor:not-allowed; margin-top:8px;"
          >
            Revisar agora mesmo
          </button>
        `
        : atrasadas.map(r => {
            const diasAtraso = Math.abs(r.dias);
            const textoDias = diasAtraso === 1 ? "dia" : "dias";

            return `
              <div class="disciplina" style="border-left:6px solid #d32f2f;">
                <div style="display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap;">
                  <div>
                    <div style="font-weight:bold;">${esc(r.disciplinaNome)}</div>
                    <div style="margin-top:4px;">
                      ${esc(r.assuntoNome)}
                      <span style="
                          margin-left:10px;
                          color:#d32f2f;
                          font-weight:bold;
                      ">
                        (${diasAtraso} ${textoDias})
                      </span>
                    </div>
                  </div>

                  <button
                    class="btn"
                    onclick="abrirRevisaoAgora(${r.pastaId}, ${r.aulaId}, '${esc(r.disciplinaNome)}', '${esc(r.assuntoNome)}')"
                  >
                    Revisar agora mesmo
                  </button>
                </div>
              </div>
            `;
          }).join("");

    document.getElementById("lista_revisoes_proximas").innerHTML =
      proximas.length === 0
        ? "<p>Não há revisão programada.</p>"
        : proximas.map(r => `
          <div class="disciplina">
            <div style="font-weight:bold;">${esc(r.disciplinaNome)}</div>
            <div style="margin-top:4px;">
              ${esc(r.assuntoNome)}
            </div>
          </div>
        `).join("");

  } catch (err) {
    document.querySelector("main").innerHTML = `
      <div class="card">
        <h2>Erro ao carregar revisões</h2>
        <pre style="white-space:pre-wrap">${esc(err.message)}</pre>
      </div>
    `;
  }
}

carregarRevisoesProgramadas();
</script>

</body>
</html>
