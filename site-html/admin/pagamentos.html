<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <script src="../js/sessao.js"></script>
  <script src="../js/admin-acesso.js?v=perfis-1"></script>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Pagamentos</title>

  <link
    rel="stylesheet"
    href="../css/style.css"
  >
  <link rel="stylesheet" href="../css/admin-responsivo.css">
  <link rel="stylesheet" href="../css/admin-shell.css" />
  <script src="../js/cabecalho.js?v=altura6-1" defer></script>
  <script src="../js/rodape.js" defer></script>
  <link rel="stylesheet" href="../css/admin-cabecalho-padrao.css?v=1">
  <script src="../js/admin-cabecalho-padrao.js?v=1" defer></script>
</head>

<body class="admin-shell admin-cabecalho-padrao">

  <header
    style="
      padding-top:0.5rem;
      padding-bottom:1.5rem;
      position:relative;
    "
  >
    <div
      style="
        margin-top:2rem;
        display:flex;
        justify-content:center;
        align-items:center;
      "
    >
      <h1
        style="
          margin:-0.375rem 0 0 0;
          font-size:1.55rem;
          text-align:center;
        "
      >
        💳 Pagamentos
      </h1>
    </div>

    <nav
      style="
        position:absolute;
        right:1.5rem;
        top:1.375rem;
        display:flex;
        gap:0.625rem;
        align-items:center;
      "
    >
      <a
        class="btn"
        href="index.html"
        title="Voltar"
      >
        ⇦
      </a>

      <a
        class="btn"
        href="#"
        onclick="irParaInicio('../index.html'); return false;"
        title="Início"
      >
        ⌂
      </a>

      <a
        class="btn"
        href="#"
        onclick="confirmarSaidaAdmin(); return false;"
        title="Sair"
      >
        ⎋
      </a>
    </nav>
  </header>

  <main class="container">

    <div class="card">

      <h2>
        1) Buscar compras
      </h2>

      <div class="assunto">

        <label for="q">
          <b>Filtro por e-mail, curso ou status</b>
        </label>

        <br>

        <input
          id="q"
          type="text"
          placeholder="Ex.: aluno@email.com ou APPROVED"
          style="
            width:100%;
            padding:0.75rem;
            border:0.0625rem solid #ddd;
            border-radius:0.375rem;
          "
        >

        <div style="margin-top:0.625rem;">
          <button
            class="btn"
            id="btnBuscar"
            type="button"
          >
            Buscar
          </button>
        </div>

        <div
          id="msgBusca"
          style="margin-top:0.625rem;"
        ></div>

      </div>

      <div
        id="listaPagamentos"
        style="margin-top:0.75rem;"
      >
        Use a busca.
      </div>

    </div>

    <div class="card">

      <h2>
        2) Revalidar pagamento no Mercado Pago
      </h2>

      <div class="assunto">

        <label for="mp_payment_id">
          <b>ID do pagamento no Mercado Pago</b>
        </label>

        <br>

        <input
          id="mp_payment_id"
          type="text"
          placeholder="Ex.: 123456789"
          style="
            width:100%;
            padding:0.75rem;
            border:0.0625rem solid #ddd;
            border-radius:0.375rem;
          "
        >

        <div style="margin-top:0.625rem;">
          <button
            class="btn"
            id="btnRevalidar"
            type="button"
          >
            Revalidar
          </button>
        </div>

        <div
          id="msgRevalidar"
          style="margin-top:0.625rem;"
        ></div>

      </div>

    </div>

  </main>

  <footer>
    <p>
      © <span id="ano_atual">2026</span> AAMartins
    </p>
  </footer>

  <script src="../js/app.js?v=importacao-20261120-1"></script>
  <script src="../js/admin.js?v=importacao-20261120-1"></script>

  <script>
    function confirmarSaidaAdmin() {
      const ok = confirm(
        "Deseja realmente sair da plataforma?"
      );

      if (!ok) return;

      logout();
    }

    const anoAtual =
      document.getElementById("ano_atual");

    if (anoAtual) {
      anoAtual.textContent =
        new Date().getFullYear();
    }

    AdminPagamentos.init();
  </script>

</body>

</html>
