<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <script src="../js/sessao.js"></script>
  <script src="../js/admin-acesso.js?v=perfis-1"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin • Disciplinas</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/admin-responsivo.css">
  <script src="../js/cabecalho.js?v=altura6-1" defer></script>
  <script src="../js/rodape.js" defer></script>
  <link rel="stylesheet" href="../css/admin-cabecalho-padrao.css?v=1">
  <script src="../js/admin-cabecalho-padrao.js?v=1" defer></script>
</head>
<body class="admin-cabecalho-padrao">
  <header>
    <h1>📚 Admin • Disciplinas</h1>
    <nav style="display:flex; gap:0.625rem; justify-content:center; flex-wrap:wrap;">
      <a class="btn" href="index.html">Painel</a>
      <a class="btn" href="cursos.html">Cursos</a>
      <a class="btn" href="curso-disciplinas.html">Curso × Disciplinas</a>
      <a class="btn" href="assuntos.html">Assuntos</a>
      <a class="btn" href="../index.html">Início</a>
    </nav>
    <p>Cadastre disciplinas e liste as existentes.</p>
  </header>

  <main class="container">
    <div class="card">
      <h2>1) Criar disciplina</h2>

      <form id="formCriarDisciplina" class="list" style="margin-top:0.9375rem;">
        <div class="assunto">
          <label><b>Nome</b></label><br/>
          <input id="disciplinaNome" type="text" placeholder="Ex.: Língua Portuguesa"
                 style="width:100%; padding:0.75rem; border:0.0625rem solid #ddd; border-radius:0.375rem;" />
        </div>

        <div class="assunto" style="display:flex; align-items:center; gap:0.625rem;">
          <input id="disciplinaAtivo" type="checkbox" checked />
          <label for="disciplinaAtivo"><b>Ativo</b></label>
        </div>

        <button class="btn" type="submit">Salvar disciplina</button>
        <div id="msgCriarDisciplina" style="margin-top:0.625rem;"></div>
      </form>
    </div>

    <div class="card">
      <h2>2) Listar / buscar disciplinas</h2>

      <div class="list">
        <div class="assunto">
          <label><b>Filtro (nome)</b></label><br/>
          <input id="qDisciplina" type="text" placeholder="Ex.: direito"
                 style="width:100%; padding:0.75rem; border:0.0625rem solid #ddd; border-radius:0.375rem;" />
          <div style="margin-top:0.625rem; display:flex; gap:0.625rem; flex-wrap:wrap;">
            <button class="btn" id="btnBuscarDisciplinas">Buscar</button>
            <button class="btn" id="btnListarTudo">Listar tudo</button>
          </div>
          <div id="msgBuscarDisciplinas" style="margin-top:0.625rem;"></div>
        </div>
      </div>

      <div id="listaDisciplinas" style="margin-top:0.75rem;">Use a busca.</div>
    </div>
  </main>

  <footer>
    <p>© <span data-current-year>2026</span> AAMartins</p>
  </footer>

  <script src="../js/app.js?v=importacao-20261120-1"></script>
  <script src="../js/admin.js?v=importacao-20261120-1"></script>
  <script>
    AdminDisciplinas.init();
  </script>
</body>
</html>
