<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <script src="../js/sessao.js"></script>
  <script src="../js/admin-acesso.js?v=perfis-1"></script>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Atendimento</title>

  <link
    rel="stylesheet"
    href="../css/style.css"
  >
  <link rel="stylesheet" href="../css/admin-responsivo.css">
  <link rel="stylesheet" href="../css/admin-shell.css" />
  <script src="../js/cabecalho.js?v=altura6-1" defer></script>
  <script src="../js/rodape.js" defer></script>
</head>

<body class="admin-shell">

  <header
    style="
      padding-top:0.5rem;
      padding-bottom:1.5rem;
      position:relative;
    "
  >
    <div
      style="
        margin-top:2rem;
        display:flex;
        justify-content:center;
        align-items:center;
      "
    >
      <h1
        style="
          margin:-0.375rem 0 0 0;
          font-size:1.55rem;
          text-align:center;
        "
      >
        💬 Atendimento
      </h1>
    </div>

    <nav
      style="
        position:absolute;
        right:1.5rem;
        top:1.375rem;
        display:flex;
        gap:0.625rem;
        align-items:center;
      "
    >
      <a
        class="btn"
        href="index.html"
        title="Voltar"
      >
        ⇦
      </a>

      <a
        class="btn"
        href="#"
        onclick="irParaInicio('../index.html'); return false;"
        title="Início"
      >
        ⌂
      </a>

      <a
        class="btn"
        href="#"
        onclick="confirmarSaidaAdmin(); return false;"
        title="Sair"
      >
        ⎋
      </a>
    </nav>
  </header>

  <main class="container">

    <div class="card">

      <h2>
        Solicitações de atendimento
      </h2>

      <div
        id="listaAtendimentos"
        class="list"
      >
        <p>Carregando atendimentos...</p>
      </div>

    </div>

  </main>

  <footer>
    <p>
      © <span id="ano_atual">2026</span> Quality
    </p>
  </footer>

  <script src="../js/app.js?v=perfis-1"></script>
  <script src="../js/admin.js?v=perfis-1"></script>

  <script>
    function confirmarSaidaAdmin() {
      const ok = confirm(
        "Deseja realmente sair da plataforma?"
      );

      if (!ok) return;

      logout();
    }

    const anoAtual =
      document.getElementById("ano_atual");

    if (anoAtual) {
      anoAtual.textContent =
        new Date().getFullYear();
    }

    requireAdmin();

    const lista =
      document.getElementById("listaAtendimentos");

    function formatarData(dataISO) {
      if (!dataISO) return "-";

      return new Date(dataISO)
        .toLocaleString("pt-BR");
    }

    function cardAtendimento(
      atendimento,
      concluido = false
    ) {
      return `
        <div
          class="assunto"
          style="${concluido ? "opacity:.82;" : ""}"
        >
          <div
            style="
              display:flex;
              justify-content:space-between;
              align-items:center;
              gap:0.625rem;
              flex-wrap:wrap;
              margin-bottom:0.5rem;
            "
          >
            <b>${atendimento.assunto}</b>

            <span
              style="
                padding:0.25rem 0.625rem;
                border-radius:62.4375rem;
                border:0.0625rem solid #ccc;
                font-size:.85rem;
              "
            >
              ${atendimento.status}
            </span>
          </div>

          <div
            style="
              margin-bottom:0.625rem;
              opacity:.88;
            "
          >
            <b>Aluno:</b>
            ${atendimento.usuario_nome}

            <br>

            <b>E-mail:</b>
            ${atendimento.usuario_email}

            <br>

            <b>Data:</b>
            ${formatarData(atendimento.criado_em)}
          </div>

          <div
            style="
              background:#fff;
              border:0.0625rem solid #ddd;
              border-radius:0.5rem;
              padding:0.75rem;
              white-space:pre-wrap;
              margin-bottom:0.75rem;
            "
          >
            ${atendimento.mensagem}
          </div>

          ${
            concluido
              ? `
                <div style="margin-top:0.75rem;">
                  <b>Resposta da Quality Estudos:</b>

                  <br>

                  <div
                    style="
                      background:#f9fafb;
                      border:0.0625rem solid #ddd;
                      border-radius:0.5rem;
                      padding:0.75rem;
                      white-space:pre-wrap;
                      margin-top:0.375rem;
                    "
                  >
                    ${
                      atendimento.resposta_admin ||
                      "Sem resposta registrada."
                    }
                  </div>
                </div>
              `
              : `
                <label for="resposta_${atendimento.id}">
                  <b>Resposta da Quality Estudos</b>
                </label>

                <textarea
                  id="resposta_${atendimento.id}"
                  placeholder="Escreva a resposta ao aluno"
                  style="
                    width:100%;
                    min-height:6.25rem;
                    padding:0.75rem;
                    border:0.0625rem solid #ddd;
                    border-radius:0.5rem;
                    margin:0.5rem 0 0.75rem;
                  "
                ></textarea>

                <div
                  style="
                    display:flex;
                    gap:0.625rem;
                    flex-wrap:wrap;
                  "
                >
                  <button
                    class="btn"
                    type="button"
                    onclick="responderAtendimento(${atendimento.id})"
                  >
                    Responder e concluir
                  </button>

                  <button
                    class="btn"
                    type="button"
                    onclick="concluirAtendimento(${atendimento.id})"
                  >
                    Concluir sem resposta
                  </button>
                </div>
              `
          }
        </div>
      `;
    }

    async function carregarAtendimentos() {
      try {
        const dados = await apiGetAuth(
          "/admin/atendimentos"
        );

        if (!dados || dados.length === 0) {
          lista.innerHTML = `
            <p>
              Nenhuma solicitação cadastrada ainda.
            </p>
          `;

          return;
        }

        const abertos = dados.filter(
          atendimento =>
            atendimento.status !== "CONCLUIDO"
        );

        const concluidos = dados.filter(
          atendimento =>
            atendimento.status === "CONCLUIDO"
        );

        lista.innerHTML = `
          <div style="margin-bottom:1.875rem;">
            <h3>Em aberto</h3>

            ${
              abertos.length === 0
                ? "<p>Nenhum atendimento em aberto.</p>"
                : abertos
                    .map(atendimento =>
                      cardAtendimento(
                        atendimento,
                        false
                      )
                    )
                    .join("")
            }
          </div>

          <div>
            <h3>Concluídos</h3>

            ${
              concluidos.length === 0
                ? "<p>Nenhum atendimento concluído.</p>"
                : concluidos
                    .map(atendimento =>
                      cardAtendimento(
                        atendimento,
                        true
                      )
                    )
                    .join("")
            }
          </div>
        `;

      } catch (err) {
        console.error(err);

        lista.innerHTML = `
          <div class="assunto">
            Erro ao carregar atendimentos.
          </div>
        `;
      }
    }

    async function concluirAtendimento(id) {
      try {
        await apiPostAuth(
          `/admin/atendimentos/${id}/concluir`,
          {}
        );

        await carregarAtendimentos();

      } catch (err) {
        console.error(err);

        alert(
          "Erro ao concluir atendimento."
        );
      }
    }

    async function responderAtendimento(id) {
      const campo =
        document.getElementById(`resposta_${id}`);

      const resposta =
        campo?.value.trim() || "";

      if (!resposta) {
        alert(
          "Escreva a resposta antes de concluir."
        );

        return;
      }

      try {
        await apiPostAuth(
          `/admin/atendimentos/${id}/responder`,
          {
            resposta
          }
        );

        await carregarAtendimentos();

      } catch (err) {
        console.error(err);

        alert(
          "Erro ao responder atendimento."
        );
      }
    }

    carregarAtendimentos();
  </script>

</body>

</html>
