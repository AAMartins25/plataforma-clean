<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Reembolso</title>

  <link
    rel="stylesheet"
    href="../css/style.css"
  >
</head>

<body>

  <header
    style="
      padding-top:8px;
      padding-bottom:24px;
      position:relative;
    "
  >
    <div
      style="
        margin-top:32px;
        display:flex;
        justify-content:center;
        align-items:center;
      "
    >
      <h1
        style="
          margin:-6px 0 0 0;
          font-size:1.55rem;
          text-align:center;
        "
      >
        💰 Reembolso
      </h1>
    </div>

    <nav
      style="
        position:absolute;
        right:24px;
        top:22px;
        display:flex;
        gap:10px;
        align-items:center;
      "
    >
      <a
        class="btn"
        href="index.html"
        title="Voltar"
      >
        ⇦
      </a>

      <a
        class="btn"
        href="#"
        onclick="irParaInicio('../index.html'); return false;"
        title="Início"
      >
        ⌂
      </a>

      <a
        class="btn"
        href="#"
        onclick="confirmarSaidaAdmin(); return false;"
        title="Sair"
      >
        ⎋
      </a>
    </nav>
  </header>

  <main class="container">

    <div class="card">

      <h2>
        Solicitações de reembolso
      </h2>

      <div
        id="listaReembolsos"
        class="list"
      >
        <p>Carregando...</p>
      </div>

    </div>

  </main>

  <footer>
    <p>
      © <span id="ano_atual"></span> - Quality Estudos
    </p>
  </footer>

  <script src="../js/app.js"></script>
  <script src="../js/admin.js"></script>
  <script src="../js/admin-reembolsos.js"></script>

  <script>
    function confirmarSaidaAdmin() {
      const ok = confirm(
        "Deseja realmente sair da plataforma?"
      );

      if (!ok) return;

      logout();
    }

    const anoAtual =
      document.getElementById("ano_atual");

    if (anoAtual) {
      anoAtual.textContent =
        new Date().getFullYear();
    }

    requireAdmin();
  </script>

</body>

</html>
