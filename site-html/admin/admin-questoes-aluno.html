<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <script src="../js/sessao.js"></script>
  <script src="../js/admin-acesso.js?v=perfis-1"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Questões para o aluno</title>

    <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/admin-responsivo.css">
  <link rel="stylesheet" href="../css/admin-shell.css" />
  <script src="../js/cabecalho.js?v=altura6-1" defer></script>
  <script src="../js/rodape.js" defer></script>
  <link rel="stylesheet" href="../css/admin-cabecalho-padrao.css?v=1">
  <script src="../js/admin-cabecalho-padrao.js?v=1" defer></script>
</head>

<body class="admin-shell admin-cabecalho-padrao">

<header
  style="
    padding-top:0.5rem;
    padding-bottom:1.5rem;
    position:relative;
  "
>
  <div
    style="
      margin-top:2rem;
      display:flex;
      justify-content:center;
      align-items:center;
    "
  >
    <h1
      style="
        margin:-0.375rem 0 0 0;
        font-size:1.55rem;
        text-align:center;
      "
    >
      📝 Questões para o aluno
    </h1>
  </div>

  <nav
    style="
      position:absolute;
      right:1.5rem;
      top:1.375rem;
      display:flex;
      gap:0.625rem;
      align-items:center;
    "
  >
    <a
      class="btn"
      href="index.html"
      title="Voltar"
    >
      ⇦
    </a>

    <a
      class="btn"
      href="../index.html"
      title="Início"
    >
      ⌂
    </a>

    <a
      class="btn"
      href="#"
      onclick="confirmarSaidaAdmin(); return false;"
      title="Sair"
    >
      ⎋
    </a>
  </nav>
</header>

<main class="container">

    <div class="card">

        <h2>1) Selecionar curso</h2>

        <select
            id="cursoSelectQuestoes"
            style="width:100%;padding:0.75rem;">
        </select>

    </div>

    <div class="card">

        <h2>2) Selecionar disciplina</h2>

        <select
            id="disciplinaSelectQuestoes"
            style="width:100%;padding:0.75rem;">
        </select>

    </div>

    <div class="card">

        <h2>3) Selecionar assunto</h2>

        <select
            id="assuntoSelectQuestoes"
            style="width:100%;padding:0.75rem;">
        </select>

        <div style="margin-top:1.25rem;">

            <button
                class="btn"
                id="btnAbrirQuestoes">

                Abrir questões

            </button>

        </div>

    </div>

</main>

<footer>
  <p>
    © <span id="ano_atual">2026</span> Quality
  </p>
</footer>

<script src="../js/app.js?v=perfis-1"></script>
<script src="../js/admin.js?v=perfis-1"></script>

<script>
AdminQuestoesAluno.init();
</script>

<script>
  function confirmarSaidaAdmin() {
    const ok = confirm("Deseja realmente sair da plataforma?");

    if (!ok) return;

    logout();
  }

  const anoAtual = document.getElementById("ano_atual");

  if (anoAtual) {
    anoAtual.textContent = new Date().getFullYear();
  }
</script>

</body>
</html>
