<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <script src="js/sessao.js"></script>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Redefinir senha</title>

  <link
    rel="stylesheet"
    href="css/style.css"
  >
  <script src="js/cabecalho.js" defer></script>
</head>

<body class="auth-page atendimento-page">

  <header
    style="
      padding-top:8px;
      padding-bottom:24px;
      position:relative;
    "
  >
    <div
      style="
        margin-top:32px;
        display:flex;
        justify-content:center;
        align-items:center;
      "
    >
      <h1
      >
        🔐 Redefinir senha
      </h1>
    </div>
    <nav class="ro-header-icon-actions">
      <a class="btn" href="login.html" title="Voltar" aria-label="Voltar">⇦</a>
      <a class="btn" href="index.html" title="Início" aria-label="Início">⌂</a>
      <a class="btn atendimento-auth-exit" href="#" onclick="sairComConfirmacao(); return false;" title="Sair" aria-label="Sair">⎋</a>
    </nav>
  </header>

  <main class="container">

    <div class="card">

      <h2>
        Criar nova senha
      </h2>

      <form
        id="formRedefinirSenha"
        class="list"
        novalidate
      >

        <div class="assunto">

          <label for="novaSenha">
            <b>Nova senha</b>
          </label>

          <div
            style="
              position:relative;
              width:100%;
            "
          >
            <input
              id="novaSenha"
              type="password"
              required
              placeholder="Informe a nova senha"
              style="
                width:100%;
                padding:12px;
                padding-right:48px;
                border:1px solid #ddd;
                border-radius:6px;
              "
            >

            <button
              type="button"
              id="toggleNovaSenha"
              title="Mostrar ou ocultar senha"
              style="
                position:absolute;
                right:10px;
                top:50%;
                transform:translateY(-50%);
                border:none;
                background:none;
                cursor:pointer;
              "
            >
              👁
            </button>
          </div>

        </div>

        <div class="assunto">

          <label for="confirmarNovaSenha">
            <b>Confirmar nova senha</b>
          </label>

          <div
            style="
              position:relative;
              width:100%;
            "
          >
            <input
              id="confirmarNovaSenha"
              type="password"
              required
              placeholder="Repita a nova senha"
              style="
                width:100%;
                padding:12px;
                padding-right:48px;
                border:1px solid #ddd;
                border-radius:6px;
              "
            >

            <button
              type="button"
              id="toggleConfirmarNovaSenha"
              title="Mostrar ou ocultar senha"
              style="
                position:absolute;
                right:10px;
                top:50%;
                transform:translateY(-50%);
                border:none;
                background:none;
                cursor:pointer;
              "
            >
              👁
            </button>
          </div>

        </div>

        <button
          type="submit"
          class="btn"
        >
          Redefinir senha
        </button>

        <div
          id="msg"
          style="margin-top:10px;"
        ></div>

      </form>

    </div>

  </main>

  <footer>
    <p>
      © <span id="ano_atual">2026</span> RO
    </p>
  </footer>

  <script src="js/app.js"></script>
  <script src="js/redefinir-senha.js"></script>

  <script>
    const anoAtual =
      document.getElementById(
        "ano_atual"
      );

    if (anoAtual) {
      anoAtual.textContent =
        2026;
    }

    function configurarToggle(
      botaoId,
      campoId
    ) {
      const botao =
        document.getElementById(
          botaoId
        );

      const campo =
        document.getElementById(
          campoId
        );

      if (!botao || !campo) {
        return;
      }

      botao.addEventListener(
        "click",
        () => {
          const oculto =
            campo.type === "password";

          campo.type =
            oculto
              ? "text"
              : "password";

          botao.textContent =
            oculto
              ? "🙈"
              : "👁";
        }
      );
    }

    configurarToggle(
      "toggleNovaSenha",
      "novaSenha"
    );

    configurarToggle(
      "toggleConfirmarNovaSenha",
      "confirmarNovaSenha"
    );
  </script>

</body>

</html>
