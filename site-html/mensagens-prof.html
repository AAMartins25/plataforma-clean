<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mensagens ao prof</title>

  <link rel="stylesheet" href="css/style.css">
</head>

<body
  class="mensagens-prof-page"
  data-page="mensagens-prof"
>

<header class="mensagens-prof-header">

  <div class="mensagens-prof-header-identificacao">

    <h1 id="titulo_curso_mensagens_prof"></h1>

    <h2>
      💬 Mensagens ao prof
    </h2>

  </div>

  <nav class="mensagens-prof-header-acoes">

    <a
      class="btn"
      href="javascript:history.back()"
      title="Voltar"
      aria-label="Voltar"
    >
      ⇦
    </a>

    <a
      class="btn"
      href="index.html"
      title="Início"
      aria-label="Início"
    >
      ⌂
    </a>

    <a
      class="btn"
      href="javascript:void(0)"
      onclick="logout()"
      title="Sair"
      aria-label="Sair"
    >
      ⎋
    </a>

  </nav>

</header>

<main class="container">

  <div class="card mensagens-prof-escolha-card">

    <h2 class="mensagens-prof-escolha-titulo">
      Escolha
    </h2>

    <div class="mensagens-prof-filtros">

      <div class="mensagens-prof-filtro-grupo">

        <label for="filtro_disciplina">
          Disciplina
        </label>

        <select
          id="filtro_disciplina"
          class="mensagens-prof-select"
        ></select>

      </div>

      <div class="mensagens-prof-filtro-grupo">

        <label for="filtro_assunto">
          Assunto
        </label>

        <select
          id="filtro_assunto"
          class="mensagens-prof-select"
        ></select>

      </div>

    </div>

  </div>

  <div class="card mensagens-prof-total-card">

    <h2
      id="total_mensagens"
      class="mensagens-prof-total-titulo"
    >
      Total: 0 conversas
    </h2>

  </div>

  <div id="area_mensagens"></div>

</main>

<footer>
  <p>© <span id="anoAtual"></span> - Quality Estudos</p>
</footer>

<script>
const API_BASE =
"https://plataforma-quality-backend.onrender.com";

let conversas = [];

const tituloCursoMensagensProf =
  document.getElementById(
    "titulo_curso_mensagens_prof"
  );

if (tituloCursoMensagensProf) {
  tituloCursoMensagensProf.innerText =
    new URLSearchParams(
      window.location.search
    ).get("curso_nome") ||
    "Curso";
}

function logout() {
  localStorage.removeItem("access_token");
  window.location.href = "index.html";
}

function getToken() {
  return localStorage.getItem("access_token");
}

function esc(texto) {
  if (texto == null) return "";

  return String(texto)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}

async function apiGet(path) {
  const token = getToken();

  const res = await fetch(`${API_BASE}${path}`, {
    headers: {
      Authorization: `Bearer ${token}`
    }
  });

  if (!res.ok) {
    throw new Error(`Erro ${res.status}`);
  }

  return await res.json();
}

async function exibirNomeUsuarioLogadoMensagens() {
  const token = getToken();

  if (!token) return;

  try {
    const me = await apiGet("/me");

    if (!me || !me.nome) return;

    const partesNome = String(me.nome)
      .trim()
      .split(/\s+/)
      .filter(Boolean);

    if (!partesNome.length) return;

    const primeiroNome = partesNome[0];

    const ultimoNome =
      partesNome.length > 1
        ? partesNome[partesNome.length - 1]
        : "";

    const nomeResumido =
      ultimoNome
        ? `${primeiroNome} ${ultimoNome}`
        : primeiroNome;

    const identificacao =
      document.createElement("div");

    identificacao.id =
      "nomeUsuarioLogadoGlobal";

    identificacao.textContent =
      primeiroNome.toUpperCase();

    identificacao.style.position =
      "fixed";

    identificacao.style.top =
      "9px";

    identificacao.style.right =
      "47px";

    identificacao.style.zIndex =
      "9999";

    identificacao.style.fontSize =
      "0.68rem";

    identificacao.style.fontWeight =
      "600";

    identificacao.style.letterSpacing =
      "0.4px";

    identificacao.style.color =
      "#4b5563";

    identificacao.style.opacity =
      "0.78";

    identificacao.style.cursor =
      "default";

    identificacao.style.whiteSpace =
      "nowrap";

    const tooltip =
      document.createElement("div");

    tooltip.textContent =
      nomeResumido.toUpperCase();

    tooltip.style.position =
      "absolute";

    tooltip.style.right =
      "calc(100% + 8px)";

    tooltip.style.top =
      "50%";

    tooltip.style.transform =
      "translateY(-50%)";

    tooltip.style.fontSize =
      "0.68rem";

    tooltip.style.fontWeight =
      "600";

    tooltip.style.letterSpacing =
      "0.2px";

    tooltip.style.color =
      "#4b5563";

    tooltip.style.whiteSpace =
      "nowrap";

    tooltip.style.opacity =
      "0";

    tooltip.style.visibility =
      "hidden";

    tooltip.style.pointerEvents =
      "none";

    tooltip.style.transition =
      "opacity 0.15s ease";

    identificacao.style.position =
      "fixed";

    identificacao.appendChild(
      tooltip
    );

    identificacao.addEventListener(
      "mouseenter",
      () => {
        tooltip.style.opacity = "1";
        tooltip.style.visibility = "visible";
      }
    );

    identificacao.addEventListener(
      "mouseleave",
      () => {
        tooltip.style.opacity = "0";
        tooltip.style.visibility = "hidden";
      }
    );

    document.body.appendChild(
      identificacao
    );

  } catch (err) {
    console.warn(
      "Não foi possível exibir o nome do aluno:",
      err
    );
  }
}

async function apiPost(path, body) {
  const token = getToken();

  const res = await fetch(`${API_BASE}${path}`, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      Authorization: `Bearer ${token}`
    },
    body: JSON.stringify(body || {})
  });

  if (!res.ok) {
    const txt = await res.text();
    throw new Error(txt || `Erro ${res.status}`);
  }

  return await res.json();
}

async function carregarMensagens() {
  try {
    conversas = await apiGet("/me/mensagens-prof");

    preencherFiltroDisciplinas();
    renderizarConversas();

  } catch (err) {
    console.error(err);

    document.getElementById("area_mensagens").innerHTML = `
      <div class="card">
        Erro ao carregar mensagens.
      </div>
    `;
  }
}

function preencherFiltroDisciplinas() {
  const select = document.getElementById("filtro_disciplina");

  const disciplinas = [
    ...new Map(
      conversas.map(c => [
        c.disciplina_id,
        {
          id: c.disciplina_id,
          nome: c.disciplina_nome,
          ordem: c.disciplina_ordem
        }
      ])
    ).values()
  ];

  disciplinas.sort((a, b) => a.ordem - b.ordem);

  select.innerHTML = `<option value="">TODAS</option>`;

  disciplinas.forEach(d => {
    select.innerHTML += `
      <option value="${d.id}">
        ${esc(d.nome)}
      </option>
    `;
  });

  preencherFiltroAssuntos();

  select.onchange = () => {
    preencherFiltroAssuntos();
    renderizarConversas();
  };
}

function preencherFiltroAssuntos() {
  const disciplinaId =
    document.getElementById("filtro_disciplina").value;

  let dados = conversas;

  if (disciplinaId) {
    dados = dados.filter(
      c => String(c.disciplina_id) === disciplinaId
    );
  }

  const assuntos = [
    ...new Map(
      dados.map(c => [
        c.assunto_id,
        {
          id: c.assunto_id,
          nome: c.assunto_nome,
          ordem: c.assunto_ordem
        }
      ])
    ).values()
  ];

  assuntos.sort((a, b) => a.ordem - b.ordem);

  const select = document.getElementById("filtro_assunto");

  select.innerHTML = `<option value="">TODOS</option>`;

  assuntos.forEach(a => {
    select.innerHTML += `
      <option value="${a.id}">
        ${esc(a.nome)}
      </option>
    `;
  });

  select.onchange = renderizarConversas;
}

function renderizarConversas() {
  const disciplinaId =
    document.getElementById("filtro_disciplina").value;

  const assuntoId =
    document.getElementById("filtro_assunto").value;

  let dados = [...conversas];

  if (disciplinaId) {
    dados = dados.filter(
      c => String(c.disciplina_id) === disciplinaId
    );
  }

  if (assuntoId) {
    dados = dados.filter(
      c => String(c.assunto_id) === assuntoId
    );
  }

  document.getElementById(
    "total_mensagens"
  ).innerText =
    dados.length === 1
      ? "Total: 1 conversa"
      : `Total: ${dados.length} conversas`;

  if (!dados.length) {
    document.getElementById("area_mensagens").innerHTML = `
      <div class="card">
        Nenhuma mensagem encontrada.
      </div>
    `;
    return;
  }

  let html = "";
  let disciplinaAtual = null;
  let assuntoAtual = null;

  dados.forEach(c => {
    const mudouGrupo =
    disciplinaAtual !== c.disciplina_id ||
    assuntoAtual !== c.assunto_id;

  if (mudouGrupo) {
    disciplinaAtual = c.disciplina_id;
    assuntoAtual = c.assunto_id;

    html += `
      <div class="card mensagens-prof-identificacao-card">

        <h2 class="mensagens-prof-disciplina-titulo">
          ${esc(c.disciplina_nome)}
        </h2>

        <div class="mensagens-prof-assunto-titulo">
          ${esc(c.assunto_nome)}
        </div>

      </div>
    `;
  }

    html += montarCardConversa(c);
  });

  document.getElementById("area_mensagens").innerHTML = html;
}

function montarCardConversa(c) {
  const ehCertoErrado =
    c.tipo === "CERTO_ERRADO" ||
    c.tipo_questao === "CERTO_ERRADO";

  const respostaCorreta = ehCertoErrado
    ? (c.gabarito === "C" ? "CERTO" : "ERRADO")
    : (c.gabarito || "");

  const mensagensAluno =
    (c.mensagens || []).filter(m => m.autor === "ALUNO").length;

  const ultimaMensagem =
    c.mensagens && c.mensagens.length
      ? c.mensagens[c.mensagens.length - 1]
      : null;

  const podeResponder =
    c.status !== "ENCERRADA" &&
    mensagensAluno < 3 &&
    ultimaMensagem &&
    ultimaMensagem.autor === "PROFESSOR";

  const aguardandoProfessor =
    ultimaMensagem &&
    ultimaMensagem.autor === "ALUNO" &&
    mensagensAluno < 3;

  const conversaEncerrada =
    c.status === "ENCERRADA" ||
    (
      mensagensAluno >= 3 &&
      ultimaMensagem &&
      ultimaMensagem.autor === "PROFESSOR"
    );

  return `
    <div class="card">

      <div class="mensagens-prof-enunciado">
        ${
          ehCertoErrado
            ? `${esc(c.enunciado)} (${respostaCorreta})`
            : `${esc(c.enunciado)} (Gab. ${esc(respostaCorreta)})`
        }
      </div>

      <div class="mensagens-prof-comentario">

        <strong>Comentário:</strong>

        <div class="mensagens-prof-comentario-texto">
          ${esc(
            c.comentario ||
            "Comentário não cadastrado."
          )}
        </div>

      </div>

      <div style="margin-top:18px;">
        ${montarMensagens(c)}
      </div>

      ${
        podeResponder
          ? montarAreaNovaMensagem(c.conversa_id)
          : aguardandoProfessor
            ? `
              <div style="
                margin-top:16px;
                font-size:.9rem;
                opacity:.8;
              ">
                Aguardando resposta do professor.
              </div>
            `
            : conversaEncerrada
              ? `
                <div style="
                  margin-top:16px;
                  font-size:.9rem;
                  opacity:.8;
                ">
                  Chat finalizado.
                </div>
              `
              : ""
      }

    </div>
  `;
}

function montarMensagens(c) {
  return (c.mensagens || []).map((m, idx) => {
    const ehAluno = m.autor === "ALUNO";

    return `
      <div class="
        mensagens-prof-mensagem
        ${
          ehAluno
            ? "mensagens-prof-mensagem-aluno"
            : "mensagens-prof-mensagem-prof"
        }
      ">

        <div class="mensagens-prof-mensagem-autor">
          ${ehAluno ? "Eu" : "Prof"}
        </div>

        <div class="mensagens-prof-mensagem-texto">${esc(m.texto).trim()}</div>

      </div>
    `;
  }).join("");
}

function numeroMensagem(autor, mensagens, idxAtual) {
  let contador = 0;

  for (let i = 0; i <= idxAtual; i++) {
    if (mensagens[i].autor === autor) {
      contador++;
    }
  }

  return contador;
}

function montarAreaNovaMensagem(conversaId) {
  return `
    <div style="
      margin-top:18px;
      padding:12px;
      background:#f8f8f8;
      border-radius:6px;
    ">
      <h3>Responder ao professor</h3>

      <textarea
        id="nova_msg_${conversaId}"
        placeholder="Escreva sua nova mensagem ao professor..."
        style="
          width:100%;
          min-height:100px;
          padding:12px;
          border:1px solid #ddd;
          border-radius:6px;
        "
      ></textarea>

      <div style="margin-top:12px;">
        <button
          class="btn"
          onclick="enviarNovaMensagem(${conversaId})"
        >
          Enviar ao prof.
        </button>
      </div>
    </div>
  `;
}

async function enviarNovaMensagem(conversaId) {
  const conversa = conversas.find(c => c.conversa_id === conversaId);

  if (!conversa) return;

  const campo = document.getElementById(`nova_msg_${conversaId}`);

  if (!campo) return;

  const texto = campo.value.trim();

  if (!texto) {
    alert("Escreva uma mensagem antes de enviar.");
    return;
  }

  const totalPalavras = texto.split(/\s+/).filter(Boolean).length;

  if (totalPalavras > 300) {
    alert("A mensagem deve ter no máximo 300 palavras.");
    return;
  }

  const confirmar = confirm(
    "Confirma enviar esta mensagem ao professor? Após o envio, ela não poderá ser editada."
  );

  if (!confirmar) return;

  try {
    await apiPost("/me/mensagens-prof", {
      questao_id: conversa.questao_id,
      bateria_id: conversa.bateria_id,
      texto
    });

    await carregarMensagens();

  } catch (err) {
    console.error(err);
    alert("Erro ao enviar mensagem: " + err.message);
  }
}

document.getElementById("anoAtual").textContent =
  new Date().getFullYear();

exibirNomeUsuarioLogadoMensagens();
carregarMensagens();

</script>

</body>
</html>
