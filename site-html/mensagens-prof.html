  <script src="js/vendor/katex/katex.min.js"></script>

  <script src="js/teoria-imagens.js?v=questoes1"></script>

<script src="js/registro-conteudo.js"></script>

<script src="js/editor-teoria.js"></script>
<script src="js/registro-editor.js"></script>
  <script>
const API_BASE =
"https://plataforma-quality-backend.onrender.com";

let conversas = [];
const reformulacoesPendentes = new Map();
const rascunhosMensagem = new Map();
const AVISO_REFORMULACAO = "Ao enviar esta nova mensagem, a conversa anterior será apagada. Copie trechos que considerar importantes da conversa atual e cole na nova mensagem a ser enviada ao professor.";

const tituloCursoMensagensProf =
  document.getElementById(
    "titulo_curso_mensagens_prof"
  );

if (tituloCursoMensagensProf) {
  tituloCursoMensagensProf.innerText =
    new URLSearchParams(
      window.location.search
    ).get("curso_nome") ||
    "Curso";
}

function logout() {
  Sessao.encerrar();
  window.location.href = "index.html";
}

function getToken() {
  return localStorage.getItem("access_token");
}

function esc(texto) {
  if (texto == null) return "";

  return String(texto)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}

function contextoMensagens(path) {
  const params = new URLSearchParams(location.search);
  const query = new URLSearchParams();
  for (const key of ['curso_id','contratacao_id','demonstracao_id']) if (params.get(key)) query.set(key,params.get(key));
  if (!query.toString()) return path;
  return path + (path.includes("?") ? "&" : "?") + query;
}

async function apiGet(path) {
  const token = getToken();

  const res = await Sessao.fetch(`${API_BASE}${contextoMensagens(path)}`, {
    headers: {
      Authorization: `Bearer ${token}`
    }
  });

  if (!res.ok) {
    const erro = new Error(`Erro HTTP ${res.status}`);
    erro.status = res.status;
    throw erro;
  }

  return await res.json();
}

async function exibirNomeUsuarioLogadoMensagens() {
  const sessaoOrigem = Sessao.snapshot();
  const token = getToken();

  if (!token) return;

  try {
    const me = await apiGet("/me");
        if (!Sessao.mesma(sessaoOrigem)) return;

    if (!me || !me.nome) return;

    const partesNome = String(me.nome)
      .trim()
      .split(/\s+/)
      .filter(Boolean);

    if (!partesNome.length) return;

    const primeiroNome = partesNome[0];

    const ultimoNome =
      partesNome.length > 1
        ? partesNome[partesNome.length - 1]
        : "";

    const nomeResumido =
      ultimoNome
        ? `${primeiroNome} ${ultimoNome}`
        : primeiroNome;

    const identificacao =
      document.createElement("div");

    identificacao.id =
      "nomeUsuarioLogadoGlobal";

    identificacao.textContent =
      primeiroNome.toUpperCase();

    identificacao.style.position =
      "fixed";

    identificacao.style.top =
      "9px";

    identificacao.style.right =
      "47px";

    identificacao.style.zIndex =
      "9999";

    identificacao.style.fontSize =
      "0.68rem";

    identificacao.style.fontWeight =
      "600";

    identificacao.style.letterSpacing =
      "0.4px";

    identificacao.style.color =
      "#4b5563";

    identificacao.style.opacity =
      "0.78";

    identificacao.style.cursor =
      "default";

    identificacao.style.whiteSpace =
      "nowrap";

    const tooltip =
      document.createElement("div");

    tooltip.textContent =
      nomeResumido.toUpperCase();

    tooltip.style.position =
      "absolute";

    tooltip.style.right =
      "calc(100% + 8px)";

    tooltip.style.top =
      "50%";

    tooltip.style.transform =
      "translateY(-50%)";

    tooltip.style.fontSize =
      "0.68rem";

    tooltip.style.fontWeight =
      "600";

    tooltip.style.letterSpacing =
      "0.2px";

    tooltip.style.color =
      "#4b5563";

    tooltip.style.whiteSpace =
      "nowrap";

    tooltip.style.opacity =
      "0";

    tooltip.style.visibility =
      "hidden";

    tooltip.style.pointerEvents =
      "none";

    tooltip.style.transition =
      "opacity 0.15s ease";

    identificacao.style.position =
      "fixed";

    identificacao.appendChild(
      tooltip
    );

    identificacao.addEventListener(
      "mouseenter",
      () => {
        tooltip.style.opacity = "1";
        tooltip.style.visibility = "visible";
      }
    );

    identificacao.addEventListener(
      "mouseleave",
      () => {
        tooltip.style.opacity = "0";
        tooltip.style.visibility = "hidden";
      }
    );

    document.body.appendChild(
      identificacao
    );

  } catch (err) {
    console.warn(
      "Não foi possível exibir o nome do aluno:",
      err
    );
  }
}

async function apiPost(path, body) {
  const token = getToken();

  const res = await Sessao.fetch(`${API_BASE}${contextoMensagens(path)}`, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      Authorization: `Bearer ${token}`
    },
    body: JSON.stringify(body || {})
  });

  if (!res.ok) {
    const txt = await res.text();
    let detalhe = txt;
    try { detalhe = JSON.parse(txt).detail ?? txt; } catch (_) {}
    const erro = new Error(typeof detalhe === "string" ? detalhe : `Erro ${res.status}`);
    erro.status = res.status;
    throw erro;
  }

  return await res.json();
}

async function carregarMensagens() {
  try {
    conversas = await apiGet("/me/mensagens-prof");

    preencherFiltroDisciplinas();
    renderizarConversas();

  } catch (err) {
    console.error(err);

    document.getElementById("area_mensagens").innerHTML = `
      <div class="card">
        Erro ao carregar mensagens.
      </div>
    `;
  }
}

function preencherFiltroDisciplinas() {
  const select = document.getElementById("filtro_disciplina");

  const disciplinas = [
    ...new Map(
      conversas.map(c => [
        c.disciplina_id,
        {
          id: c.disciplina_id,
          nome: c.disciplina_nome,
          ordem: c.disciplina_ordem
        }
      ])
    ).values()
  ];

  disciplinas.sort((a, b) => a.ordem - b.ordem);

  select.innerHTML = `<option value="">TODAS</option>`;

  disciplinas.forEach(d => {
    select.innerHTML += `
      <option value="${d.id}">
        ${esc(d.nome)}
      </option>
    `;
  });

  preencherFiltroAssuntos();

  select.onchange = () => {
    preencherFiltroAssuntos();
    renderizarConversas();
  };
}

function preencherFiltroAssuntos() {
  const disciplinaId =
    document.getElementById("filtro_disciplina").value;

  let dados = conversas;

  if (disciplinaId) {
    dados = dados.filter(
      c => String(c.disciplina_id) === disciplinaId
    );
  }

  const assuntos = [
    ...new Map(
      dados.map(c => [
        c.assunto_id,
        {
          id: c.assunto_id,
          nome: c.assunto_nome,
          ordem: c.assunto_ordem
        }
      ])
    ).values()
  ];

  assuntos.sort((a, b) => a.ordem - b.ordem);

  const select = document.getElementById("filtro_assunto");

  select.innerHTML = `<option value="">TODOS</option>`;

  assuntos.forEach(a => {
    select.innerHTML += `
      <option value="${a.id}">
        ${esc(a.nome)}
      </option>
    `;
  });

  select.onchange = renderizarConversas;
}

function renderizarConversas() {
  const disciplinaId =
    document.getElementById("filtro_disciplina").value;

  const assuntoId =
    document.getElementById("filtro_assunto").value;

  let dados = [...conversas];

  if (disciplinaId) {
    dados = dados.filter(
      c => String(c.disciplina_id) === disciplinaId
    );
  }

  if (assuntoId) {
    dados = dados.filter(
      c => String(c.assunto_id) === assuntoId
    );
  }

  document.getElementById(
    "total_mensagens"
  ).innerText =
    `Total: ${dados.length}`;

  if (!dados.length) {
    document.getElementById("area_mensagens").innerHTML = `
      <div class="card">
        Nenhuma mensagem encontrada.
      </div>
    `;
    return;
  }

  let html = "";
  let disciplinaAtual = null;
  let assuntoAtual = null;

  dados.forEach(c => {
    const mudouGrupo =
    disciplinaAtual !== c.disciplina_id ||
    assuntoAtual !== c.assunto_id;

  if (mudouGrupo) {
    disciplinaAtual = c.disciplina_id;
    assuntoAtual = c.assunto_id;

    html += `
      <div class="card mensagens-prof-identificacao-card">

        <h2 class="mensagens-prof-disciplina-titulo">
          ${esc(c.disciplina_nome)}
        </h2>

        <div class="mensagens-prof-assunto-titulo">
          ${esc(c.assunto_nome)}
        </div>

      </div>
    `;
  }

    html += montarCardConversa(c);
  });

  document.getElementById("area_mensagens").innerHTML = html;
  for (const campo of document.querySelectorAll('textarea[id^="nova_msg_"]')) {
    const id = Number(campo.id.slice(9)), dado = rascunhosMensagem.get(id);
    void RegistroEditor.iniciar(campo, dado?.texto || '', dado?.texto_formato, () => {
      try {rascunhosMensagem.set(id, RegistroEditor.ler(campo, false));} catch (_) {}
    });
  }
  for (const campo of document.querySelectorAll('textarea[id^="reformulacao_texto_"]')) {
    const id = Number(campo.id.slice(19)), p = reformulacoesPendentes.get(id);
    void RegistroEditor.iniciar(campo, p.texto, p.texto_formato, () => {
      if (p.fase === 'editar') {try {Object.assign(p, RegistroEditor.ler(campo, false));} catch (_) {}}
    });
    RegistroEditor.bloquear(campo, p.fase !== 'editar');
  }
}

function montarCardConversa(c) {
  const ehCertoErrado =
    c.tipo === "CERTO_ERRADO" ||
    c.tipo_questao === "CERTO_ERRADO";

  const respostaCorreta = ehCertoErrado
    ? (c.gabarito === "C" ? "CERTO" : "ERRADO")
    : (c.gabarito || "");

  const mensagensAluno =
    (c.mensagens || []).filter(m => m.autor === "ALUNO").length;

  const ultimaMensagem =
    c.mensagens && c.mensagens.length
      ? c.mensagens[c.mensagens.length - 1]
      : null;

  const podeResponder =
    c.status !== "ENCERRADA" &&
    mensagensAluno < 3 &&
    ultimaMensagem &&
    ultimaMensagem.autor === "PROFESSOR";

  const aguardandoProfessor =
    ultimaMensagem &&
    ultimaMensagem.autor === "ALUNO" &&
    mensagensAluno < 3;

  const conversaEncerrada =
    c.status === "ENCERRADA" ||
    (
      mensagensAluno >= 3 &&
      ultimaMensagem &&
      ultimaMensagem.autor === "PROFESSOR"
    );

  return `
    <div class="card">

      <div class="mensagens-prof-enunciado">
        ${
          ehCertoErrado
            ? `${QuestaoConteudo.renderizar(c.enunciado, c.enunciado_formato, c.bateria_id)} (${respostaCorreta})`
            : `${QuestaoConteudo.renderizar(c.enunciado, c.enunciado_formato, c.bateria_id)} (Gab. ${esc(respostaCorreta)})`
        }
      </div>

      <div class="mensagens-prof-comentario">

        <strong>Comentário:</strong>

        <div class="mensagens-prof-comentario-texto">
          ${QuestaoConteudo.renderizar(c.comentario || "Comentário não cadastrado.", c.comentario_formato, c.bateria_id)}
        </div>

      </div>

      <div style="margin-top:18px;">
        ${montarMensagens(c)}
      </div>

      ${
        podeResponder
          ? montarAreaNovaMensagem(c.conversa_id)
          : aguardandoProfessor
            ? `
              <div style="
                margin-top:16px;
                font-size:.9rem;
                opacity:.8;
              ">
                Aguardando resposta do professor.
              </div>
            `
            : conversaEncerrada
              ? `
                <div style="
                  margin-top:16px;
                  font-size:.9rem;
                  opacity:.8;
                ">
                  Chat finalizado.
                </div>
              `
              : ""
      }

      ${montarAreaReformulacao(c)}

    </div>
  `;
}

function montarAreaReformulacao(c) {
  const p = reformulacoesPendentes.get(Number(c.conversa_id));
  if (!p) return `<div style="margin-top:16px"><button class="btn mensagens-prof-btn-enviar" onclick="abrirReformulacao(${Number(c.conversa_id)})">Reformular mensagem ao prof</button></div>`;
  const bloqueada = p.fase === "incerta";
  return `<section class="card" style="margin-top:16px" id="reformulacao_${Number(c.conversa_id)}">
    <p role="note">${AVISO_REFORMULACAO}</p>
    <label for="reformulacao_texto_${Number(c.conversa_id)}">Nova mensagem ao professor</label>
    <textarea id="reformulacao_texto_${Number(c.conversa_id)}" placeholder="Escreva sua nova mensagem..."
      style="width:100%;min-height:120px;padding:12px;border:1px solid #ddd;border-radius:6px" ${bloqueada ? "readonly" : ""}>${esc(p.texto)}</textarea>
    ${p.mensagem ? `<p role="status">${esc(p.mensagem)}</p>` : ""}
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:12px">
      <button class="btn mensagens-prof-btn-enviar" ${p.fase === "enviando" ? "disabled" : ""} onclick="confirmarReformulacao(${Number(c.conversa_id)})">${bloqueada ? "Tentar novamente com segurança" : "Confirmar e enviar"}</button>
      ${p.fase === "editar" ? `<button class="btn" onclick="cancelarReformulacao(${Number(c.conversa_id)})">Cancelar</button>` : ""}
    </div>
  </section>`;
}

function novoIdOperacaoReformulacao() {
  if (window.crypto?.randomUUID) return window.crypto.randomUUID();
  if (!window.crypto?.getRandomValues) throw new Error("Este navegador não oferece geração segura de identificadores.");
  const b = new Uint8Array(16); window.crypto.getRandomValues(b); b[6] = (b[6] & 15) | 64; b[8] = (b[8] & 63) | 128;
  const h = [...b].map(v => v.toString(16).padStart(2, "0")).join("");
  return `${h.slice(0,8)}-${h.slice(8,12)}-${h.slice(12,16)}-${h.slice(16,20)}-${h.slice(20)}`;
}

function abrirReformulacao(conversaId) {
  const c = conversas.find(x => Number(x.conversa_id) === Number(conversaId));
  if (!c) return;
  reformulacoesPendentes.set(Number(conversaId), { texto: "", estado: c.estado_conversa, operacaoId: null, fase: "editar", mensagem: "" });
  renderizarConversas();
  document.getElementById(`reformulacao_texto_${conversaId}`)?.focus();
}

function cancelarReformulacao(conversaId) {
  const p = reformulacoesPendentes.get(Number(conversaId));
  if (!p || p.fase !== "editar") return;
  reformulacoesPendentes.delete(Number(conversaId));
  renderizarConversas();
}

async function confirmarReformulacao(conversaId) {
  const id = Number(conversaId), p = reformulacoesPendentes.get(id);
  const c = conversas.find(x => Number(x.conversa_id) === id);
  const field = document.getElementById(`reformulacao_texto_${id}`);
  if (!p || !c || !field || p.fase === "enviando") return;
  let dado;
  try { dado = p.fase === "incerta" ? {texto:p.texto, texto_formato:p.texto_formato || 'texto_puro'} : RegistroEditor.ler(field); }
  catch (err) { alert(err.message); return; }
  const texto = dado.texto;
  try {
    Object.assign(p, dado); if (!p.operacaoId) p.operacaoId = novoIdOperacaoReformulacao();
    if (!p.estado) p.estado = c.estado_conversa;
    p.fase = "enviando"; p.mensagem = "Enviando a nova mensagem..."; renderizarConversas();
    await apiPost(`/me/mensagens-prof/${id}/reformular`, {
      ...dado, operacao_id: p.operacaoId, estado_conversa: p.estado, confirmado: true
    });
    reformulacoesPendentes.delete(id);
    await carregarMensagens();
  } catch (err) {
    p.fase = "editar"; p.mensagem = "";
    if (err.status === 409) {
      try {
        await carregarMensagens();
        const atual = conversas.find(x => Number(x.conversa_id) === id);
        if (atual) {
          p.estado = atual.estado_conversa; p.operacaoId = null;
          p.mensagem = "A conversa mudou enquanto você escrevia. Confira as mensagens atualizadas e confirme novamente.";
          reformulacoesPendentes.set(id, p); renderizarConversas(); return;
        }
      } catch (_) {}
      reformulacoesPendentes.delete(id);
      alert("Esta conversa foi substituída ou não está mais disponível. A lista foi atualizada."); return;
    }
    if (!err.status || err.status >= 500) {
      p.fase = "incerta";
      p.mensagem = "Não foi possível confirmar o resultado. A conversa pode já ter sido reformulada; tente novamente com o mesmo texto para recuperar a operação com segurança.";
    } else {
      p.operacaoId = null;
      p.mensagem = `Não foi possível reformular a conversa: ${err.message}`;
    }
    reformulacoesPendentes.set(id, p); renderizarConversas();
  }
}

function montarMensagens(c) {
  return (c.mensagens || []).map((m, idx) => {
    const ehAluno = m.autor === "ALUNO";

    return `
      <div class="
        mensagens-prof-mensagem
        ${
          ehAluno
            ? "mensagens-prof-mensagem-aluno"
            : "mensagens-prof-mensagem-prof"
        }
      ">

        <div class="mensagens-prof-mensagem-autor">
          ${ehAluno ? "Eu" : "Prof"}
        </div>

        <div class="mensagens-prof-mensagem-texto">${RegistroConteudo.renderizar(m.texto, m.texto_formato)}</div>

      </div>
    `;
  }).join("");
}

function numeroMensagem(autor, mensagens, idxAtual) {
  let contador = 0;

  for (let i = 0; i <= idxAtual; i++) {
    if (mensagens[i].autor === autor) {
      contador++;
    }
  }

  return contador;
}

function montarAreaNovaMensagem(conversaId) {
  return `
    <div style="
      margin-top:18px;
      padding:12px;
      background:#f8f8f8;
      border-radius:6px;
    ">
      <h3 class="mensagens-prof-responder-titulo">
        Responder ao professor
      </h3>

      <textarea
        id="nova_msg_${conversaId}"
        placeholder="Escreva sua nova mensagem ao professor..."
        style="
          width:100%;
          min-height:100px;
          padding:12px;
          border:1px solid #ddd;
          border-radius:6px;
        "
      ></textarea>

      <div style="margin-top:12px;">
        <button
          class="btn mensagens-prof-btn-enviar"
          onclick="enviarNovaMensagem(${conversaId})"
        >
          Enviar ao prof.
        </button>
      </div>
    </div>
  `;
}

async function enviarNovaMensagem(conversaId) {
  const conversa = conversas.find(c => c.conversa_id === conversaId);

  if (!conversa) return;

  const campo = document.getElementById(`nova_msg_${conversaId}`);

  if (!campo) return;

  if (campo.dataset.enviando) return;
  let dado;
  try { dado = RegistroEditor.ler(campo); } catch (err) { alert(err.message); return; }

  const confirmar = confirm(
    "Confirma enviar esta mensagem ao professor? Após o envio, ela não poderá ser editada."
  );

  if (!confirmar) return;

  try {
    campo.dataset.enviando = '1'; RegistroEditor.bloquear(campo, true);
    await apiPost(`/me/mensagens-prof/${conversaId}/responder`, dado);
    rascunhosMensagem.delete(conversaId);

    await carregarMensagens();

  } catch (err) {
    console.error(err);
    alert("Erro ao enviar mensagem: " + err.message);
  } finally { delete campo.dataset.enviando; RegistroEditor.bloquear(campo, false); }
}

document.getElementById("anoAtual").textContent =
  new Date().getFullYear();

exibirNomeUsuarioLogadoMensagens();
carregarMensagens();

</script>

</body>
</html>
