<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <script src="js/sessao.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resumão Online</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/home-publica.css?v=1">
  <script src="js/cabecalho.js" defer></script>
</head>

<body class="home-page">

<header class="home-header">

  <div class="home-brand">
    <h1 class="home-brand-title">
      <svg class="home-brand-symbol" viewBox="0 0 48 48" fill="none" aria-hidden="true" focusable="false">
        <rect x="1" y="1" width="46" height="46" rx="13" fill="#16324f"/>
        <path d="M10 15c5-2 9-1 14 2 5-3 9-4 14-2v20c-5-2-9-1-14 2-5-3-9-4-14-2V15Z" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"/>
        <path d="M24 18v18" stroke="#fff" stroke-width="1.5"/>
        <path d="m17 23 4 4 10-10" stroke="#f4cb57" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="home-brand-wordmark">
        <span class="home-brand-name">Resumão Online</span>
        <span class="home-brand-tagline">DIRETO AO PONTO</span>
      </span>
    </h1>
  </div>

  <nav class="home-nav">

    <div class="home-nav-center">
      <a
        href="#"
        class="btn home-icon-btn"
        onclick="entrarEEstudar(); return false;"
        title="Entre / Faça cadastro"
        aria-label="Entre ou faça cadastro"
      >
        <svg class="home-person-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false">
          <circle cx="12" cy="8" r="3.5" stroke="currentColor" stroke-width="1.7"/>
          <path d="M5 21v-2a7 7 0 0 1 14 0v2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
        </svg>
      </a>
    </div>

    <div class="home-nav-actions">

      <a
        id="btnVoltarHome"
        href="#"
        class="btn home-icon-btn"
        onclick="voltarDaPaginaInicial(); return false;"
        title="Voltar"
        aria-label="Voltar"
        style="display:none;"
      >
        ⇦
      </a>

      <a
        id="btnSairHome"
        href="#"
        class="btn home-icon-btn"
        onclick="sairComConfirmacao(); return false;"
        title="Sair"
        aria-label="Sair"
      >
        ⎋
      </a>

    </div>

  </nav>

</header>

<main class="container">

  <!-- =====================================================
       CURSOS DISPONÍVEIS
  ====================================================== -->

  <div class="card home-cursos-disponiveis-card">

    <div
      class="home-cursos-toggle"
      role="button"
      tabindex="0"
      aria-expanded="true"
      aria-controls="area_cursos_disponiveis"
      onclick="alternarCursosDisponiveis()"
      onkeydown="if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); alternarCursosDisponiveis(); }"
    >
      <h2>📚 Cursos disponíveis</h2>
      <svg class="home-cursos-toggle-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false">
        <path d="m6 9 6 6 6-6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>

    <div
      id="area_cursos_disponiveis"
      style="display:block;"
    >

      <div
        id="lista-cursos-publicos"
        class="list"
        style="margin-top:15px;"
      ></div>

      <div
        id="mais-cursos-box"
        style="margin-top:12px;"
      ></div>

    </div>

  </div>


  <!-- =====================================================
       LOCALIZAR CURSO
  ====================================================== -->

  <div
    class="card home-localizar-card"
    style="
      padding:10px 18px;
      min-height:0;
    "
  >

    <div
      class="home-localizar"
      style="
        display:flex;
        align-items:center;
        gap:14px;
        flex-wrap:wrap;
        min-height:0;
        margin:0;
      "
    >

      <label
        for="buscaCurso"
        style="
          font-weight:bold;
          white-space:nowrap;
        "
      >
        🔎 Localizar
      </label>

      <input
        id="buscaCurso"
        type="text"
        placeholder="Digite palavra(s) chave"
        oninput="renderizarCursosPublicos()"
        style="
          padding:6px;
          border:1px solid #ddd;
          border-radius:1px;
          width:542px;
          max-width:100%;
          font-style:italic;
        "
      >

    </div>

  </div>


  <!-- =====================================================
       NÃO ENCONTROU O PREPARATÓRIO
  ====================================================== -->

  <!-- =====================================================
       COMO FUNCIONA
  ====================================================== -->

  <!-- Oculta temporariamente. Para reativar, remova o atributo hidden deste contêiner. -->
  <div class="card home-como-funciona-card" hidden>

    <!-- FUNCIONAMENTO DA PLATAFORMA -->

    <div
      class="home-como-funciona-header"
      onclick="alternarComoFunciona('area_funcionamento_plataforma')"
    >
      <h2>
        O funcionamento da plataforma
      </h2>
    </div>

    <div
      id="area_funcionamento_plataforma"
      class="home-como-funciona-conteudo"
      style="display:none;"
    >

      <div class="assunto">

        <h3>
          Como funciona
        </h3>

        <div class="home-video-placeholder">

          <span class="home-video-play">
            ▶
          </span>

          <span>
            Vídeo 1
          </span>

        </div>

      </div>

    </div>


    <!-- SOLICITAÇÃO DE REEMBOLSO -->

    <div
      class="home-como-funciona-header home-como-funciona-header-secundario"
      onclick="alternarComoFunciona('area_solicitacao_reembolso')"
    >
      <h2>
        Demais informações - resumido
      </h2>
    </div>

    <div
      id="area_solicitacao_reembolso"
      class="home-como-funciona-conteudo"
      style="display:none;"
    >

      <div class="assunto">

       <h3>
        Demais informações
      </h3>

        <div class="home-video-placeholder">

          <span class="home-video-play">
            ▶
          </span>

          <span>
            Vídeo 2
          </span>

        </div>

      </div>

    </div>

  </div>


  <!-- =====================================================
       ATENDIMENTO
  ====================================================== -->

  <div class="card home-atendimento-card">

    <div
      class="home-atendimento-header"
      onclick="alternarLista('area_atendimento_clean')"
    >

      <h2>
        🔗 Atendimento
      </h2>

    </div>

    <div
      id="area_atendimento_clean"
      class="home-atendimento-conteudo"
      style="display:none;"
    >

      <div
        style="
          display:flex;
          gap:18px;
          flex-wrap:wrap;
        "
      >

        <a
          class="btn home-atendimento-btn"
          href="#"
          onclick="abrirMeusDados(); return false;"
        >
          Atualizar meus dados / ver meu histórico de compras
        </a>

        <a
          class="btn home-atendimento-btn"
          href="fale-com-a-clean.html"
        >
          Falar com a Clean
        </a>

        <a
          class="btn home-atendimento-btn"
          href="#"
          onclick="abrirReembolso(); return false;"
        >
          Solicitar reembolso
        </a>

      </div>

    </div>

  </div>


  <!-- =====================================================
     CORRIDA
  ====================================================== -->

  <div
    class="card"
    style="text-align:center;"
  >

    <div class="home-race-scene" role="img" aria-label="Carro de corrida em direção à bandeira de chegada">
      <svg class="home-race-car" viewBox="0 0 82 44" fill="none" aria-hidden="true" focusable="false">
        <path d="M7 28h4l5-9h24l10 7 17 2 7 6H7v-6Z" fill="#edc550" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
        <path d="m29 19 4-10h9l7 17M5 13h15M11 8h10M4 22h7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M33 11h7l4 9H30l3-9Z" fill="currentColor"/>
        <path d="M68 23v8h10v-8H68Z" fill="currentColor"/>
        <circle cx="22" cy="33" r="7" fill="currentColor"/>
        <circle cx="60" cy="33" r="7" fill="currentColor"/>
        <circle cx="22" cy="33" r="3" fill="#fff"/>
        <circle cx="60" cy="33" r="3" fill="#fff"/>
      </svg>
      <span class="home-race-track" aria-hidden="true"></span>
      <svg class="home-race-flag" viewBox="0 0 40 44" fill="none" aria-hidden="true" focusable="false">
        <path d="M6 40V5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <path d="M7 6h26v20H7V6Z" fill="#fff"/>
        <path d="M7 6h6.5v6.7H7zM20 6h6.5v6.7H20zM13.5 12.7H20v6.6h-6.5zM26.5 12.7H33v6.6h-6.5zM7 19.3h6.5V26H7zM20 19.3h6.5V26H20z" fill="currentColor"/>
        <path d="M7 6h26v20H7" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
      </svg>
    </div>

  </div>

</main>


<footer>
  <p>
    © <span id="ano_atual">2026</span> RO
  </p>
</footer>


<script src="js/app.js?v=home-publica-1"></script>

<script>

  (function () {

    const btnSair =
      document.getElementById(
        "btnSairHome"
      );

    const btnVoltar =
      document.getElementById(
        "btnVoltarHome"
      );

    const token =
      localStorage.getItem(
        "access_token"
      );

    if (btnSair) {

      btnSair.style.display =
        token
          ? "inline-block"
          : "none";
    }

    if (btnVoltar) {

      btnVoltar.style.display =
        token &&
        localStorage.getItem(
          "pagina_antes_inicio"
        )
          ? "inline-block"
          : "none";
    }

  })();


  const anoAtual =
    document.getElementById(
      "ano_atual"
    );

  if (anoAtual) {

    anoAtual.textContent =
      2026;
  }


  function alternarCursosDisponiveis() {

    const area =
      document.getElementById(
        "area_cursos_disponiveis"
      );

    const lista =
      document.getElementById(
        "lista-cursos-publicos"
      );

    if (!area) {
      return;
    }

    const estavaFechada =
      area.style.display === "none";

    area.style.display =
      estavaFechada
        ? "block"
        : "none";

    document.querySelector('.home-cursos-toggle')?.setAttribute('aria-expanded', String(estavaFechada));

    if (
      estavaFechada &&
      lista
    ) {

      setTimeout(() => {

        lista.scrollIntoView({
          behavior: "smooth",
          block: "start"
        });

      }, 100);
    }
  }


  async function iniciarPaginaInicial() {

    await pageHomeCursosPublico();

    const params =
      new URLSearchParams(
        window.location.search
      );

    const abrirCursos =
      params.get("cursos") ===
      "aberto";

    const abrirAtendimento =
      params.get("atendimento") ===
      "aberto";


    if (abrirCursos) {

      const area =
        document.getElementById(
          "area_cursos_disponiveis"
        );

      const lista =
        document.getElementById(
          "lista-cursos-publicos"
        );

      if (area) {

        area.style.display =
          "block";
      }

      if (lista) {

        setTimeout(() => {

          lista.scrollIntoView({
            behavior: "smooth",
            block: "start"
          });

        }, 300);
      }
    }


    if (abrirAtendimento) {

      const areaAtendimento =
        document.getElementById(
          "area_atendimento_clean"
        );

      if (areaAtendimento) {

        areaAtendimento.style.display =
          "block";

        setTimeout(() => {

          areaAtendimento.scrollIntoView({
            behavior: "smooth",
            block: "center"
          });

        }, 300);
      }


      /*
        O parâmetro serve apenas para abrir
        o Atendimento nesta chegada.

        Depois, remove-o da URL para que
        um novo acesso à Home comece fechado.
      */

      const urlAtual =
        new URL(
          window.location.href
        );

      urlAtual.searchParams.delete(
        "atendimento"
      );

      window.history.replaceState(
        {},
        "",
        urlAtual.pathname +
          urlAtual.search +
          urlAtual.hash
      );
    }
  }


  function abrirMeusDados() {

    const token =
      localStorage.getItem(
        "access_token"
      );

    if (token) {

      window.location.href =
        "meus-dados.html";

      return;
    }

    window.location.href =
      "login.html?next=meus-dados.html";
  }


  function abrirReembolso() {

    const token =
      localStorage.getItem(
        "access_token"
      );

    if (token) {

      window.location.href =
        "reembolso.html";

      return;
    }

    window.location.href =
      "login.html?next=reembolso.html";
  }


  function alternarComoFunciona(idAbrir) {

    const ids = [
      "area_funcionamento_plataforma",
      "area_solicitacao_reembolso"
    ];

    const areaClicada =
      document.getElementById(idAbrir);

    if (!areaClicada) {
      return;
    }

    const estavaAberta =
      areaClicada.style.display !== "none";

    ids.forEach(id => {

      const area =
        document.getElementById(id);

      if (area) {
        area.style.display = "none";
      }

    });

    if (!estavaAberta) {
      areaClicada.style.display = "block";
    }
  }

  iniciarPaginaInicial();

</script>

</body>
</html>
