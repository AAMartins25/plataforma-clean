<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Questões críticas</title>

  <link rel="stylesheet" href="css/style.css">
</head>
<body
  class="questoes-criticas-page"
  data-page="questoes-criticas"
>

<header class="questoes-criticas-header">

  <div class="questoes-criticas-header-identificacao">

    <h1 id="titulo_curso_questoes_criticas"></h1>

    <h2>
      🚨 Questões diferenciadas
    </h2>

  </div>

  <nav class="questoes-criticas-header-acoes">

    <a
      class="btn"
      href="javascript:history.back()"
      title="Voltar"
      aria-label="Voltar"
    >
      ⇦
    </a>

    <a
      class="btn"
      href="#"
      onclick="irParaInicio('index.html'); return false;"
      title="Início"
      aria-label="Início"
    >
      ⌂
    </a>

    <a
      class="btn"
      href="#"
      onclick="sairComConfirmacao(); return false;"
      title="Sair"
      aria-label="Sair"
    >
      ⎋
    </a>

  </nav>

</header>

<main class="container">

  <div class="card questoes-criticas-escolha-card">

    <h2 class="questoes-criticas-escolha-titulo">
      Escolha
    </h2>

    <div class="questoes-criticas-filtros">

      <div class="questoes-criticas-filtro-grupo">

        <label for="filtroDisciplina">
          Disciplina
        </label>

        <select
          id="filtroDisciplina"
          class="questoes-criticas-select"
          onchange="aplicarFiltros()"
        >
        </select>

      </div>

      <div class="questoes-criticas-filtro-grupo">

        <label for="filtroTipo">
          Questões
        </label>

        <select
          id="filtroTipo"
          class="questoes-criticas-select"
          onchange="aplicarFiltros()"
        >
          <option value="TODAS">
            TODAS
          </option>

          <option value="ERRO">
            Só as que errei
          </option>

          <option value="DIFICIL">
            As difíceis
          </option>

          <option value="REVER">
            As que marquei para rever
          </option>
        </select>

      </div>

    </div>

  </div>

  <div id="area_questoes"></div>

  <div id="area_relatorio"></div>

  <div class="card questoes-criticas-voltar-card">

    <a
      class="btn questoes-criticas-btn-voltar"
      href="javascript:history.back()"
    >
      Voltar
    </a>

  </div>

</main>

<footer>
  <p>
    © <span id="ano_atual"></span> - Quality Estudos
  </p>
</footer>

<script src="js/app.js"></script>

<script>

let questoesCriticas = [];

const tituloCursoQuestoesCriticas =
  document.getElementById(
    "titulo_curso_questoes_criticas"
  );

if (tituloCursoQuestoesCriticas) {
  tituloCursoQuestoesCriticas.innerText =
    qs("curso_nome") ||
    "Curso";
}

function esc(s) {
  return String(s ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;");
}

function traduzResposta(v) {
  if (v === "C") return "CERTO";
  if (v === "E") return "ERRADO";
  return v || "-";
}

async function carregarQuestoesCriticas() {

  try {

    questoesCriticas =
      await apiGetAuth("/me/questoes-criticas");

    preencherFiltroDisciplinas();

    aplicarFiltros();

  } catch (err) {

    console.error(err);

    document.getElementById("area_questoes").innerHTML = `
      <div class="card">
        Erro ao carregar questões críticas.
      </div>
    `;
  }
}

function preencherFiltroDisciplinas() {

  const select =
    document.getElementById("filtroDisciplina");

  const disciplinas = [];

  questoesCriticas.forEach(q => {

    if (
      !disciplinas.some(
        d => d.id === q.disciplina_id
      )
    ) {
      disciplinas.push({
        id: q.disciplina_id,
        nome: q.disciplina_nome,
        ordem: q.disciplina_ordem
      });
    }

  });

  disciplinas.sort(
    (a,b) => a.ordem - b.ordem
  );

  select.innerHTML = `
    <option value="TODAS">TODAS</option>
  `;

  disciplinas.forEach(d => {

    select.innerHTML += `
      <option value="${d.id}">
        ${esc(d.nome)}
      </option>
    `;
  });
}

function aplicarFiltros() {

  const disciplina =
    document.getElementById("filtroDisciplina").value;

  const tipo =
    document.getElementById("filtroTipo").value;

  let lista = [...questoesCriticas];

  if (disciplina !== "TODAS") {

    lista = lista.filter(
      q => String(q.disciplina_id) === disciplina
    );
  }

  if (tipo === "ERRO") {
    lista = lista.filter(q => q.erro);
  }

  if (tipo === "DIFICIL") {
    lista = lista.filter(q => q.dificil);
  }

  if (tipo === "REVER") {
    lista = lista.filter(q => q.para_rever);
  }

  renderizarQuestoes(lista);

  renderizarMiniRelatorio(lista, disciplina);
}

function renderizarQuestoes(lista) {
  const area = document.getElementById("area_questoes");
  const disciplinaSelecionada = document.getElementById("filtroDisciplina").value;

  if (!lista.length) {
    area.innerHTML = `
      <div class="card">
        Nenhuma questão encontrada.
      </div>
    `;
    return;
  }

  const listaOrdenada = [...lista].sort((a, b) =>
    (a.disciplina_ordem ?? 0) - (b.disciplina_ordem ?? 0) ||
    (a.assunto_ordem ?? 0) - (b.assunto_ordem ?? 0) ||
    (a.questao_ordem ?? 0) - (b.questao_ordem ?? 0)
  );

  let html = `
    <div class="card questoes-criticas-total-card">

      <h2 class="questoes-criticas-total-titulo">
        Total: ${listaOrdenada.length} 
      </h2>

    </div>
  `;

  let questaoNumero = 1;

  const disciplinas = [];

  listaOrdenada.forEach(q => {
    let disciplina = disciplinas.find(d => d.id === q.disciplina_id);

    if (!disciplina) {
      disciplina = {
        id: q.disciplina_id,
        nome: q.disciplina_nome,
        ordem: q.disciplina_ordem,
        assuntos: []
      };

      disciplinas.push(disciplina);
    }

    let assunto = disciplina.assuntos.find(a => a.id === q.assunto_id);

    if (!assunto) {
      assunto = {
        id: q.assunto_id,
        nome: q.assunto_nome,
        ordem: q.assunto_ordem,
        questoes: []
      };

      disciplina.assuntos.push(assunto);
    }

    assunto.questoes.push(q);
  });

  disciplinas.forEach(disciplina => {

    disciplina.assuntos.forEach(assunto => {

      html += `
        <div class="card questoes-criticas-identificacao-card">

          <h2 class="questoes-criticas-disciplina-titulo">
            ${esc(disciplina.nome || "")}
          </h2>

          <div class="questoes-criticas-assunto-titulo">
            ${esc(assunto.nome || "")}
          </div>

        </div>
      `;

      const jaRenderizadas = new Set();

      const erros = assunto.questoes
        .filter(q => q.erro)
        .sort((a, b) =>
          (b.qtd_erros ?? 0) - (a.qtd_erros ?? 0) ||
          (a.questao_ordem ?? 0) - (b.questao_ordem ?? 0)
        );

      erros.forEach(q => {
        html += montarCardQuestaoCritica(q, questaoNumero++, "ERRO");
        jaRenderizadas.add(q.questao_id);
      });

      const dificeis = assunto.questoes
        .filter(q => q.dificil && !jaRenderizadas.has(q.questao_id))
        .sort((a, b) => (a.questao_ordem ?? 0) - (b.questao_ordem ?? 0));

      dificeis.forEach(q => {
        html += montarCardQuestaoCritica(q, questaoNumero++, "DIFICIL");
        jaRenderizadas.add(q.questao_id);
      });

      const paraRever = assunto.questoes
        .filter(q => q.para_rever && !jaRenderizadas.has(q.questao_id))
        .sort((a, b) => (a.questao_ordem ?? 0) - (b.questao_ordem ?? 0));

      paraRever.forEach(q => {
        html += montarCardQuestaoCritica(q, questaoNumero++, "REVER");
        jaRenderizadas.add(q.questao_id);
      });
    });
  });

  area.innerHTML = html;
}

function montarCardQuestaoCritica(q, numero, tipoGrupo) {
  let marcador = "";

  if (tipoGrupo === "ERRO") {
    marcador =
      q.qtd_erros > 1
        ? `${q.qtd_erros}❌`
        : "❌";
  }

  if (tipoGrupo === "DIFICIL") {
    marcador = "D";
  }

  if (tipoGrupo === "REVER") {
    marcador = "R";
  }

  const classeMarcador =
    tipoGrupo === "ERRO"
      ? "questoes-criticas-marcador-erro"
      : "questoes-criticas-marcador-outro";

  return `
    <div class="card questoes-criticas-questao-card">

      <h3 class="questoes-criticas-questao-numero">
        Questão ${numero}
      </h3>

      <div class="questoes-criticas-enunciado">
        ${esc(q.enunciado)}
      </div>

      <div class="questoes-criticas-gabarito">
        <strong>Gabarito:</strong>
        ${esc(traduzResposta(q.gabarito))}
      </div>

      <div class="questoes-criticas-comentario">

        <strong>Comentário:</strong>

        <div class="questoes-criticas-comentario-texto">
          ${esc(
            q.comentario ||
            "Comentário não cadastrado."
          )}
        </div>

      </div>

      <div class="questoes-criticas-rodape-questao">

        <div
          class="
            questoes-criticas-marcador
            ${classeMarcador}
          "
        >
          ${marcador}
        </div>

        <div class="questoes-criticas-resposta-aluno">
          Sua resposta:
          ${esc(
            traduzResposta(
              q.resposta_marcada
            )
          )}
        </div>

      </div>

    </div>
  `;
}

function renderizarMiniRelatorio(
  lista,
  disciplinaSelecionada
) {
  const area =
    document.getElementById(
      "area_relatorio"
    );

  if (!lista.length) {
    area.innerHTML = "";
    return;
  }

  const disciplinas = [];

  lista.forEach(q => {
    let disciplina =
      disciplinas.find(
        d => d.id === q.disciplina_id
      );

    if (!disciplina) {
      disciplina = {
        id: q.disciplina_id,
        nome: q.disciplina_nome,
        ordem: q.disciplina_ordem,
        assuntos: []
      };

      disciplinas.push(disciplina);
    }

    let assunto =
      disciplina.assuntos.find(
        a => a.id === q.assunto_id
      );

    if (!assunto) {
      assunto = {
        id: q.assunto_id,
        nome: q.assunto_nome,
        ordem: q.assunto_ordem,
        erros: 0,
        dificeis: 0,
        paraRever: 0
      };

      disciplina.assuntos.push(
        assunto
      );
    }

    if (q.erro) {
      assunto.erros += 1;
    }

    if (q.dificil) {
      assunto.dificeis += 1;
    }

    if (q.para_rever) {
      assunto.paraRever += 1;
    }
  });

  disciplinas.sort(
    (a, b) =>
      (a.ordem ?? 0) -
      (b.ordem ?? 0)
  );

  disciplinas.forEach(d => {
    d.assuntos.sort(
      (a, b) =>
        (a.ordem ?? 0) -
        (b.ordem ?? 0)
    );
  });

  let html = `
    <div class="card questoes-criticas-relatorio-titulo-card">

      <h2 class="questoes-criticas-relatorio-titulo">
        Relatório geral da(s) disciplina(s)
      </h2>

    </div>
  `;

  disciplinas.forEach(
    disciplina => {

      const assuntosComRegistro =
        disciplina.assuntos.filter(
          assunto =>
            assunto.erros > 0 ||
            assunto.dificeis > 0 ||
            assunto.paraRever > 0
        );

      if (
        assuntosComRegistro.length === 0
      ) {
        return;
      }

      html += `
        <div class="card questoes-criticas-relatorio-conteudo-card">

          <h3 class="questoes-criticas-relatorio-disciplina">
            ${esc(
              disciplina.nome || ""
            )}
          </h3>
      `;

      assuntosComRegistro.forEach(
        assunto => {

          html += `
            <div class="questoes-criticas-relatorio-assunto">

              <div class="questoes-criticas-relatorio-assunto-nome">
                ${esc(
                  assunto.nome || ""
                )}
              </div>

              <div class="questoes-criticas-relatorio-totais">
          `;

          if (assunto.erros > 0) {
            html += `
              <div>
                ${assunto.erros}
                ${
                  assunto.erros === 1
                    ? "questão respondida incorretamente"
                    : "questões respondidas incorretamente"
                }
              </div>
            `;
          }

          if (assunto.dificeis > 0) {
            html += `
              <div>
                ${assunto.dificeis}
                ${
                  assunto.dificeis === 1
                    ? "questão difícil"
                    : "questões difíceis"
                }
              </div>
            `;
          }

          if (assunto.paraRever > 0) {
            html += `
              <div>
                ${assunto.paraRever}
                ${
                  assunto.paraRever === 1
                    ? "marcada para rever"
                    : "marcadas para rever"
                }
              </div>
            `;
          }

          html += `
              </div>

            </div>
          `;
        }
      );

      html += `
        </div>
      `;
    }
  );

  area.innerHTML = html;
}

const anoAtual =
  document.getElementById(
    "ano_atual"
  );

if (anoAtual) {
  anoAtual.textContent =
    new Date().getFullYear();
}

carregarQuestoesCriticas();

</script>

</body>
</html>
