<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Meus dados</title>
  <link rel="stylesheet" href="css/style.css"/>
</head>

<body>
  <header
    style="
      padding-top:8px;
      padding-bottom:24px;
      position:relative;
    "
  >
    <div
      style="
        margin-top:32px;
        display:flex;
        justify-content:center;
        align-items:center;
      "
    >
      <h1
        style="
          margin:-6px 0 0 0;
          font-size:1.55rem;
          text-align:center;
        "
      >
        👤 Meus dados
      </h1>
    </div>

    <nav
      style="
        position:absolute;
        right:24px;
        top:22px;
        display:flex;
        gap:10px;
        align-items:center;
      "
    >
      <a
        class="btn"
        href="index.html?atendimento=aberto"
        title="Voltar"
      >
        ⇦
      </a>

      <a
        class="btn"
        href="index.html"
        title="Início"
      >
        ⌂
      </a>

      <a
        class="btn"
        href="#"
        onclick="sairComConfirmacao(); return false;"
        title="Sair"
      >
        ⎋
      </a>
    </nav>
  </header>

  <main class="container">
    <div class="card">
      <h2>Meu cadastro / atualizar</h2>

      <div id="msg" style="margin:10px 0;"></div>

      <form id="formMeusDados" class="list" novalidate>
        <div class="assunto">
          <label><b>Nome</b></label><br/>
          <input id="nome" type="text"
            style="width:100%; padding:12px; border:1px solid #ddd; border-radius:6px;" />
        </div>

        <div class="assunto">
          <label><b>CPF</b></label><br/>
          <input
            id="cpf"
            type="text"
            maxlength="14"
            placeholder="000.000.000-00"
            style="width:100%; padding:12px; border:1px solid #ddd; border-radius:6px;"
          />
        </div>

        <div class="assunto">
          <label><b>Email</b></label><br/>
          <input id="email" type="email"
            style="width:100%; padding:12px; border:1px solid #ddd; border-radius:6px;" />
        </div>

        <div class="assunto">
          <label><b>Telefone</b></label><br/>
          <input id="telefone" type="text" maxlength="15"
            style="width:100%; padding:12px; border:1px solid #ddd; border-radius:6px;" />
        </div>

        <button class="btn" type="submit">
          Atualizar
        </button>

      </form>
    </div>

    <div class="card">
      <h2
        onclick="mostrarHistoricoCompras()"
        style="
          cursor:pointer;
          user-select:none;
        "
      >
        Meu histórico de compras
      </h2>

      <div
        id="historicoCompras"
        class="list"
        style="display:none; margin-top:14px;"
      ></div>
    </div>
  </main>

  <footer>
    <p>
      © <span id="ano_atual"></span> - Quality Estudos
    </p>
  </footer>

  <script src="js/app.js"></script>
  <script src="js/meus-dados.js"></script>
  <script>
    const anoAtual =
      document.getElementById(
        "ano_atual"
      );

    if (anoAtual) {
      anoAtual.textContent =
        new Date().getFullYear();
    }
  </script>
  
</body>
</html>
