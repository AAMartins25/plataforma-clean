<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Meus dados</title>
  <link rel="stylesheet" href="css/style.css"/>
</head>

<body>
  <header style="padding-top:10px;padding-bottom:5px;">
    <div style="margin-top:20px;">
      <h1 style="margin-bottom:-5px;">👤 Meus dados</h1>
    </div>

    <nav style="margin-top:4px; display:flex; gap:10px; justify-content:center; flex-wrap:wrap;">
      <a class="btn" href="index.html">Ir para página inicial</a>
      <a class="btn" href="#" onclick="logout()">Sair</a>
    </nav>
  </header>

  <main class="container">
    <div class="card">
      <h2>Atualizar cadastro</h2>

      <div id="msg" style="margin:10px 0;"></div>

      <form id="formMeusDados" class="list" novalidate>
        <div class="assunto">
          <label><b>Nome</b></label><br/>
          <input id="nome" type="text"
            style="width:100%; padding:12px; border:1px solid #ddd; border-radius:6px;" />
        </div>

        <div class="assunto">
          <label><b>Email</b></label><br/>
          <input id="email" type="email"
            style="width:100%; padding:12px; border:1px solid #ddd; border-radius:6px;" />
        </div>

        <div class="assunto">
          <label><b>CPF</b></label><br/>
          <input id="cpf" type="text" maxlength="14"
            style="width:100%; padding:12px; border:1px solid #ddd; border-radius:6px;" />
        </div>

        <div class="assunto">
          <label><b>Telefone</b></label><br/>
          <input id="telefone" type="text" maxlength="15"
            style="width:100%; padding:12px; border:1px solid #ddd; border-radius:6px;" />
        </div>

        <div class="assunto">
          <label><b>Nova senha</b></label><br/>
          <div style="position:relative; width:100%;">
            <input
                id="senha"
                type="password"
                placeholder="Preencha somente se quiser trocar"
                style="
                width:100%;
                padding:12px;
                padding-right:48px;
                border:1px solid #ddd;
                border-radius:6px;
                "
            />

            <button
                type="button"
                id="toggleSenha"
                style="
                position:absolute;
                right:10px;
                top:50%;
                transform:translateY(-50%);
                border:none;
                background:none;
                cursor:pointer;
                font-size:1rem;
                "
            >
                👁
            </button>
            </div>
        </div>

        <button class="btn" type="submit">Confirmar atualização</button>
      </form>
    </div>
  </main>

  <footer>
    <p>© 2026 - Plataforma Quality Estudos</p>
  </footer>

  <script src="js/app.js"></script>
  <script src="js/meus-dados.js"></script>
  <script>
  const btnToggleSenha = document.getElementById("toggleSenha");
  const campoSenha = document.getElementById("senha");

  btnToggleSenha.addEventListener("click", () => {
    if (campoSenha.type === "password") {
      campoSenha.type = "text";
      btnToggleSenha.textContent = "🙈";
    } else {
      campoSenha.type = "password";
      btnToggleSenha.textContent = "👁";
    }
  });
</script>
</body>
</html>
