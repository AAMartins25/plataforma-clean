<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Questões - Assuntos</title>

  <link
    rel="stylesheet"
    href="css/style.css"
  >
</head>

<body
  class="questoes-assuntos-page"
  data-page="questoes-assuntos"
>

  <header
    style="
      padding-top:4px;
      padding-bottom:16.5px;
      position:relative;
    "
  >

    <div class="questoes-assuntos-header-identificacao">

      <h1 id="titulo_curso_nome"></h1>

      <h2 class="questoes-assuntos-modulo">
        📝 Questões
      </h2>

    </div>

    <nav class="questoes-assuntos-header-acoes">

      <a
        id="btnVoltarQuestoesDisciplinas"
        class="btn"
        href="#"
        title="Voltar"
      >
        ⇦
      </a>

      <a
        class="btn"
        href="index.html"
        title="Início"
      >
        ⌂
      </a>

      <a
        class="btn"
        href="#"
        onclick="confirmarSaidaQuestoes(); return false;"
        title="Sair"
      >
        ⎋
      </a>

    </nav>

  </header>


  <main
    class="container"
    id="conteudo"
  >

    <div class="card questoes-assuntos-disciplina-card">
      <h2>
        Disciplina:
        <span id="nome_disciplina_card"></span>
      </h2>
    </div>

    <div class="card questoes-assuntos-lista-card">

      <h2 class="questoes-assuntos-titulo">
        Assuntos

        <span class="questoes-assuntos-subtitulo">
          em ordem de prioridade para o concurso
        </span>
      </h2>

      <div
        id="lista"
        class="list"
      ></div>

    </div>

  </main>


  <footer>

    <p>
      © <span id="ano_atual"></span> - Quality Estudos
    </p>

  </footer>


  <script src="js/app.js"></script>


  <script>

    function confirmarSaidaQuestoes() {
      const ok =
        confirm(
          "Deseja realmente sair da plataforma?"
        );

      if (!ok) {
        return;
      }

      logout();
    }


    const btnVoltar =
      document.getElementById(
        "btnVoltarQuestoesDisciplinas"
      );

    if (btnVoltar) {

      btnVoltar.addEventListener(
        "click",
        function (e) {

          e.preventDefault();

          const p =
            new URLSearchParams(
              window.location.search
            );

          const cursoId =
            p.get("curso_id");

          const cursoNome =
            p.get("curso_nome") || "";

          if (cursoId) {

            window.location.href =
              "questoes-disciplinas.html" +
              "?curso_id=" +
              encodeURIComponent(
                cursoId
              ) +
              "&curso_nome=" +
              encodeURIComponent(
                cursoNome
              );

          } else {

            window.location.href =
              "curso.html";

          }

        }
      );

    }


    const anoAtual =
      document.getElementById(
        "ano_atual"
      );

    if (anoAtual) {

      anoAtual.textContent =
        new Date().getFullYear();

    }

  </script>

</body>

</html>
