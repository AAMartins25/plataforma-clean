<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <script src="js/sessao.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pagamento não concluído</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="js/cabecalho.js" defer></script>
</head>
<body class="retorno-pagamento-page">
  <header>
    <h1>❌ Pagamento não concluído</h1>
    <nav>
      <a href="cursos.html" class="btn">Voltar para cursos</a>
      <a href="index.html" class="btn">Início</a>
    </nav>
    <p>Você pode tentar novamente quando quiser.</p>
  </header>

  <main class="container">
    <div class="card">
      <h2>O que pode ter ocorrido?</h2>
      <p>
        O pagamento pode ter sido cancelado, recusado ou houve falha no processo.
        Volte para cursos e tente novamente.
      </p>

      <button
          class="btn"
          onclick="voltarParaCurso()">
          ← Voltar para o curso
      </button>
    </div>
  </main>

  <footer>
    <p>© 2026 RO</p>
  </footer>

  <script>
  function voltarParaCurso() {

      const url = localStorage.getItem("voltar_para_compra");

      if (url) {
          window.location.href = url;
          return;
      }

      window.location.href = "index.html";
  }
  </script>
</body>
</html>
