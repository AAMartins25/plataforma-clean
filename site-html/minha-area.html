<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <script src="js/sessao.js"></script>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Minha Área</title>

  <link
    rel="stylesheet"
    href="css/style.css"
  >
  <link rel="stylesheet" href="css/admin-shell.css?v=titulos23px-1">
  <link rel="stylesheet" href="css/minha-area.css?v=5">
  <script src="js/cabecalho.js?v=altura6-1" defer></script>
  <script src="js/rodape.js" defer></script>
</head>

<body class="minha-area-page">

  <header
    style="
      padding-top:0.5rem;
      padding-bottom:1.5rem;
      position:relative;
    "
  >
    <div
      style="
        margin-top:2rem;
        display:flex;
        justify-content:center;
        align-items:center;
      "
    >
      <h1 class="admin-titulo-destaque"
        style="
          margin:-0.375rem 0 0 0;
          text-align:center;
        "
      >
        👤 Minha Área
      </h1>
    </div>

    <nav class="ro-header-icon-actions"
      style="
        position:absolute;
        right:1.5rem;
        top:1.375rem;
        display:flex;
        gap:0.625rem;
        align-items:center;
      "
    >
      <a
        class="btn"
        href="index.html"
        title="Início"
      >
        ⌂
      </a>

      <a
        class="btn"
        href="#"
        onclick="confirmarSaida(); return false;"
        title="Sair"
      >
        ⎋
      </a>
    </nav>
  </header>


  <main class="container">

    <div class="card">

      <h2 class="admin-titulo-secao"
        style="
          text-align:center;
          margin-bottom:1.125rem;
        "
      >
        Escolha a área
      </h2>

      <div
        id="opcoesMinhaArea"
        style="
          display:flex;
          flex-direction:column;
          gap:0.875rem;
        "
      >

        <a
          id="opcaoAdmin"
          class="btn"
          href="admin/index.html"
          style="
            display:none;
            text-align:center;
            padding:0.875rem;
          "
        >
          <span class="area-opcao-conteudo"><svg class="area-opcao-icone" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="#164C82" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg><span>Painel ADM</span></span>
        </a>


        <a
          id="opcaoVendedor"
          class="btn"
          href="minhas-vendas.html"
          style="
            display:none;
            text-align:center;
            padding:0.875rem;
          "
        >
          <span class="area-opcao-conteudo"><svg class="area-opcao-icone" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="#164C82" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><g transform="rotate(-25 12 12)"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M12 8v8m2-6c-.5-1.5-4-1.5-4 .5 0 2 4 1 4 3s-3.5 2-4 .5"/></g></svg><span>Minhas Vendas</span></span>
        </a>


        <a
          id="opcaoCursos"
          class="btn"
          href="cursos.html"
          style="
            display:none;
            text-align:center;
            padding:0.875rem;
          "
        >
          <span class="area-opcao-conteudo"><svg class="area-opcao-icone" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="#164C82" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6C9 4 6 4 3 5v13c3-1 6-1 9 1 3-2 6-2 9-1V5c-3-1-6-1-9 1Zm0 0v13"/></svg><span>Meus Cursos</span></span>
        </a>

      </div>


      <div
        id="msgMinhaArea"
        style="
          margin-top:1rem;
          text-align:center;
        "
      >
        Carregando...
      </div>

    </div>

  </main>


  <footer>
    <p>
      © <span id="ano_atual">2026</span> Quality
    </p>
  </footer>


  <script src="js/app.js?v=perfis-1"></script>

  <script>
    async function carregarMinhaArea() {
      const msg =
        document.getElementById(
          "msgMinhaArea"
        );

      const opcaoAdmin =
        document.getElementById(
          "opcaoAdmin"
        );

      const opcaoVendedor =
        document.getElementById(
          "opcaoVendedor"
        );

      const opcaoCursos =
        document.getElementById(
          "opcaoCursos"
        );

      const token =
        getToken();

      if (!token) {
        window.location.href =
          "login.html";

        return;
      }

      try {
        const me =
          await apiGetAuth(
            "/me"
          );

        let quantidadeAreas = 0;


        if (me?.is_admin || ["admin_prod", "admin_adm"].includes(me?.tipo_admin)) {
          opcaoAdmin.style.display =
            "block";

          quantidadeAreas++;
        }


        if (me?.is_vendedor) {
          opcaoVendedor.style.display =
            "block";

          quantidadeAreas++;
        }


        if (me?.is_aluno) {
          opcaoCursos.style.display =
            "block";

          quantidadeAreas++;
        }


        if (msg) {
          msg.style.display =
            quantidadeAreas > 0
              ? "none"
              : "block";

          if (quantidadeAreas === 0) {
            msg.textContent =
              "Nenhuma área disponível no momento.";
          }
        }

      } catch (err) {
        console.error(
          "Erro ao carregar áreas do usuário:",
          err
        );

        if (err.status !== 401) return;
        if (getToken()) return;

        window.location.href =
          "login.html";
      }
    }


    function confirmarSaida() {
      const ok =
        confirm(
          "Deseja realmente sair da plataforma?"
        );

      if (!ok) {
        return;
      }

      logout();
    }


    const anoAtual =
      document.getElementById(
        "ano_atual"
      );

    if (anoAtual) {
      anoAtual.textContent =
        new Date().getFullYear();
    }


    carregarMinhaArea();
  </script>

</body>

</html>
