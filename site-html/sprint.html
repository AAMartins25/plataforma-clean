  <!DOCTYPE html>
  <html lang="pt-BR">
  <head>
  <script src="js/sessao.js"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Questões</title>
    <link rel="stylesheet" href="css/style.css"/>
    <script src="js/cabecalho.js" defer></script>
</head>

  <body>
    <header class="sprint-header">

      <div class="sprint-header-identificacao">
        <h1 id="titulo_bateria"></h1>
        <div id="subtitulo_bateria"></div>
      </div>

      <div class="sprint-header-direita">

        <div
          id="nome_aluno_logado"
          class="sprint-aluno"
        ></div>

        <div class="sprint-header-acoes">

          <a
            class="btn"
            href="javascript:void(0)"
            onclick="voltarParaListaQuestoes()"
            title="Voltar"
          >
            ⇦
          </a>

          <a
            class="btn"
            href="javascript:void(0)"
            onclick="
              localStorage.setItem('pagina_antes_inicio', window.location.href);
              window.location.replace('index.html');
            "
            title="Página inicial"
          >
            ⌂
          </a>

          <a
            class="btn"
            href="javascript:void(0)"
            onclick="confirmarSairSprint()"
            title="Sair"
          >
            ⎋
          </a>

        </div>

      </div>

    </header>

    <main class="container">
      <div id="area_questoes"></div>
    </main>

    <div class="container">
      <div class="card" style="padding:0;height:0px;"></div>
    </div>

    <footer style="margin-top:4px;">
      <p>© <span id="ano_atual">2026</span> - QualityEstudos</p>
    </footer>

    <script src="js/app.js"></script>

    <script>
      let questoes = [];
      let indiceAtual = 0;
      let respostasAluno = {};
      let dificuldadesAluno = {};
      let bateriaId = null;
      let tentativaAtiva = null;
      let tentativaAnotacaoId = null;
      const cacheRegistrosQuestao = { anotacao: new Map(), mensagem: new Map() };
      const erroRegistrosQuestao = { anotacao: false, mensagem: false };
      let modo = null;
      let reverQuestoesAluno = {};

      function qsLocal(nome) {
        return new URLSearchParams(window.location.search).get(nome);
      }

      function contextoAcessoLocal() {
        const contratacaoId = qsLocal("contratacao_id");
        const demonstracaoId = qsLocal("demonstracao_id");

        return {
          contratacao_id: contratacaoId ? Number(contratacaoId) : null,
          demonstracao_id: demonstracaoId ? Number(demonstracaoId) : null
        };
      }

      function contextoAcessoQueryLocal() {
        const contexto = contextoAcessoLocal();

        if (contexto.contratacao_id) {
          return `contratacao_id=${encodeURIComponent(contexto.contratacao_id)}`;
        }

        if (contexto.demonstracao_id) {
          return `demonstracao_id=${encodeURIComponent(contexto.demonstracao_id)}`;
        }

        return "";
      }

      function escLocal(s) {
        return String(s ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;");
      }

      function confirmarSairSprint() {
        const ok = confirm("Deseja realmente sair da plataforma?");

        if (!ok) return;

        Sessao.encerrar();

        window.location.href = "login.html";
      }

      async function carregarBateria() {
        bateriaId = qsLocal("bateria_id");
        modo = qsLocal("modo");
        const titulo = qsLocal("titulo") || "Bateria de questões";
        const assuntoNome = qsLocal("assunto_nome") || "";

        const tituloBateria = document.getElementById("titulo_bateria");
        const subtituloBateria = document.getElementById("subtitulo_bateria");

        if (tituloBateria) {
          tituloBateria.innerText =
            assuntoNome || "Questões";
        }

        if (subtituloBateria) {
          subtituloBateria.innerText = titulo;
        }

        if (!bateriaId) {
          document.getElementById("area_questoes").innerHTML = `
            <div class="card">
              <p>Erro: bateria não identificada.</p>
            </div>
          `;
          return;
        }

        try {
          const revisaoId = qsLocal("revisao_id");
          questoes = await apiGetAuth(revisaoId
            ? `/me/revisoes/${Number(revisaoId)}/baterias/${bateriaId}/questoes?${contextoAcessoQueryLocal()}`
            : `/baterias/${bateriaId}/questoes${contextoAcessoQueryLocal() ? `?${contextoAcessoQueryLocal()}` : ""}`);
          questoes.sort((a, b) => (a.ordem ?? 0) - (b.ordem ?? 0));

          if (!qsLocal("revisao_id")) await carregarTentativaAtiva();
          else {
            const revisao=await apiGetAuth(`/me/revisoes/${Number(qsLocal('revisao_id'))}?${contextoAcessoQueryLocal()}`);
            const bateria=revisao.baterias.find(b=>Number(b.id)===Number(bateriaId));
            (bateria?.respostas || []).forEach(r=>{
              respostasAluno[r.questao_id]=r.resposta_marcada;
              dificuldadesAluno[r.questao_id]=r.dificuldade;
              reverQuestoesAluno[r.questao_id]=r.rever;
            });
            tentativaAnotacaoId = bateria?.tentativa_id || null;
            if (bateria?.concluida) { revisarAgora(); return; }
          }

          if (!qsLocal("revisao_id")) tentativaAnotacaoId = tentativaAtiva?.id || null;

          if (!questoes.length) {
            document.getElementById("area_questoes").innerHTML = `
              <div class="card">
                <p>Nenhuma questão encontrada.</p>
              </div>
            `;
            return;
          }

          if (modo === "visualizar") {
            revisarAgora();
            return;
          }

          if (tentativaAtiva && tentativaAtiva.status === "EM_ANDAMENTO") {
            revisarAgora();
          } else {
            renderizarTodasQuestoes();
          }

        } catch (err) {
          document.getElementById("area_questoes").innerHTML = `
            <div class="card">
              <h2>Erro ao carregar questões</h2>
              <pre style="white-space:pre-wrap;">${escLocal(err.message)}</pre>
            </div>
          `;
        }
      }

      function voltarParaListaQuestoes() {
        if (qsLocal("revisao_id")) {
          const q=new URLSearchParams(window.location.search);
          q.delete('bateria_id'); q.delete('modo'); q.set('abrir','questoes');
          window.location.href='teoria.html?'+q; return;
        }
        const destino = localStorage.getItem("voltar_para_questoes");

        if (destino) {
          window.location.href = destino;
          return;
        }

        history.back();
      }

      async function carregarTentativaAtiva() {
        try {
          const contextoQuery = contextoAcessoQueryLocal();
          const dados = await apiGetAuth(
            `/baterias/${bateriaId}/minha-tentativa-ativa${contextoQuery ? `?${contextoQuery}` : ""}`
          );

          if (!dados || !dados.tentativa) {
            return;
          }

          tentativaAtiva = dados.tentativa;

          localStorage.setItem(
            `tentativa_bateria_${bateriaId}`,
            JSON.stringify(dados.tentativa)
          );

          (dados.respostas || []).forEach(r => {
            respostasAluno[r.questao_id] = r.resposta_marcada;

            if (r.dificuldade) {
              dificuldadesAluno[r.questao_id] = r.dificuldade;
            }

            reverQuestoesAluno[r.questao_id] = r.rever === true;
          });

        } catch (err) {
          console.error("Erro ao carregar tentativa ativa:", err);
        }
      }

      function renderizarTodasQuestoes() {
        const total = questoes.length;

        let html = "";

        questoes.forEach((q, idx) => {
          const alternativas = q.alternativas || [];
          const ehCertoErrado = q.tipo_questao === "CERTO_ERRADO" || q.tipo === "CERTO_ERRADO";

          html += `
            <div class="card sprint-questao-card" id="questao_${q.id}">
              <div style="margin-bottom:6px;">
                <h3 class="sprint-questao-titulo">
                  Questão ${idx + 1} de ${total}
                </h3>
              </div>

              <div class="sprint-questao-enunciado">
                ${escLocal(q.enunciado)}
              </div>

              ${
                ehCertoErrado
                  ? `
                    <div class="list" style="margin-top:10px;">
                      <label class="assunto alternativa-opcao" id="alt_${q.id}_C" style="display:block; cursor:pointer; border:1px solid #ddd; border-radius:10px; padding:12px 16px; margin-top:6px;">
                        <input type="radio" name="resposta_${q.id}" value="C"
                          ${respostasAluno[q.id] === "C" ? "checked" : ""}
                          onchange="marcarAlternativaVisual(${q.id}, 'C'); resetarBotaoResponder(${q.id});"
                          style="margin-right:16px;"
                        />
                        <b>CERTO</b>
                      </label>

                      <label class="assunto alternativa-opcao" id="alt_${q.id}_E" style="display:block; cursor:pointer; border:1px solid #ddd; border-radius:10px; padding:12px 16px; margin-top:6px;">
                        <input type="radio" name="resposta_${q.id}" value="E"
                          ${respostasAluno[q.id] === "E" ? "checked" : ""}
                          onchange="marcarAlternativaVisual(${q.id}, 'E'); resetarBotaoResponder(${q.id});"
                          style="margin-right:16px;"
                        />
                        <b>ERRADO</b>
                      </label>

                      <label class="assunto alternativa-opcao" id="alt_${q.id}_NAO_SEI" style="display:block; cursor:pointer; border:1px solid #ddd; border-radius:10px; padding:12px 16px; margin-top:22px;">
                        <input type="radio" name="resposta_${q.id}" value="NAO_SEI"
                          ${respostasAluno[q.id] === "NAO_SEI" ? "checked" : ""}
                          onchange="marcarAlternativaVisual(${q.id}, 'NAO_SEI'); resetarBotaoResponder(${q.id});"
                          style="margin-right:16px;"
                        />
                        <b>Não tenho certeza ou não sei</b>
                      </label>

                      <div style="margin-top:14px; text-align:right;">
                        <label style="cursor:pointer;">
                          <input
                            type="checkbox"
                            name="rever_${q.id}"
                            ${reverQuestoesAluno[q.id] === true ? "checked" : ""}
                            onchange="resetarBotaoResponder(${q.id});"
                            style="margin-right:8px;"
                          />
                          <b>Rever esta questão</b>
                        </label>
                      </div>
                    </div>
                  `
                  : `
                    <div class="list" style="margin-top:18px;">
                      ${alternativas.map(a => `
                        <label
                          class="assunto alternativa-opcao"
                          id="alt_${q.id}_${a.letra}"
                          style="display:block; cursor:pointer; border:1px solid #ddd; border-radius:10px; padding:14px 14px; margin-top:8px; line-height:1.45; transition:.15s;"
                        >
                          <input
                            type="radio"
                            name="resposta_${q.id}"
                            value="${escLocal(a.letra)}"
                            onchange="marcarAlternativaVisual(${q.id}, '${a.letra}'); resetarBotaoResponder(${q.id});"
                            ${respostasAluno[q.id] === a.letra ? "checked" : ""}
                            style="margin-right:12px;"
                          />
                          <b>${escLocal(a.letra)})</b> ${escLocal(a.texto)}
                        </label>
                      `).join("")}
                    </div>
                  `
              }

              ${
                ehCertoErrado
                  ? ``
                  : `
                    <div class="card sprint-dificuldade-card">

                      <div class="sprint-dificuldade-texto">
                        Essa questão para você, neste momento, foi:
                      </div>

                      <div class="sprint-dificuldade-opcoes">

                        <label
                          id="dif_${q.id}_FACIL"
                          class="sprint-dificuldade-opcao"
                        >
                          <input
                            type="radio"
                            name="dificuldade_${q.id}"
                            value="FACIL"
                            ${dificuldadesAluno[q.id] === "FACIL" ? "checked" : ""}
                            onchange="marcarDificuldadeVisual(${q.id}, 'FACIL'); resetarBotaoResponder(${q.id});"
                          >
                          FÁCIL
                        </label>

                        <label
                          id="dif_${q.id}_MEDIA"
                          class="sprint-dificuldade-opcao"
                        >
                          <input
                            type="radio"
                            name="dificuldade_${q.id}"
                            value="MEDIA"
                            ${dificuldadesAluno[q.id] === "MEDIA" ? "checked" : ""}
                            onchange="marcarDificuldadeVisual(${q.id}, 'MEDIA'); resetarBotaoResponder(${q.id});"
                          >
                          MÉDIA
                        </label>

                        <label
                          id="dif_${q.id}_DIFICIL"
                          class="sprint-dificuldade-opcao"
                        >
                          <input
                            type="radio"
                            name="dificuldade_${q.id}"
                            value="DIFICIL"
                            ${dificuldadesAluno[q.id] === "DIFICIL" ? "checked" : ""}
                            onchange="marcarDificuldadeVisual(${q.id}, 'DIFICIL'); resetarBotaoResponder(${q.id});"
                          >
                          DIFÍCIL
                        </label>

                      </div>

                    </div>
                  `
              }

              <div style="margin-top:18px;">
                <button
                  id="btnResponder_${q.id}"
                  class="btn sprint-btn-responder"
                  onclick="responderQuestaoLista(${q.id}, ${idx})"
                >
                  Responder
                </button>
              </div>
            </div>
          `;
        });

        html += `
          <div class="card" id="boxConcluirBateria">

            <div class="sprint-conclusao-acoes">

              <button
                class="btn sprint-conclusao-btn"
                onclick="concluirBateriaAluno('agora')"
              >
                Revisar agora
              </button>

              <button
                class="btn sprint-conclusao-btn"
                onclick="concluirBateriaAluno('depois')"
              >
                Revisar depois
              </button>

            </div>

          </div>
        `;

        document.getElementById("area_questoes").innerHTML = html;

        document.getElementById(`questao_${questoes[0].id}`).scrollIntoView({
          behavior: "smooth",
          block: "start"
        });
      }

      function marcarAlternativaVisual(questaoId, letra) {
        const opcoes = document.querySelectorAll(`[id^="alt_${questaoId}_"]`);

        opcoes.forEach(op => {
          op.style.background = "";
          op.style.borderColor = "#ddd";
          op.style.fontWeight = "normal";
        });

        const escolhida = document.getElementById(`alt_${questaoId}_${letra}`);

        if (escolhida) {
          escolhida.style.background = "#e7f7ee";
          escolhida.style.borderColor = "#2f5e46";
          escolhida.style.fontWeight = "bold";
        }
      }

      function marcarDificuldadeVisual(questaoId, dificuldade) {
        ["FACIL", "MEDIA", "DIFICIL"].forEach(nivel => {
          const el = document.getElementById(`dif_${questaoId}_${nivel}`);

          if (el) {
            el.style.background = "";
            el.style.borderColor = "#ddd";
            el.style.fontWeight = "normal";
          }
        });

        const selecionada =
          document.getElementById(`dif_${questaoId}_${dificuldade}`);

        if (selecionada) {
          selecionada.style.background = "#e7f7ee";
          selecionada.style.borderColor = "#2f5e46";
          selecionada.style.fontWeight = "bold";
        }
      }

      function responderQuestaoLista(questaoId, idx) {
        const respostaMarcada = document.querySelector(`input[name='resposta_${questaoId}']:checked`);
        const q = questoes[idx];
        const ehCertoErrado = q.tipo_questao === "CERTO_ERRADO" || q.tipo === "CERTO_ERRADO";

        const dificuldadeMarcada = document.querySelector(`input[name='dificuldade_${questaoId}']:checked`);
        const reverMarcada = document.querySelector(`input[name='rever_${questaoId}']`);

        if (!respostaMarcada) {
          alert("Marque uma resposta.");
          return;
        }

        if (!ehCertoErrado && !dificuldadeMarcada) {
          alert("Marque a dificuldade da questão.");
          return;
        }

        respostasAluno[questaoId] = respostaMarcada.value;

        dificuldadesAluno[questaoId] = ehCertoErrado
          ? null
          : dificuldadeMarcada.value;

        reverQuestoesAluno[questaoId] =
          reverMarcada && reverMarcada.checked ? true : false;

        const btn = document.getElementById(`btnResponder_${questaoId}`);

        if (btn) {
          btn.textContent = "Respondida";
          btn.style.background = "#dff3e6";
          btn.style.color = "#2f5e46";
          btn.style.borderColor = "#2f5e46";
        }

        if (idx < questoes.length - 1) {
          const proxima = questoes[idx + 1];

          document.getElementById(`questao_${proxima.id}`).scrollIntoView({
            behavior: "smooth",
            block: "start"
          });
        } else {
          document.getElementById("boxConcluirBateria").scrollIntoView({
            behavior: "smooth",
            block: "start"
          });
        }
      }

      function renderizarQuestao() {
        const q = questoes[indiceAtual];
        const total = questoes.length;

        const alternativas = q.alternativas || [];

        document.getElementById("area_questoes").innerHTML = `
          <div class="card" id="cardQuestaoAtual">
            <h2>Questão ${indiceAtual + 1} de ${total}</h2>

            <div style="white-space:pre-wrap; margin-top:12px;">
              ${escLocal(q.enunciado)}
            </div>

            <div class="list" style="margin-top:18px;">
              ${
                alternativas.map(a => `
                  <label class="assunto" style="display:block; cursor:pointer;">
                    <input
                      type="radio"
                      name="resposta"
                      value="${escLocal(a.letra)}"
                      ${respostasAluno[q.id] === a.letra ? "checked" : ""}
                    />
                    <b>${escLocal(a.letra)})</b> ${escLocal(a.texto)}
                  </label>
                `).join("")
              }
            </div>

            ${
              ehCertoErrado
                ? `
                  <div class="card" style="margin-top:22px; padding:18px;">
                    <label style="cursor:pointer;">
                      <input
                        type="checkbox"
                        name="rever_${q.id}"
                        onchange="resetarBotaoResponder(${q.id});"
                        style="margin-right:10px;"
                      />
                      <b>Rever esta questão</b>
                    </label>
                  </div>
                `
                : `
                  <div class="card" style="margin-top:22px; padding:18px;">
                    <p><b>Essa questão para você, neste momento, foi:</b></p>

                    <!-- mantenha aqui os seus três labels atuais: FÁCIL, MÉDIA e DIFÍCIL -->
                  </div>
                `
            }

            <div style="margin-top:18px;">
              <button class="btn" onclick="responderQuestao()">
                Responder
              </button>
            </div>
          </div>
        `;

        document.getElementById("cardQuestaoAtual").scrollIntoView({
          behavior: "smooth",
          block: "start"
        });
      }

      function responderQuestao() {
        const q = questoes[indiceAtual];

        const respostaMarcada = document.querySelector("input[name='resposta']:checked");
        const dificuldadeMarcada = document.querySelector("input[name='dificuldade']:checked");

        if (!respostaMarcada) {
          alert("Marque uma resposta.");
          return;
        }

        if (!dificuldadeMarcada) {
          alert("Marque a dificuldade da questão.");
          return;
        }

        respostasAluno[q.id] = respostaMarcada.value;
        dificuldadesAluno[q.id] = dificuldadeMarcada.value;

        if (indiceAtual < questoes.length - 1) {
          indiceAtual++;
          renderizarQuestao();
        } else {
          renderizarConclusao();
        }
      }

      function renderizarConclusao() {
        document.getElementById("area_questoes").innerHTML = `
          <div class="card">
            <h2>Bateria respondida</h2>
            <p>Você respondeu todas as questões.</p>

            <button class="btn" onclick="concluirBateriaAluno()">
              Concluir bateria
            </button>
          </div>
        `;

        document.getElementById("area_questoes").scrollIntoView({
          behavior: "smooth",
          block: "start"
        });
      }

      async function concluirBateriaAluno(destino) {
        const questoesNaoRespondidas = questoes
          .filter(q => !respostasAluno[q.id])
          .map(q => q.ordem);

        if (questoesNaoRespondidas.length === 1) {
          alert(
            `A questão ${questoesNaoRespondidas[0]} ainda não foi respondida. ` +
            `Responda todas para concluir a bateria.`
          );
          return;
        }

        if (questoesNaoRespondidas.length > 1) {
          alert(
            `As questões ${questoesNaoRespondidas.join(", ")} ainda não foram respondidas. ` +
            `Responda todas para concluir a bateria.`
          );
          return;
        }

        const contexto = contextoAcessoLocal();

        const payload = {
          bateria_id: Number(bateriaId),
          contratacao_id: contexto.contratacao_id,
          demonstracao_id: contexto.demonstracao_id,
          respostas: questoes.map(q => ({
            questao_id: q.id,
            resposta_marcada: respostasAluno[q.id],
            dificuldade: dificuldadesAluno[q.id] || null,
            rever: reverQuestoesAluno[q.id] === true
          }))
        };

        try {
          if (qsLocal("revisao_id")) {
            const result=await apiPostAuth(`/me/revisoes/${Number(qsLocal("revisao_id"))}/baterias/${bateriaId}/respostas?${contextoAcessoQueryLocal()}`, {respostas: payload.respostas});
            tentativaAnotacaoId = result.id;
            result.feedback.forEach(f=>{ const q=questoes.find(q=>q.id===f.questao_id); if(q) q.gabarito=f.gabarito; });
            if (destino === 'agora') revisarAgora(); else voltarParaListaQuestoes();
            return;
          }
          const tentativa = await apiPostAuth("/baterias/concluir", payload);
          tentativaAnotacaoId = tentativa.id;

          localStorage.setItem(
            `tentativa_bateria_${bateriaId}`,
            JSON.stringify(tentativa)
          );

          localStorage.setItem("voltar_para_questoes_forcar_atualizacao", "1");

          if (destino === "agora") {
            revisarAgora();
            return;
          }

          voltarParaListaQuestoes();

        } catch (err) {
          console.error(err);
          alert("Erro ao concluir bateria: " + err.message);
        }
      }
      
      function revisarAgora() {
        let html = ``;

        questoes.forEach((q, idx) => {
          const respostaAluno = respostasAluno[q.id];
          const acertou = respostaAluno === q.gabarito;
          const ehCertoErrado = q.tipo_questao === "CERTO_ERRADO" || q.tipo === "CERTO_ERRADO";
          const gabaritoTexto = q.gabarito === "C" ? "CERTO" : q.gabarito === "E" ? "ERRADO" : "-";
          const respostaTexto = respostaAluno === "C"
            ? "CERTO"
            : respostaAluno === "E"
              ? "ERRADO"
              : "Não tenho certeza ou não sei";

          html += `
            <div class="card sprint-revisao-questao-card">
              <h2 class="sprint-revisao-questao-titulo">
                Questão ${idx + 1}
              </h2>

              <div class="sprint-revisao-enunciado">
                ${escLocal(q.enunciado)}
              </div>

              <div class="list sprint-revisao-alternativas">
                ${(q.alternativas || []).map(a => {
                  const ehCorreta = a.letra === q.gabarito;
                  const ehMarcadaErrada = a.letra === respostaAluno && !acertou;

                  let classeEstado = "";

                  if (ehCorreta) {
                    classeEstado = "sprint-revisao-alternativa-correta";
                  }

                  if (ehMarcadaErrada) {
                    classeEstado = "sprint-revisao-alternativa-errada";
                  }

                  return `
                    <div class="assunto sprint-revisao-alternativa ${classeEstado}">
                      <b>${escLocal(a.letra)})</b> ${escLocal(a.texto)}
                    </div>
                  `;
                }).join("")}
              </div>

              <div class="sprint-revisao-resultado">
                ${
                  ehCertoErrado
                    ? `
                      <div class="${
                        acertou
                          ? "sprint-revisao-acerto"
                          : "sprint-revisao-erro"
                      }">
                        ${
                          acertou
                            ? `Você: ${respostaTexto}`
                            : `❌ Você: ${respostaTexto}`
                        }
                      </div>

                      <div class="sprint-revisao-gabarito">
                        Gabarito: ${gabaritoTexto}
                      </div>
                    `
                    : (
                        acertou
                          ? `
                            <div class="sprint-revisao-acerto">
                              ✅ Certo!
                            </div>
                          `
                          : `
                            <div class="sprint-revisao-erro">
                              Não foi desta vez
                            </div>

                            <div class="sprint-revisao-gabarito">
                              Gabarito: ${escLocal(q.gabarito || "-")}
                            </div>
                          `
                      )
                }
              </div>

              <div class="sprint-revisao-comentario">
                Comentário:

                <div class="sprint-revisao-comentario-texto">
                  ${escLocal(q.comentario || "Comentário não cadastrado.")}
                </div>
              </div>

              ${
                reverQuestoesAluno[q.id] === true
                  ? `
                    <div style="
                      margin-top:10px;
                      text-align:right;
                    ">
                      <span style="
                        display:inline-block;
                        padding:3px 8px;
                        border:1px solid #b37a1f;
                        border-radius:999px;
                        color:#b37a1f;
                        font-size:.78rem;
                      ">
                        Marcada para rever
                      </span>
                    </div>
                  `
                  : ""
              }

              ${
                modo === "visualizar"
                  ? ""
                  : `
                    ${htmlSecaoRegistro("anotacao", q.id, null, null, true)}
                    ${htmlSecaoRegistro("mensagem", q.id, null, null, true)}
                  `
              }
            </div>
          `;
        });

        html += `
          <div class="card sprint-revisao-finalizar-card">
            ${
              modo === "visualizar"
                ? `
                  <div class="sprint-visualizar-fechar">
                      <button
                          class="btn sprint-revisao-btn-finalizar"
                          onclick="voltarParaListaQuestoes()"
                      >
                          Fechar
                      </button>
                  </div>
                `
                : `
                  <button
                      id="btnFinalizarRevisao"
                      class="btn sprint-revisao-btn-finalizar"
                      onclick="finalizarRevisao()"
                      style="display:block; margin-left:auto; margin-right:25px;"
                  >
                      Finalizar revisão e voltar
                  </button>
                `
            }
          </div>

          <div id="area_resultado_final"></div>
        `;

        document.getElementById("area_questoes").innerHTML = html;

        document.getElementById("area_questoes").scrollIntoView({
          behavior: "smooth",
          block: "start"
        });
        recuperarAnotacoesTentativa();
      }

      function linkAreaRegistro(arquivo) {
        const origem = new URLSearchParams(window.location.search), destino = new URLSearchParams();
        for (const chave of ["curso_id", "contratacao_id", "demonstracao_id", "curso_nome"])
          if (origem.get(chave)) destino.set(chave, origem.get(chave));
        const query = destino.toString();
        return `${arquivo}${query ? `?${query}` : ""}`;
      }

      function htmlSecaoRegistro(tipo, qid, registro, erro, loading = false) {
        const nota = tipo === "anotacao";
        const titulo = nota ? "Fazer anotação" : "Enviar mensagem ao professor";
        const hostId = `registro_${nota ? "anotacao" : "mensagem"}_${qid}`;
        let corpo;
        if (loading) corpo = `<p role="status">Verificando se já existe registro...</p>`;
        else if (registro) corpo = nota
          ? `Você já fez anotação nesta questão. Caso deseje editá-la, entre em <a href="${linkAreaRegistro("minhas-anotacoes.html")}">📝 Anotações</a>.`
          : `Você já enviou mensagem ao prof a respeito desta questão. Você pode acessá-la em <a href="${linkAreaRegistro("mensagens-prof.html")}">💬 Mensagens ao prof</a>. Caso deseje, poderá reformulá-la e enviá-la novamente ao professor.`;
        else if (erro) corpo = `<p role="status">Não foi possível verificar se já existe registro. Tente novamente.</p><button class="btn sprint-revisao-btn-acao" onclick="recarregarRegistroQuestao('${tipo}',${qid})">Tentar novamente</button>`;
        else {
          const id = nota ? `anotacao_texto_${qid}` : `mensagem_texto_${qid}`;
          const placeholder = nota ? "Escreva sua anotação..." : "Escreva sua dúvida ou pergunta...";
          const buttonId = nota ? `btn_salvar_anotacao_${qid}` : `btn_salvar_mensagem_${qid}`;
          const action = nota ? "salvarAnotacaoParaMim" : "salvarEnviarProf";
          const labelBotao = nota ? "Salvar" : "Enviar";
          corpo = `<textarea id="${id}" aria-label="${titulo}" placeholder="${placeholder}" style="width:100%;min-height:100px;margin-top:11px;padding:12px;border:1px solid #ddd;border-radius:6px;"></textarea><button id="${buttonId}" class="btn sprint-revisao-btn-acao" onclick="${action}(${qid})">${labelBotao}</button>`;
        }
        return `<section id="${hostId}" class="card" style="margin-top:16px"><h3>${titulo}</h3>${corpo}</section>`;
      }

      function atualizarSecaoRegistro(tipo, qid) {
        const host = document.getElementById(`registro_${tipo}_${qid}`);
        if (host) host.outerHTML = htmlSecaoRegistro(tipo, qid, cacheRegistrosQuestao[tipo].get(Number(qid)), erroRegistrosQuestao[tipo]);
      }

      async function carregarRegistroQuestao(tipo) {
        const url = tipo === "anotacao" ? "/me/minhas-anotacoes" : "/me/mensagens-prof";
        const rows = await apiGetAuth(`${url}?${contextoAcessoQueryLocal()}`);
        cacheRegistrosQuestao[tipo] = new Map(rows.map(row => [Number(row.questao_id), row]));
        erroRegistrosQuestao[tipo] = false;
        questoes.forEach(q => atualizarSecaoRegistro(tipo, q.id));
      }

      async function recarregarRegistroQuestao(tipo, qid) {
        try { await carregarRegistroQuestao(tipo); }
        catch (err) { console.error(`Erro ao verificar ${tipo}`, err); erroRegistrosQuestao[tipo] = true; atualizarSecaoRegistro(tipo, qid); }
      }

      async function recuperarAnotacoesTentativa() {
        const tipos = ["anotacao", "mensagem"];
        if (!tentativaAnotacaoId) {
          tipos.forEach(tipo => { erroRegistrosQuestao[tipo] = true; questoes.forEach(q => atualizarSecaoRegistro(tipo, q.id)); });
          return;
        }
        const resultados = await Promise.allSettled(tipos.map(carregarRegistroQuestao));
        resultados.forEach((r, i) => { if (r.status === "rejected") { const tipo = tipos[i]; erroRegistrosQuestao[tipo] = true; console.error(`Erro ao verificar ${tipo}`, r.reason); questoes.forEach(q => atualizarSecaoRegistro(tipo, q.id)); } });
      }

      function textoRegistroValido(campo, nome) {
        const texto = campo.value.trim();
        if (!texto) throw new Error(`Escreva ${nome} antes de salvar.`);
        if (texto.split(/\s+/).length > 300) throw new Error("O texto deve ter no máximo 300 palavras.");
        return texto;
      }

      async function salvarAnotacaoParaMim(qid) {
        const campo = document.getElementById(`anotacao_texto_${qid}`), botao = document.getElementById(`btn_salvar_anotacao_${qid}`);
        if (!campo || !botao || botao.disabled) return;
        let texto; try { texto = textoRegistroValido(campo, "uma anotação"); } catch (e) { alert(e.message); return; }
        if (!tentativaAnotacaoId) { alert("Tentativa não identificada."); return; }
        const ctx = contextoAcessoLocal(); botao.disabled = true;
        try {
          await apiPostAuth("/me/anotacoes-questoes", { questao_id: qid, tentativa_id: tentativaAnotacaoId, bateria_id: Number(bateriaId), texto, contratacao_id: ctx.contratacao_id, demonstracao_id: ctx.demonstracao_id });
          alert("Anotação salva com sucesso."); cacheRegistrosQuestao.anotacao.set(Number(qid), { questao_id: qid }); atualizarSecaoRegistro("anotacao", qid);
        } catch (e) { if (e.status === 409) await recarregarRegistroQuestao("anotacao", qid); else { botao.disabled = false; alert("Erro ao salvar anotação: " + e.message); } }
      }

      async function salvarEnviarProf(qid) {
        const campo = document.getElementById(`mensagem_texto_${qid}`), botao = document.getElementById(`btn_salvar_mensagem_${qid}`);
        if (!campo || !botao || botao.disabled) return;
        let texto; try { texto = textoRegistroValido(campo, "uma mensagem"); } catch (e) { alert(e.message); return; }
        if (!confirm("Confirma enviar esta mensagem ao professor?")) return;
        if (!tentativaAnotacaoId) { alert("Tentativa não identificada."); return; }
        const ctx = contextoAcessoLocal(); botao.disabled = true;
        try {
          await apiPostAuth("/me/mensagens-prof", { questao_id: qid, tentativa_id: tentativaAnotacaoId, bateria_id: Number(bateriaId), texto, contratacao_id: ctx.contratacao_id, demonstracao_id: ctx.demonstracao_id });
          alert("Mensagem enviada ao professor."); cacheRegistrosQuestao.mensagem.set(Number(qid), { questao_id: qid }); atualizarSecaoRegistro("mensagem", qid);
        } catch (e) { if (e.status === 409) await recarregarRegistroQuestao("mensagem", qid); else { botao.disabled = false; alert("Erro ao enviar mensagem: " + e.message); } }
      }

      function resetarBotaoResponder(questaoId) {
        const btn = document.getElementById(`btnResponder_${questaoId}`);

        if (btn) {
          btn.textContent = "Responder";
          btn.style.background = "";
          btn.style.color = "";
        }
      }

      async function finalizarRevisao() {
        if (qsLocal("revisao_id")) { voltarParaListaQuestoes(); return; }
        try {
          const tentativaSalva = JSON.parse(
            localStorage.getItem(`tentativa_bateria_${bateriaId}`) || "null"
          );

          if (!tentativaSalva || !tentativaSalva.id) {
            alert("Não foi possível localizar a tentativa desta bateria.");
            return;
          }

          await apiPutAuth(`/tentativas/${tentativaSalva.id}/finalizar-revisao`, {});

          window.location.href =
            localStorage.getItem("voltar_para_questoes") || "cursos.html";

        } catch (err) {
          console.error(err);
          alert("Erro ao finalizar revisão.");
        }
      }

      window.voltarParaListaQuestoes = voltarParaListaQuestoes;

      const anoAtual = document.getElementById("ano_atual");
      if (anoAtual) {
        anoAtual.textContent = 2026;
      } 

      carregarBateria();
    </script>
  </body>
  </html>
