<!DOCTYPE html>
<html lang="pt-BR" class="disciplinas-assuntos-root">
<head>
  <script src="js/sessao.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Disciplinas</title>
  <link rel="stylesheet" href="css/style.css?v=estavel-20261121-1"/>
  <link rel="stylesheet" href="css/disciplinas-assuntos.css"/>
  <link rel="stylesheet" href="css/disciplinas-layout.css?v=2"/>
  <script src="js/cabecalho.js?v=estavel-20261121-1" defer></script>
  <script src="js/rodape.js" defer></script>
  <link rel="stylesheet" href="css/hover-aluno.css?v=1">
  <link rel="stylesheet" href="css/estudo-estavel.css?v=estavel-20261121-1">
</head>

<body class="disciplinas-page" data-page="disciplinas">
  <header class="disciplinas-header ro-header ro-estudo-estavel" data-navegacao-padrao>
    <div class="ro-header-titles">
    <div style="margin-top:0;">
      <h1 id="titulo_pagina" style="margin-bottom:0.0625rem;">&#8203;</h1>
      <script>document.getElementById("titulo_pagina").textContent = new URLSearchParams(location.search).get("curso_nome") || "Disciplinas";</script>
    </div>

    </div>
    <div class="ro-header-navigation">    <div class="disciplinas-header-acoes">
      <a
        id="btnVoltarCurso"
        class="btn ro-nav-control"
        href="#"
        aria-label="Voltar" data-ro-simbolo="⇦" title="Voltar"
      ><span class="ro-nav-label">
        ⇦
      </span></a>

      <a
        class="btn ro-nav-control"
        href="javascript:void(0)"
        onclick="
          localStorage.setItem('pagina_antes_inicio', window.location.href);
          window.location.replace('index.html');
        "
        aria-label="Página inicial" data-ro-simbolo="⌂" title="Página inicial"
      ><span class="ro-nav-label">
        ⌂
      </span></a>

      <a
        href="javascript:void(0)"
        class="btn ro-nav-control"
        onclick="sairComConfirmacao()"
        aria-label="Sair" data-ro-simbolo="⎋" title="Sair"
      ><span class="ro-nav-label">
        ⎋
      </span></a>
    </div>
    </div>
  </header>

  <main class="container" id="conteudo">
    <div class="card disciplinas-intro-card">
      <h2>
        Disciplinas
        <span class="disciplinas-subtitulo">
          em ordem de prioridade
        </span>
      </h2>
    </div>

    <div class="card">
      <div id="lista" class="list"></div>
    </div>

  </main>

  <footer>
    <p>© <span id="ano_atual">2026</span> Quality</p>
  </footer>

  <script>
    document.getElementById("btnVoltarCurso").addEventListener("click", function(e) {
      e.preventDefault();

      const p = new URLSearchParams(window.location.search);
      const cursoId = p.get("curso_id");
      const cursoNome = p.get("curso_nome") || "";

      localStorage.removeItem("voltar_para_curso");

      if (cursoId) {
        window.location.href =
          "curso.html?curso_id=" + encodeURIComponent(cursoId) +
          "&curso_nome=" + encodeURIComponent(cursoNome) +
          (p.get("contratacao_id") ? "&contratacao_id=" + encodeURIComponent(p.get("contratacao_id")) :
           p.get("demonstracao_id") ? "&demonstracao_id=" + encodeURIComponent(p.get("demonstracao_id")) : "");
      } else {
        window.location.href = "cursos.html";
      }
    });
  </script>

  <script src="js/app.js?v=importacao-20261120-1"></script>

  <script>
    const anoAtual = document.getElementById("ano_atual");
    if (anoAtual) {
      anoAtual.textContent = new Date().getFullYear();
    }
  </script>
</body>
</html>
