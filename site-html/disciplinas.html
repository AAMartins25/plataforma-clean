<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Disciplinas</title>
  <link rel="stylesheet" href="css/style.css"/>
</head>

<body class="disciplinas-page" data-page="disciplinas">
  <header class="disciplinas-header">
    <div style="margin-top:0;">
      <h1 id="titulo_pagina" style="margin-bottom:1px;">📚 Disciplinas</h1>
    </div>

    <div class="disciplinas-header-acoes">
      <a
        id="btnVoltarCurso"
        class="btn"
        href="#"
        title="Voltar"
      >
        ⇦
      </a>

      <a
        class="btn"
        href="javascript:void(0)"
        onclick="
          localStorage.setItem('pagina_antes_inicio', window.location.href);
          window.location.replace('index.html');
        "
        title="Página inicial"
      >
        ⌂
      </a>

      <a
        href="javascript:void(0)"
        class="btn"
        onclick="sairComConfirmacao()"
        title="Sair"
      >
        ⎋
      </a>
    </div>
  </header>

  <main class="container" id="conteudo">
    <div class="card disciplinas-intro-card">
      <h2>
        Disciplinas
        <span class="disciplinas-subtitulo">
          em ordem de prioridade
        </span>
      </h2>
    </div>

    <div class="card">
      <div id="lista" class="list"></div>
    </div>

  </main>

  <footer>
    <p>© <span id="ano_atual"></span> - Quality Estudos</p>
  </footer>

  <script>
    document.getElementById("btnVoltarCurso").addEventListener("click", function(e) {
      e.preventDefault();

      const p = new URLSearchParams(window.location.search);
      const cursoId = p.get("curso_id");
      const cursoNome = p.get("curso_nome") || "";

      localStorage.removeItem("voltar_para_curso");

      if (cursoId) {
        window.location.href =
          "curso.html?curso_id=" + encodeURIComponent(cursoId) +
          "&curso_nome=" + encodeURIComponent(cursoNome);
      } else {
        window.location.href = "cursos.html";
      }
    });
  </script>

  <script src="js/app.js"></script>

  <script>
    const anoAtual = document.getElementById("ano_atual");
    if (anoAtual) {
      anoAtual.textContent = new Date().getFullYear();
    }
  </script>
</body>
</html>
