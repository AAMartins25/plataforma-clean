<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Anotações do curso expirado</title>
  <link rel="stylesheet" href="css/style.css"/>
</head>

<body>
  <header>
    <h1 id="titulo_topo">📘 Curso</h1>

    <nav style="display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:10px;">
      <a class="btn" href="javascript:void(0)" onclick="voltarCursoExpirado()">Voltar</a>
      <a href="javascript:void(0)" class="btn" onclick="logout()">Sair</a>
    </nav>
  </header>

  <main class="container">
    <div class="card">
      <h2>📝 Anotações que fiz nas questões</h2>
      <div id="lista_anotacoes" class="list">
        <p>Carregando anotações...</p>
      </div>
    </div>
  </main>

  <footer>
    <p>© 2026 - Plataforma Quality Estudos</p>
  </footer>

  <script>
    const API_BASE = "https://plataforma-quality-backend.onrender.com";

    function qs(name) {
      return new URLSearchParams(window.location.search).get(name);
    }

    function getToken() {
      return localStorage.getItem("access_token");
    }

    function logout() {
      localStorage.removeItem("access_token");
      window.location.href = "index.html";
    }

    function esc(s) {
      return String(s ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;");
    }

    function voltarCursoExpirado() {
      const cursoId = qs("curso_id");
      const cursoNome = qs("curso_nome") || "";
      const dataInicio = qs("data_inicio") || "";
      const dataFim = qs("data_fim") || "";

      window.location.href =
        `curso-expirado.html?curso_id=${encodeURIComponent(cursoId || "")}` +
        `&curso_nome=${encodeURIComponent(cursoNome)}` +
        `&data_inicio=${encodeURIComponent(dataInicio)}` +
        `&data_fim=${encodeURIComponent(dataFim)}`;
    }

    async function apiGet(path) {
      const token = getToken();

      const res = await fetch(`${API_BASE}${path}`, {
        headers: token ? {
          "Authorization": `Bearer ${token}`
        } : {}
      });

      if (!res.ok) {
        const txt = await res.text();
        throw new Error(`Erro ${res.status} em ${path}\n${txt}`);
      }

      return res.json();
    }

    async function carregarAnotacoesExpirado() {
      try {
        await apiGet("/me");

        const cursoId = qs("curso_id");
        const cursoNome = qs("curso_nome") || "Curso";

        document.getElementById("titulo_topo").innerText = `📘 ${cursoNome}`;

        if (!cursoId) {
          document.getElementById("lista_anotacoes").innerHTML =
            "<p>Curso não identificado.</p>";
          return;
        }

        const anotacoes = await apiGet(`/me/cursos-expirados/${cursoId}/anotacoes`);

        if (!anotacoes || anotacoes.length === 0) {
          document.getElementById("lista_anotacoes").innerHTML =
            "<p>Nenhuma anotação encontrada.</p>";
          return;
        }

        document.getElementById("lista_anotacoes").innerHTML =
          anotacoes.map(a => `
            <div class="disciplina">
              <div style="font-weight:bold; margin-bottom:6px;">
                ${esc(a.disciplina_nome || "Disciplina")}
                ${a.assunto_nome ? ` • ${esc(a.assunto_nome)}` : ""}
              </div>

              <div style="white-space:pre-wrap;">
                ${esc(a.texto || a.anotacao || "")}
              </div>
            </div>
          `).join("");

      } catch (err) {
        document.querySelector("main").innerHTML = `
          <div class="card">
            <h2>Erro ao carregar anotações</h2>
            <pre style="white-space:pre-wrap">${esc(err.message)}</pre>
          </div>
        `;
      }
    }

    carregarAnotacoesExpirado();
  </script>
</body>
</html>
