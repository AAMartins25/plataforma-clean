<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <script src="js/sessao.js"></script>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Minhas Vendas</title>

  <link
    rel="stylesheet"
    href="css/style.css"
  >

  <style>
    #percentualComissao::-webkit-inner-spin-button,
    #percentualComissao::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    #percentualComissao {
      appearance: textfield;
      -moz-appearance: textfield;
    }

    .pagina-minhas-vendas .card {
      margin-top: 10px;
      margin-bottom: 10px;
      padding-top: 14px;
      padding-bottom: 14px;
    }

    .pagina-minhas-vendas .titulo-resumo {
      margin: 0;
      font-size: 1.05rem;
      line-height: 1.25;
    }

    .pagina-minhas-vendas .linha-resumo {
      padding: 10px 0;
    }

    .pagina-minhas-vendas .linha-resumo + .linha-resumo {
      border-top: 1px solid #e5e5e5;
    }

    main.container.pagina-minhas-vendas {
      padding-top: 0;
    }

    .pagina-minhas-vendas .list .disciplina {
      padding: 7px 10px;
      min-height: 0;
      margin-bottom: 6px;
    }

    .pagina-minhas-vendas .list .disciplina:last-child {
      margin-bottom: 0;
    }

    .pagina-minhas-vendas .list .assunto {
      padding: 5px 10px;
      min-height: 0;
      margin-top: 2px;
      margin-bottom: 2px;
      line-height: 1.15;
    }

    /* Cabeçalho e rodapé: mesmo padrão de Minha Área, restrito a esta página. */
    :is(.minhas-vendas-page) .ro-header-icon-actions .btn {
      width: auto;
      height: auto;

      margin: 0;
      padding: 0;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      background: transparent;

      border: none;
      border-radius: 0;

      color: var(--azul);

      font-size: 0.82rem;
      font-weight: 400;

      text-decoration: none;

      box-shadow: none;
    }

    :is(.minhas-vendas-page) .ro-header-icon-actions .btn:hover {
      background: transparent;

      color: var(--azul);

      opacity: 0.72;

      text-decoration: none;

      transform: none;
      box-shadow: none;
    }

    body:is(.minhas-vendas-page) {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      min-height: 100svh;
    }

    :is(.minhas-vendas-page) header.ro-header {
      grid-template-columns: minmax(0, 1fr) 44px minmax(0, 1fr);
      gap: 6px 8px;
      flex-shrink: 0;
    }

    :is(.minhas-vendas-page) .ro-header-titles {
      grid-column: 1 / -1;
      grid-row: 1 !important;
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    :is(.minhas-vendas-page) header.ro-header .ro-header-titles > * {
      max-width: calc(100% - 2 * clamp(80px, 20vw, 240px));
    }

    :is(.minhas-vendas-page) .ro-header-titles h1 {
      font-size: 1.25rem;
      line-height: 1.3;
    }

    :is(.minhas-vendas-page) .ro-header-titles h2 {
      margin-top: 3px !important;
      font-size: 0.95rem;
      line-height: 1.35;
    }

    :is(.minhas-vendas-page) .ro-header-navigation {
      grid-column: 1 / -1;
      grid-row: 2 !important;
      justify-content: flex-end;
    }

    :is(.minhas-vendas-page) .ro-header-identity {
      grid-column: 3;
      grid-row: 1;
      align-self: start;
      min-width: 0;
      max-width: min(calc(100% - 52px), calc(clamp(80px, 20vw, 240px) - 16px)) !important;
    }

    :is(.minhas-vendas-page) .ro-identity {
      font-weight: 400;
      height: 44px;
      min-width: 0;
      text-transform: uppercase;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    :is(.minhas-vendas-page) .ro-identity::after {
      overflow: hidden;
      text-overflow: ellipsis;
    }

    :is(.minhas-vendas-page) .ro-header .ro-header-navigation .btn {
      height: 44px !important;
      line-height: 1;
    }

    :is(.minhas-vendas-page) > footer {
      flex-shrink: 0;
      margin-top: 0;
      padding: 24px 15px;
    }

    @media (max-width: 480px) {
    :is(.minhas-vendas-page) .ro-header-titles {
        padding-top: 44px;
      }

    :is(.minhas-vendas-page) header.ro-header .ro-header-titles > * {
        max-width: 100%;
      }

    :is(.minhas-vendas-page) .ro-header-identity {
        grid-column: 1 / -1;
        max-width: 100% !important;
      }
    }

    :is(.minhas-vendas-page) .ro-header-identity {
      color: #4b5563;
      opacity: 0.78;
      letter-spacing: 0.4px;
    }

    .minhas-vendas-page main.container {
      flex: 1 0 auto;
      width: 100%;
    }
  </style>

  <script src="js/cabecalho.js" defer></script>
</head>

<body class="minhas-vendas-page">

  <header
    style="
      padding-top:8px;
      padding-bottom:24px;
      position:relative;
    "
  >
    <div
      style="
        margin-top:32px;
        display:flex;
        justify-content:center;
        align-items:center;
      "
    >
      <h1
        style="
          margin:-6px 0 0 0;
          font-size:1.25rem;
          text-align:center;
        "
      >
        💰 Minhas Vendas
      </h1>
    </div>

    <nav class="ro-header-icon-actions"
      style="
        position:absolute;
        right:24px;
        top:22px;
        display:flex;
        gap:10px;
        align-items:center;
      "
    >
      <a
        class="btn"
        href="minha-area.html"
        title="Voltar"
      >
        ⇦
      </a>

      <a
        class="btn"
        href="index.html"
        title="Início"
      >
        ⌂
      </a>

      <a
        class="btn"
        href="#"
        onclick="confirmarSaidaVendedor(); return false;"
        title="Sair"
      >
        ⎋
      </a>
    </nav>
  </header>


  <main class="container pagina-minhas-vendas">

    <!-- PLATAFORMA QUALITY -->
    <div
      class="card"
      style="
        min-height:42px;
        display:flex;
        align-items:center;
        justify-content:center;
        text-align:center;
      "
    >
      <div
        style="
          display:flex;
          align-items:center;
          justify-content:center;
          gap:6px;
          font-size:.95rem;
          font-weight:100;
        "
      >
        <span>
          Plataforma Quality
        </span>

      </div>
    </div>


    <!-- IDENTIFICAÇÃO DO VENDEDOR -->
    <div
      class="card"
      style="
        min-height:42px;
        display:flex;
        align-items:center;
      "
    >
      <div
        style="
          width:100%;
          font-size:1rem;
          line-height:1.3;
          text-align:left;
        "
      >
        <b>Parceiro:</b>

        <span id="nomeVendedor">
          Carregando...
        </span>
      </div>
    </div>


    <!-- CUPONS -->
    <div class="card">

      <div
        style="
          display:flex;
          align-items:baseline;
          gap:5px;
          flex-wrap:wrap;
        "
      >
        <h2
          class="titulo-resumo"
        >
          Meus cupons:
        </h2>

        <div
          id="listaCupons"
          style="
            font-size:1rem;
            line-height:1.2;
          "
        >
          Carregando...
        </div>
      </div>

    </div>


    <!-- RESUMO DE VENDAS -->
    <div class="card">

      <!-- TOTAL DE VENDAS -->
      <div class="linha-resumo">

        <div
          onclick="alternarSecaoVendas('conteudoTotalVendas')"
          style="
            cursor:pointer;
          "
        >
          <h2 class="titulo-resumo">
            Vendas:
            <span id="totalVendas">
              0
            </span>
          </h2>
        </div>

        <div
          id="conteudoTotalVendas"
          style="display:none;"
        >
          <div
            id="detalhesTotalVendas"
            class="list"
            style="margin-top:10px;"
          >
          </div>
        </div>

      </div>

      <!-- VENDAS CONFIRMADAS -->
      <div class="linha-resumo">

        <div
          onclick="alternarSecaoVendas('conteudoVendasEfetivas')"
          style="
            cursor:pointer;
          "
        >
          <h2 class="titulo-resumo">
            Confirmadas:
            <span id="totalVendasEfetivas">
              0
            </span>
          </h2>
        </div>

        <div
          id="conteudoVendasEfetivas"
          style="display:none;"
        >
          <div
            id="detalhesVendasEfetivas"
            class="list"
            style="margin-top:10px;"
          >
          </div>
        </div>

      </div>

      <!-- VENDAS A CONFIRMAR -->
      <div class="linha-resumo">

        <div
          onclick="alternarSecaoVendas('conteudoVendasAConfirmar')"
          style="
            cursor:pointer;
          "
        >
          <h2 class="titulo-resumo">
            A confirmar:
            <span id="totalVendasAConfirmar">
              0
            </span>
          </h2>
        </div>

        <div
          id="conteudoVendasAConfirmar"
          style="display:none;"
        >
          <div
            id="detalhesVendasAConfirmar"
            class="list"
            style="margin-top:10px;"
          >
          </div>
        </div>

      </div>

    </div>


    <!-- PERCENTUAL DE COMISSÃO -->
    <div class="card">

      <div
        style="
          display:flex;
          align-items:center;
          gap:10px;
          flex-wrap:wrap;
        "
      >

        <h2
          class="titulo-resumo"
          style="
            white-space:nowrap;
          "
        >
          Comissão
        </h2>

        <input
          id="percentualComissao"
          type="number"
          min="0"
          max="115"
          step="0.01"
          placeholder="Ex.: 10"
          style="
            width:60px;
            padding:9px 8px;
            border:1px solid #ddd;
            border-radius:6px;
            box-sizing:border-box;
          "
        >

        <span
          style="
            font-size:1rem;
            font-weight:700;
          "
        >
          %
        </span>

        <button
          id="btnCalcularComissao"
          class="btn"
          type="button"
          style="
            margin-left:8px;
            align-self:center;
            margin-top:0;
            margin-bottom:0;
            padding:9px 13px;
            line-height:1;
          "
        >
          Calcular
        </button>

      </div>

    </div>


    <!-- RESUMO DE COMISSÕES -->
    <div class="card">

      <!-- COMISSÃO CONFIRMADA -->
      <div class="linha-resumo">

        <div
          onclick="alternarSecaoVendas('conteudoComissaoEfetivada')"
          style="
            cursor:pointer;
          "
        >
          <h2 class="titulo-resumo">
            Confirmada:
            <span id="comissaoEfetivada">
              R$ 0,00
            </span>
          </h2>
        </div>

        <div
          id="conteudoComissaoEfetivada"
          style="display:none;"
        >
          <div
            id="detalhesComissaoEfetivada"
            class="list"
            style="margin-top:10px;"
          >
          </div>
        </div>

      </div>


      <!-- COMISSÃO A CONFIRMAR -->
      <div class="linha-resumo">

        <div
          onclick="alternarSecaoVendas('conteudoComissaoAConfirmar')"
          style="
            cursor:pointer;
          "
        >
          <h2 class="titulo-resumo">
            A confirmar:
            <span id="comissaoAConfirmar">
              R$ 0,00
            </span>
          </h2>
        </div>

        <div
          id="conteudoComissaoAConfirmar"
          style="display:none;"
        >
          <div
            id="detalhesComissaoAConfirmar"
            class="list"
            style="margin-top:10px;"
          >
          </div>
        </div>

      </div>

    </div>

  </main>


  <footer>
    <p>
      © <span id="ano_atual">2026</span> RO
    </p>
  </footer>


  <script src="js/app.js"></script>
  <script src="js/minhas-vendas.js"></script>


  <script>
    function confirmarSaidaVendedor() {
      const ok = confirm(
        "Deseja realmente sair da plataforma?"
      );

      if (!ok) return;

      logout();
    }


    const anoAtual =
      document.getElementById(
        "ano_atual"
      );

    if (anoAtual) {
      anoAtual.textContent =
        2026;
    }


    function alternarSecaoVendas(id) {
      const grupos = {
        vendas: [
          "conteudoTotalVendas",
          "conteudoVendasEfetivas",
          "conteudoVendasAConfirmar"
        ],

        comissoes: [
          "conteudoComissaoEfetivada",
          "conteudoComissaoAConfirmar"
        ]
      };

      const conteudo =
        document.getElementById(id);

      if (!conteudo) {
        return;
      }

      const estaAberto =
        conteudo.style.display !== "none";


      // Se já estiver aberto,
      // apenas recolhe o próprio item.
      if (estaAberto) {
        conteudo.style.display =
          "none";

        return;
      }


      // Descobre a qual grupo pertence.
      let grupoAtual = null;

      for (
        const nomeGrupo
        in grupos
      ) {
        if (
          grupos[nomeGrupo].includes(id)
        ) {
          grupoAtual =
            grupos[nomeGrupo];

          break;
        }
      }


      // Fecha somente os outros itens
      // pertencentes ao mesmo grupo.
      if (grupoAtual) {
        grupoAtual.forEach(
          outroId => {

            if (outroId === id) {
              return;
            }

            const outroConteudo =
              document.getElementById(
                outroId
              );

            if (outroConteudo) {
              outroConteudo.style.display =
                "none";
            }

          }
        );
      }


      // Abre o item clicado.
      conteudo.style.display =
        "block";


      const card =
        conteudo.closest(".card");

      if (card) {
        setTimeout(() => {
          card.scrollIntoView({
            behavior: "smooth",
            block: "start"
          });
        }, 100);
      }
    }
    
  </script>

</body>

</html>
