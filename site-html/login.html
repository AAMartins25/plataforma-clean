<!DOCTYPE html>
<html lang="pt-BR" class="login-root">

<head>
  <script src="js/sessao.js"></script>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Login</title>

  <link
    rel="stylesheet"
    href="css/style.css"
  >
  <script src="js/cabecalho.js?v=altura6-1" defer></script>
  <link rel="stylesheet" href="css/login.css?v=4">
  <script src="js/rodape.js" defer></script>
</head>

<body class="login-page atendimento-page">
  
  <header
    style="
      position:relative;
    "
  >
    <div
      style="
        margin-top:0.5rem;
        display:flex;
        justify-content:center;
        align-items:center;
      "
    >
      <h1
      >
        Login
      </h1>
    </div>

    <nav class="ro-header-icon-actions"
      style="
        position:absolute;
        right:1.5rem;
        top:0.5rem;
        display:flex;
        gap:0.625rem;
        align-items:center;
      "
    >
      <a
        id="btnVoltarLogin"
        class="btn"
        href="index.html?atendimento=aberto"
        title="Voltar"
        style="display:none; font-weight:normal;"
      >
        ⇦
      </a>

      <a
        class="btn"
        href="index.html"
        title="Início"
      >
        ⌂
      </a>

      <a
        id="btnSairLogin"
        class="btn"
        href="#"
        onclick="sairComConfirmacao(); return false;"
        title="Sair"
        style="display:none; font-weight:normal;"
      >
        ⎋
      </a>
    </nav>

  </header>

  <main class="container">

    <div class="card">

      <div
        id="msg"
        style="margin:0.625rem 0;"
      ></div>

      <form id="formLogin">

        <div class="list">

          <label for="email">
            <b>E-mail ou CPF</b>
          </label>

          <input
            id="email"
            type="text"
            required
            autocomplete="username"
            placeholder="Informe seu e-mail ou CPF"
            style="
              width:100%;
              padding:0.75rem;
              border:0.0625rem solid #ddd;
              border-radius:0.375rem;
            "
          >

          <label for="senha">
            <b>Senha</b>
          </label>

          <div
            style="
              position:relative;
              width:100%;
            "
          >
            <input
              id="senha"
              type="password"
              required
              autocomplete="current-password"
              placeholder="Informe sua senha"
              style="
                width:100%;
                padding:0.75rem;
                padding-right:3rem;
                border:0.0625rem solid #ddd;
                border-radius:0.375rem;
              "
            >

            <button
              type="button"
              id="toggleSenha"
              title="Mostrar ou ocultar senha"
              aria-label="Mostrar ou ocultar senha"
              style="
                position:absolute;
                right:0.625rem;
                top:50%;
                transform:translateY(-50%);
                border:none;
                background:none;
                cursor:pointer;
                font-size:1rem;
              "
            >
              👁
            </button>
          </div>

          <button
            type="submit"
            class="btn"
          >
            Entrar
          </button>

        </div>

      </form>

      <!-- RECUPERAÇÃO DE SENHA -->
      <div
        class="assunto"
        style="margin-top:1.875rem;"
      >
        <h3 style="margin-top:0;">
          Recuperar ou atualizar minha senha
        </h3>

        <div class="login-recovery-fields"
          style="
            display:flex;
            gap:0.75rem;
            align-items:flex-start;
            flex-wrap:wrap;
            margin-top:0.75rem;
          "
        >
          <input
            id="recuperarLogin"
            type="text"
            placeholder="Informe seu e-mail ou CPF"
            style="
              flex:1;
              height:2.5625rem;
              min-width:15rem;
              padding:0.625rem;
              top:-1rem;
              border:0.0625rem solid #ddd;
              border-radius:0.375rem;
            "
          >

          <button
            type="button"
            class="btn"
            onclick="recuperarSenha()"
            style="
              height:2.5625rem;
              margin-top:0rem;"
          >
            Recuperar / atualizar
          </button>
        </div>

        <div
          id="msgRecuperarSenha"
          style="margin-top:0.625rem;"
        ></div>
      </div>

      <div
        id="areaNaoPossuoCadastro"
        style="margin-top:1.5rem;"
      >
        <a
          class="btn"
          href="register.html"
          title="Cadastrar-se na plataforma"
          style="
            height:3rem;
            display:block;
            top:-0.875rem;
            text-align:center;
          "
        >
          Não possuo cadastro
        </a>
      </div>

    </div>

  </main>

  <footer>
    <p>
      © <span id="ano_atual">2026</span> Quality
    </p>
  </footer>

  <script src="js/app.js?v=perfis-1"></script>
  <script src="js/login.js?v=perfis-1"></script>

  <script>
    const btnToggleSenha =
      document.getElementById("toggleSenha");

    const campoSenha =
      document.getElementById("senha");

    if (btnToggleSenha && campoSenha) {
      btnToggleSenha.addEventListener(
        "click",
        () => {
          const senhaEstaOculta =
            campoSenha.type === "password";

          campoSenha.type =
            senhaEstaOculta
              ? "text"
              : "password";

          btnToggleSenha.textContent =
            senhaEstaOculta
              ? "🙈"
              : "👁";
        }
      );
    }

    function somenteDigitos(valor) {
      return String(valor || "")
        .replace(/\D/g, "");
    }

    function formatarCpf(valor) {
      let v =
        somenteDigitos(valor)
          .slice(0, 11);

      v = v.replace(
        /^(\d{3})(\d)/,
        "$1.$2"
      );

      v = v.replace(
        /^(\d{3})\.(\d{3})(\d)/,
        "$1.$2.$3"
      );

      v = v.replace(
        /\.(\d{3})(\d)/,
        ".$1-$2"
      );

      return v;
    }

    const campoRecuperar =
      document.getElementById(
        "recuperarLogin"
      );

    if (campoRecuperar) {
      campoRecuperar.addEventListener(
        "input",
        () => {
          const valor =
            campoRecuperar.value;

          const pareceCpf =
            /^[\d.\-]+$/.test(valor);

          if (pareceCpf) {
            campoRecuperar.value =
              formatarCpf(valor);
          }
        }
      );
    }

    async function recuperarSenha() {
      const campo =
        document.getElementById(
          "recuperarLogin"
        );

      const msg =
        document.getElementById(
          "msgRecuperarSenha"
        );

      const valor =
        campo?.value.trim() || "";

      if (!valor) {
        msg.textContent =
          "Informe seu e-mail ou CPF.";

        msg.style.color =
          "#8a1f1f";

        return;
      }

      try {
        msg.textContent =
          "Processando...";

        msg.style.color = "";

        const res = await fetch(
          `${API_BASE}/recuperar-senha`,
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body: JSON.stringify({
              login: valor
            })
          }
        );

        const data =
          await res.json();

        if (!res.ok) {
          throw new Error(
            data.detail ||
            "Erro ao recuperar senha."
          );
        }

        msg.textContent =
          data.message;

        msg.style.color =
          "#2f5e46";

      } catch (err) {
        msg.textContent =
          err.message;

        msg.style.color =
          "#8a1f1f";
      }
    }

    const parametrosLogin =
      new URLSearchParams(
        window.location.search
      );

    const destinoLogin =
      parametrosLogin.get("next") || "";

    const veioDeMeusDados =
      destinoLogin === "meus-dados.html";

    const veioDeFalarComCleanAluno =
      destinoLogin ===
      "fale-com-a-clean.html?tipo=aluno";

    const veioDeReembolso =
      destinoLogin === "reembolso.html";

    const loginRestritoAUsuarioCadastrado =
      veioDeMeusDados ||
      veioDeFalarComCleanAluno ||
      veioDeReembolso;

    const btnVoltarLogin =
      document.getElementById(
        "btnVoltarLogin"
      );

    const btnSairLogin =
      document.getElementById(
        "btnSairLogin"
      );

    const areaNaoPossuoCadastro =
      document.getElementById(
        "areaNaoPossuoCadastro"
      );

    if (loginRestritoAUsuarioCadastrado) {
      if (btnVoltarLogin) {
        btnVoltarLogin.style.display =
          "inline-block";

        if (veioDeFalarComCleanAluno) {
          btnVoltarLogin.href =
            "fale-com-a-clean.html";
        } else {
          btnVoltarLogin.href =
            "index.html?atendimento=aberto";
        }
      }

      if (btnSairLogin) {
        const token =
          localStorage.getItem(
            "access_token"
          );

        btnSairLogin.style.display =
          token
            ? "inline-block"
            : "none";
      }

      if (areaNaoPossuoCadastro) {
        areaNaoPossuoCadastro.style.display =
          "none";
      }
    }

    const anoAtual =
      document.getElementById(
        "ano_atual"
      );

    if (anoAtual) {
      anoAtual.textContent =
        new Date().getFullYear();
    }
  </script>

</body>

</html>
