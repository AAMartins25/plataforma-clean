<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <title>Pagamento aprovado</title>

  <link
    rel="stylesheet"
    href="css/style.css"
  />
</head>

<body>

  <header>
    <h1>Pagamento</h1>
  </header>

  <main class="container">

    <div class="card">

      <h2>
        ✅ Pagamento aprovado!
      </h2>

      <p id="msg">
        Pagamento aprovado! Estamos liberando seu acesso...
      </p>

    </div>

  </main>

  <script src="js/app.js"></script>

  <script>
    (async function () {

      const msg =
        document.getElementById(
          "msg"
        );

      try {
        const params =
          new URLSearchParams(
            window.location.search
          );

        const paymentId =
          params.get("payment_id") ||
          params.get("collection_id") ||
          params.get("id");

        const cursoId =
          Number(
            localStorage.getItem(
              "ultimo_checkout_curso_id"
            ) ||
            localStorage.getItem(
              "ultimo_curso_id_compra"
            ) ||
            "0"
          );

        if (!paymentId) {
          msg.textContent =
            "Não foi possível identificar o pagamento.";

          return;
        }

        if (!cursoId) {
          msg.textContent =
            "Não foi possível identificar o curso adquirido.";

          return;
        }

        await apiPostAuth(
          "/pagamentos/confirmar",
          {
            payment_id:
              Number(paymentId),

            curso_id:
              cursoId
          }
        );

        localStorage.removeItem(
          "ultimo_curso_id_compra"
        );

        localStorage.removeItem(
          "ultimo_checkout_curso_id"
        );

        localStorage.removeItem(
          "pos_login_redirect"
        );

        localStorage.removeItem(
          "voltar_para_compra"
        );

        localStorage.removeItem(
          "estado_compra_curso"
        );

        localStorage.removeItem(
          "continuar_compra_apos_login"
        );

        msg.textContent =
          "Pagamento aprovado! Estamos liberando seu acesso...";

        setTimeout(
          () => {
            window.location.href =
              "cursos.html";
          },
          900
        );

      } catch (e) {
        console.error(e);

        msg.textContent =
          "Não foi possível concluir a liberação do acesso. " +
          "Por favor, tente novamente em instantes.";
      }

    })();
  </script>

</body>

</html>
