<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <title>Pagamento</title>

  <link
    rel="stylesheet"
    href="css/style.css"
  />
</head>

<body>

  <header>
    <h1>Pagamento</h1>
  </header>

  <main class="container">

    <div class="card">

      <h2 id="tituloPagamento">
        Verificando pagamento
      </h2>

      <p id="msg">
        Consultando a situação do pagamento...
      </p>

      <button id="btnConsultarPagamento" class="btn" type="button">Consultar novamente</button>
    </div>

  </main>

  <script src="js/app.js"></script>

  <script>
    const msgPagamento = document.getElementById("msg");
    const tituloPagamento = document.getElementById("tituloPagamento");
    const btnConsultarPagamento = document.getElementById("btnConsultarPagamento");
    let consultaPagamentoEmAndamento = false;
    let retornoPagamentoConcluido = false;

    function apresentarPagamento(titulo, mensagem) {
      tituloPagamento.textContent = titulo;
      document.title = titulo;
      msgPagamento.textContent = mensagem;
    }

    async function verificarPagamento() {
      if (consultaPagamentoEmAndamento || retornoPagamentoConcluido) return;
      consultaPagamentoEmAndamento = true;
      btnConsultarPagamento.disabled = true;
      apresentarPagamento("Verificando pagamento", "Consultando a situação do pagamento...");
      try {
        const params = new URLSearchParams(window.location.search);
        const paymentId = params.get("payment_id") || params.get("collection_id") || params.get("id");
        const cursoId = Number(localStorage.getItem("ultimo_checkout_curso_id") ||
          localStorage.getItem("ultimo_curso_id_compra") || "0");
        const resultado = await consultarConfirmacaoPagamento(paymentId, cursoId);
        if (!resultado || resultado.ok !== true || Number(resultado.curso_id) !== cursoId) {
          throw new Error("Resposta de confirmação inválida.");
        }
        const status = String(resultado.status || "").toUpperCase();
        if (resultado.ocorrencia_financeira) {
          apresentarPagamento("Pagamento não confirmado", "Não foi possível confirmar a liberação do acesso. Entre em contato com o suporte.");
        } else if (pagamentoAprovadoSemImpedimento(resultado, cursoId)) {
          apresentarPagamento("Pagamento aprovado!", "Seu pagamento foi confirmado.");
          retornoPagamentoConcluido = true;
          limparContextoCompraConfirmada();
          setTimeout(() => { window.location.href = "cursos.html"; }, 900);
        } else if (["PENDING", "PENDENTE"].includes(status)) {
          apresentarPagamento("Pagamento pendente", resultado.payment_method_id === "pix"
            ? "Seu pagamento por Pix ainda não foi confirmado. O acesso ao curso será liberado após a confirmação!"
            : "Seu pagamento ainda não foi confirmado. O acesso ao curso será liberado após a confirmação!");
        } else if (["IN_PROCESS", "IN_MEDIATION"].includes(status)) {
          apresentarPagamento("Pagamento em processamento", "Seu pagamento está sendo processado. Aguarde a confirmação!");
        } else if (status === "REJECTED") {
          apresentarPagamento("Pagamento não aprovado", "Seu pagamento não foi aprovado. Você pode tentar novamente.");
        } else if (status === "CANCELLED") {
          apresentarPagamento("Pagamento cancelado", "Seu pagamento foi cancelado.");
        } else {
          throw new Error("Situação não confirmada.");
        }
      } catch (err) {
        console.error(err);
        apresentarPagamento("Pagamento não confirmado", "Não foi possível confirmar a situação do pagamento. Consulte novamente em instantes.");
      } finally {
        consultaPagamentoEmAndamento = false;
        btnConsultarPagamento.disabled = retornoPagamentoConcluido;
      }
    }

    btnConsultarPagamento.addEventListener("click", verificarPagamento);
    verificarPagamento();

  </script>

</body>

</html>
