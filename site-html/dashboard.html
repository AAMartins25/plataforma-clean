<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard do Aluno</title>
  <link rel="stylesheet" href="css/style.css"/>
</head>

<body>
  <header>
    <h1>📊 Meu Progresso</h1>

    <nav style="
      display:flex;
      justify-content:center;
      gap:10px;
      flex-wrap:wrap;
      margin-top:10px;
    ">
      <a class="btn" href="javascript:history.back()">Voltar</a>

      <a href="javascript:void(0)" class="btn" onclick="logout()">Sair</a>
    </nav>
  </header>

  <main class="container">
    
    <div class="card">
        <h2 id="nome_curso">📘 Carregando curso...</h2>
    </div>

    <div class="card">
      <h2>📈 Progresso geral do curso</h2>
      <p id="progresso_geral">Carregando progresso...</p>

      <div class="barra-progresso">
        <div id="barra_geral" class="barra-progresso-preenchida" style="width:0%"></div>
      </div>
    </div>

    <div class="card">
      <h2>📚 Progresso por Disciplina</h2>
      <div id="lista_disciplinas" class="list">
        <p>Carregando disciplinas...</p>
      </div>
    </div>

    <div class="card">
      <h2>🔁 Revisões</h2>

      <p id="resumo_revisoes">Carregando revisões...</p>

      <div id="lista_revisoes" class="list" style="margin-top:14px;">
      </div>
    </div>

  </main>

  <footer>
    <p>© 2026 - Plataforma Quality Estudos</p>
  </footer>

  <script>
    const API_BASE = "http://127.0.0.1:8002";

    function getToken() {
      return localStorage.getItem("access_token");
    }

    async function apiGet(path) {
      const token = getToken();

      const res = await fetch(`${API_BASE}${path}`, {
        headers: token ? {
          "Authorization": `Bearer ${token}`
        } : {}
      });

      if (!res.ok) {
        const txt = await res.text();
        throw new Error(`Erro ${res.status} em ${path}\n${txt}`);
      }

      return res.json();
    }

    function hojeISO() {
      return new Date().toISOString().slice(0, 10);
    }

    function getRevisoes(pastaId) {
      try {
        const dados = localStorage.getItem(`revisoes_${pastaId}`);
        return dados ? JSON.parse(dados) : [];
      } catch {
        return [];
      }
    }

    function logout() {
      localStorage.removeItem("access_token");
      window.location.href = "index.html";
    }

    async function carregarDashboard() {
      try {
        
        await apiGet("/me"); // apenas valida token

        const cursos = await apiGet("/me/cursos");

        if (!cursos || cursos.length === 0) {
        document.getElementById("nome_curso").innerText = "📘 Nenhum curso disponível";
        } else {
        const cursoAtual = cursos[0]; // por enquanto, pega o primeiro curso do aluno
        document.getElementById("nome_curso").innerText = `📘 ${cursoAtual.nome_curso}`;
        }

        let totalAulas = 0;
        let aulasConcluidas = 0;

        if (cursos && cursos.length > 0) {
          const cursoAtual = cursos[0];

          const disciplinas = await apiGet(`/cursos/${cursoAtual.curso_id}/disciplinas`);

          for (const disciplina of disciplinas) {
            const assuntos = await apiGet(`/disciplinas/${disciplina.id}/assuntos`);

            for (const assunto of assuntos) {
              const pastas = await apiGet(`/assuntos/${assunto.id}/pastas`);

              const pastaTeoria = pastas.find(p => p.tipo === "TEORIA");
              if (!pastaTeoria) continue;

              const aulas = await apiGet(`/pastas/${pastaTeoria.id}/aulas`);
              const progresso = await apiGet(`/me/progresso?pasta_id=${pastaTeoria.id}`);

              const aulasConcluidasSet = new Set(progresso.map(p => p.aula_id));

              totalAulas += aulas.length;
              aulasConcluidas += aulas.filter(a => aulasConcluidasSet.has(a.id)).length;
            }
          }
        }

        const percentual = totalAulas > 0
          ? Math.round((aulasConcluidas / totalAulas) * 100)
          : 0;

        document.getElementById("progresso_geral").innerText =
          `${aulasConcluidas} de ${totalAulas} aulas concluídas (${percentual}%)`;

        document.getElementById("barra_geral").style.width = `${percentual}%`;

        let totalRevisoesPendentes = 0;
        let totalRevisoesAtrasadas = 0;
        const hoje = hojeISO();
        let htmlRevisoes = "";

        if (cursos && cursos.length > 0) {
          const cursoAtual = cursos[0];
          const disciplinas = await apiGet(`/cursos/${cursoAtual.curso_id}/disciplinas`);

          for (const disciplina of disciplinas) {
            const assuntos = await apiGet(`/disciplinas/${disciplina.id}/assuntos`);

            for (const assunto of assuntos) {
              const pastas = await apiGet(`/assuntos/${assunto.id}/pastas`);
              const pastaTeoria = pastas.find(p => p.tipo === "TEORIA");
              if (!pastaTeoria) continue;

              const revisoes = getRevisoes(pastaTeoria.id);

              const pendentes = revisoes.filter(r => r.proximaRevisao <= hoje);
              const atrasadas = revisoes.filter(r => r.proximaRevisao < hoje);

              totalRevisoesPendentes += pendentes.length;
              totalRevisoesAtrasadas += atrasadas.length;

              for (const rev of pendentes) {
                const atrasada = rev.proximaRevisao < hoje;

                htmlRevisoes += `
                  <div class="disciplina" style="
                    border-left: 6px solid ${atrasada ? '#d32f2f' : '#e6d85a'};
                  ">
                    <div style="font-weight:bold;">
                      ${rev.titulo || "Aula"}
                    </div>

                    <div style="opacity:.85; margin-top:4px;">
                      Revisão prevista para: ${rev.proximaRevisao}
                    </div>

                    ${
                      atrasada
                        ? `<div style="color:#d32f2f;font-weight:bold;margin-top:6px;">
                            ⚠ Revisão atrasada
                          </div>`
                        : ""
                    }
                  </div>
                `;
              }
            }
          }
        }

        if (totalRevisoesPendentes === 0 && totalRevisoesAtrasadas === 0) {

          document.getElementById("resumo_revisoes").innerText = "";

          document.getElementById("lista_revisoes").innerHTML =
            "<p>Ótimo, não há revisão pendente!</p>";

        } else {

          document.getElementById("resumo_revisoes").innerText =
            `Revisões pendentes: ${totalRevisoesPendentes} • Revisões atrasadas: ${totalRevisoesAtrasadas}`;

          document.getElementById("lista_revisoes").innerHTML = htmlRevisoes;
        }

        let htmlDisciplinas = "";

        if (cursos && cursos.length > 0) {
          const cursoAtual = cursos[0];

          const disciplinas = await apiGet(`/cursos/${cursoAtual.curso_id}/disciplinas`);

          for (const disciplina of disciplinas) {
            let totalDisciplina = 0;
            let concluidasDisciplina = 0;

            const assuntos = await apiGet(`/disciplinas/${disciplina.id}/assuntos`);

            for (const assunto of assuntos) {
              const pastas = await apiGet(`/assuntos/${assunto.id}/pastas`);

              const pastaTeoria = pastas.find(p => p.tipo === "TEORIA");
              if (!pastaTeoria) continue;

              const aulas = await apiGet(`/pastas/${pastaTeoria.id}/aulas`);
              const progresso = await apiGet(`/me/progresso?pasta_id=${pastaTeoria.id}`);

              const concluidasSet = new Set(progresso.map(p => p.aula_id));

              totalDisciplina += aulas.length;
              concluidasDisciplina += aulas.filter(a => concluidasSet.has(a.id)).length;
            }

            const percentualDisciplina = totalDisciplina > 0
              ? Math.round((concluidasDisciplina / totalDisciplina) * 100)
              : 0;

            htmlDisciplinas += `
              <div class="disciplina">
                <div style="font-weight:bold;">${disciplina.nome}</div>
                <div style="opacity:.85; margin-top:4px;">
                  ${percentualDisciplina}% (${concluidasDisciplina} de ${totalDisciplina} aulas concluídas)
                </div>

                <div class="barra-progresso">
                  <div class="barra-progresso-preenchida" style="width:${percentualDisciplina}%"></div>
                </div>
              </div>
            `;
          }
        }

        document.getElementById("lista_disciplinas").innerHTML =
          htmlDisciplinas || "<p>Nenhuma disciplina encontrada.</p>";

      } catch (err) {
        document.querySelector("main").innerHTML = `
          <div class="card">
            <h2>Erro ao carregar dashboard</h2>
            <pre style="white-space:pre-wrap">${err.message}</pre>
          </div>
        `;
      }
    }

    carregarDashboard();
  </script>
</body>
</html>
