<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Progresso do Aluno</title>
  <link rel="stylesheet" href="css/style.css"/>
</head>

<body
  class="dashboard-aluno-page"
  data-page="dashboard"
>
  <header class="dashboard-aluno-header">

    <div class="dashboard-aluno-header-identificacao">

      <h1 id="titulo_curso_dashboard"></h1>

      <h2>
        📊 Meu desempenho
      </h2>

    </div>

    <nav class="dashboard-aluno-header-acoes">

      <a
        class="btn"
        href="javascript:void(0)"
        onclick="voltarParaCurso()"
        title="Voltar"
        aria-label="Voltar"
      >
        ⇦
      </a>

      <a
        class="btn"
        href="index.html"
        title="Início"
        aria-label="Início"
      >
        ⌂
      </a>

      <a
        class="btn"
        href="javascript:void(0)"
        onclick="logout()"
        title="Sair"
        aria-label="Sair"
      >
        ⎋
      </a>

    </nav>

  </header>

  <main class="container">

    <div class="card dashboard-aluno-disciplinas-card">

      <div
        class="dashboard-aluno-disciplinas-header"
        onclick="alternarLista('lista_disciplinas')"
      >
        <h2>
          📚 Desempenho nas disciplinas
        </h2>
      </div>

      <div
        id="lista_disciplinas"
        class="list dashboard-aluno-lista-disciplinas"
        style="display:block;"
      >
        <p>Carregando as disciplinas...</p>
      </div>

    </div>

  </main>

  <footer>
    <p>
      © <span id="ano_atual"></span> - Quality Estudos
    </p>
  </footer>

  <script>
    const API_BASE = "https://plataforma-quality-backend.onrender.com";

    function getToken() {
      return localStorage.getItem("access_token");
    }

    function qs(name) {
      return new URLSearchParams(window.location.search).get(name);
    }

    function logout() {
      localStorage.removeItem("access_token");
      localStorage.removeItem("me_cache");
      window.location.href = "index.html";
    }

    function voltarParaCurso() {
      const cursoId = qs("curso_id");
      const cursoNome = qs("curso_nome") || "";

      window.location.replace(
        `curso.html?curso_id=${encodeURIComponent(cursoId || "")}&curso_nome=${encodeURIComponent(cursoNome)}`
      );
    }

    function esc(s) {
      return String(s ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;");
    }

    function alternarLista(id) {
      const el = document.getElementById(id);
      if (!el) return;

      el.style.display = el.style.display === "none" ? "block" : "none";
    }

    async function apiGet(path) {
      const token = getToken();

      const res = await fetch(`${API_BASE}${path}`, {
        headers: token ? {
          "Authorization": `Bearer ${token}`
        } : {}
      });

      if (!res.ok) {
        const txt = await res.text();
        throw new Error(`Erro ${res.status} em ${path}\n${txt}`);
      }

      return res.json();
    }

    async function carregarCursoAtual() {
      const cursos = await apiGet("/me/cursos");
      const cursoIdUrl = Number(qs("curso_id") || 0);

      if (!cursos || cursos.length === 0) return null;

      return cursos.find(c => Number(c.curso_id) === cursoIdUrl) || cursos[0];
    }

    async function carregarDisciplinasDoCurso(cursoId) {
      return await apiGet(`/cursos/${cursoId}/disciplinas-proprias`);
    }

    async function carregarAssuntosDaDisciplina(disciplinaId) {
      return await apiGet(`/disciplinas-proprias/${disciplinaId}/assuntos-proprios`);
    }

    async function carregarPastaTeoriaDoAssunto(assuntoId) {
      try {
        return await apiGet(`/assuntos-proprios/${assuntoId}/pasta-teoria`);
      } catch {
        return null;
      }
    }

    async function carregarAulasDaPasta(pastaId) {
      return await apiGet(`/pastas/${pastaId}/aulas`);
    }

    async function carregarBateriasComStatus(aulaId) {
      return await apiGet(`/aulas/${aulaId}/baterias-com-status`);
    }

    function getRevisoes(pastaId) {
      try {
        const dados = localStorage.getItem(`revisoes_${pastaId}`);
        return dados ? JSON.parse(dados) : [];
      } catch {
        return [];
      }
    }

    function contarVezesAssuntoFeito(pastaId, assuntoConcluidoAgora) {
      const revisoes = getRevisoes(pastaId);
      const revisaoAssunto = revisoes.find(r => r.tipo === "ASSUNTO");

      if (revisaoAssunto) {
        return Math.max(Number(revisaoAssunto.etapa || 1), 1);
      }

      return assuntoConcluidoAgora ? 1 : 0;
    }

    async function calcularNotaAssunto(assuntoId) {
      const pastaTeoria = await carregarPastaTeoriaDoAssunto(assuntoId);

      if (!pastaTeoria || !pastaTeoria.id) {
        return null;
      }

      const aulas = await carregarAulasDaPasta(pastaTeoria.id);

      let totalBaterias = 0;
      let bateriasFeitas = 0;
      let somaPercentuais = 0;

      for (const aula of aulas) {
        const baterias = await carregarBateriasComStatus(aula.id);

        for (const b of baterias || []) {
          totalBaterias++;

          if (b.status_aluno === "FEITA") {
            bateriasFeitas++;
            somaPercentuais += Number(b.percentual_acerto || 0);
          }
        }
      }

      if (totalBaterias === 0 || bateriasFeitas !== totalBaterias) {
        return null;
      }

      const mediaPercentual = somaPercentuais / totalBaterias;
      const nota = mediaPercentual / 10;

      return Number(nota.toFixed(1));
    }

    async function carregarDashboard() {
      try {

        const me = await apiGet("/me");

        exibirNomeUsuarioDashboard(me);

        const cursoAtual =
          await carregarCursoAtual();

        const tituloCurso =
          document.getElementById(
            "titulo_curso_dashboard"
          );

        if (!cursoAtual) {
          if (tituloCurso) {
            tituloCurso.innerText =
              "Nenhum curso disponível";
          }

          return;
        }

        if (tituloCurso) {
          tituloCurso.innerText =
            cursoAtual.nome_curso;
        }

        const disciplinas = await carregarDisciplinasDoCurso(cursoAtual.curso_id);

        let totalAssuntosCurso = 0;
        let assuntosConcluidosCurso = 0;
        let htmlDisciplinas = "";

        for (const disciplina of disciplinas) {

          const assuntos =
            await carregarAssuntosDaDisciplina(
              disciplina.id
            );

        let totalAssuntosDisciplina =
          assuntos.length;

        let assuntosConcluidosDisciplina = 0;

        let htmlAssuntos = "";

        const notasAssuntosDisciplina = [];

          for (const assunto of assuntos) {
            
            const notaAssunto = 
              await calcularNotaAssunto(
                assunto.id
              );
            
            if (notaAssunto !== null) {
              notasAssuntosDisciplina.push(
                notaAssunto
              );
            }

            htmlAssuntos += `
              <div class="dashboard-aluno-assunto-card">

                <div class="dashboard-aluno-assunto-linha">

                  <div class="dashboard-aluno-assunto-nome">
                    ${esc(assunto.nome)}
                  </div>

                  ${
                    notaAssunto !== null
                      ? `
                        <div
                          class="
                            dashboard-aluno-assunto-nota
                            ${
                              notaAssunto <= 5
                                ? "dashboard-aluno-nota-baixa"
                                : ""
                            }
                          "
                        >
                          ${notaAssunto.toFixed(1).replace(".", ",")}
                        </div>
                      `
                      : `
                        <div
                          class="
                            dashboard-aluno-assunto-nota
                            dashboard-aluno-nota-pendente
                          "
                          data-tooltip="A nota do assunto aparecerá aqui quando todas as baterias de questões do assunto tiverem sido concluídas."
                        >
                          nota
                        </div>
                      `
                  }

                </div>

              </div>
            `;
          }


          totalAssuntosCurso += totalAssuntosDisciplina;
          assuntosConcluidosCurso += assuntosConcluidosDisciplina;

          const percentualDisciplina = totalAssuntosDisciplina > 0
            ? Math.round((assuntosConcluidosDisciplina / totalAssuntosDisciplina) * 100)
            : 0;

          const idListaAssuntos = `assuntos_disciplina_${disciplina.id}`;

          const quantidadeAssuntosComNota =
            notasAssuntosDisciplina.length;

          const minimoAssuntosComNota =
            Math.ceil(
              totalAssuntosDisciplina * 0.5
            );

          let notaDisciplina = null;

          if (
            totalAssuntosDisciplina > 0 &&
            quantidadeAssuntosComNota >=
              minimoAssuntosComNota
          ) {
            const somaNotas =
              notasAssuntosDisciplina.reduce(
                (soma, nota) => soma + nota,
                0
              );

            notaDisciplina =
              somaNotas /
              quantidadeAssuntosComNota;

            notaDisciplina =
              Number(
                notaDisciplina.toFixed(1)
              );
          }

          htmlDisciplinas += `
            <div class="disciplina dashboard-aluno-disciplina-card">

              <div
                class="dashboard-aluno-disciplina-linha"
                onclick="alternarLista('${idListaAssuntos}')"
              >

                <div class="dashboard-aluno-disciplina-nome">
                  ${esc(disciplina.nome)}
                </div>

                ${
                  notaDisciplina !== null
                    ? `
                      <div
                        class="
                          dashboard-aluno-disciplina-nota
                          ${
                            notaDisciplina <= 5
                              ? "dashboard-aluno-nota-baixa"
                              : ""
                          }
                        "
                      >
                        ${notaDisciplina.toFixed(1).replace(".", ",")}
                      </div>
                    `
                    : `
                      <div
                        class="
                          dashboard-aluno-disciplina-nota
                          dashboard-aluno-nota-pendente
                        "
                        data-tooltip="A nota da disciplina aparecerá aqui quando pelo menos metade dos assuntos dela já tiverem nota."
                      >
                        nota
                      </div>
                    `
                }

              </div>

              <div
                id="${idListaAssuntos}"
                class="dashboard-aluno-assuntos"
                style="display:none;"
              >
                ${
                  htmlAssuntos || `
                    <p class="dashboard-aluno-sem-assuntos">
                      Não há assuntos nesta disciplina
                    </p>
                  `
                }
              </div>

            </div>
          `;
        }

        document.getElementById("lista_disciplinas").innerHTML =
          htmlDisciplinas || "<p>Nenhuma disciplina encontrada.</p>";

      } catch (err) {
        document.querySelector("main").innerHTML = `
          <div class="card">
            <h2>Erro ao carregar progresso</h2>
            <pre style="white-space:pre-wrap">${esc(err.message)}</pre>
          </div>
        `;
      }
    }

    function exibirNomeUsuarioDashboard(me) {
      if (!me || !me.nome) {
        return;
      }

      const partesNome =
        String(me.nome)
          .trim()
          .split(/\s+/)
          .filter(Boolean);

      if (!partesNome.length) {
        return;
      }

      const primeiroNome =
        partesNome[0];

      const ultimoNome =
        partesNome.length > 1
          ? partesNome[partesNome.length - 1]
          : "";

      const nomeResumido =
        ultimoNome
          ? `${primeiroNome} ${ultimoNome}`
          : primeiroNome;

      const identificacao =
        document.createElement("div");

      identificacao.id =
        "nomeUsuarioLogadoGlobal";

      identificacao.textContent =
        primeiroNome.toUpperCase();

      identificacao.className =
        "dashboard-aluno-nome";

      const tooltip =
        document.createElement("div");

      tooltip.className =
        "dashboard-aluno-nome-tooltip";

      tooltip.textContent =
        nomeResumido.toUpperCase();

      identificacao.appendChild(
        tooltip
      );

      document.body.appendChild(
        identificacao
      );
    }

    const anoAtual =
      document.getElementById(
        "ano_atual"
      );

    if (anoAtual) {
      anoAtual.textContent =
        new Date().getFullYear();
    }

    carregarDashboard();

  </script>
</body>
</html>
