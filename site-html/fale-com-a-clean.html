<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Fale com a Clean</title>
  <link rel="stylesheet" href="css/style.css"/>
</head>

<body>
  <header
    style="
      padding-top:8px;
      padding-bottom:24px;
      position:relative;
    "
  >
    <div
      style="
        margin-top:32px;
        display:flex;
        justify-content:center;
        align-items:center;
      "
    >
      <h1
        style="
          margin:-6px 0 0 0;
          font-size:1.55rem;
          text-align:center;
        "
      >
        💬 Falar com a Clean
      </h1>
    </div>

    <nav
      style="
        position:absolute;
        right:24px;
        top:22px;
        display:flex;
        gap:10px;
        align-items:center;
      "
    >
      <a
        class="btn"
        href="index.html?atendimento=aberto"
        title="Voltar"
        style="font-weight:normal;"
      >
        ⇦
      </a>

      <a
        class="btn"
        href="index.html"
        title="Início"
      >
        ⌂
      </a>

      <a
        id="btnSairFaleClean"
        class="btn"
        href="#"
        onclick="sairComConfirmacao(); return false;"
        title="Sair"
        style="display:none; font-weight:normal;"
      >
        ⎋
      </a>

    </nav>
  </header>

  <main class="container">
    <div class="card">

      <div style="
        display:flex;
        gap:10px;
        flex-wrap:wrap;
        margin-bottom:16px;
        justify-content:center;
      ">
        <button id="btnAluno" class="btn" onclick="mostrarAluno()">ALUNO</button>
        <button id="btnNaoAluno" class="btn" onclick="mostrarNaoAluno()">NÃO ALUNO</button>
      </div>

      <div id="areaAtendimento"></div>
    </div>
  </main>

  <footer>
    <p>
      © <span id="ano_atual"></span> - Quality Estudos
    </p>
  </footer>

  <script src="js/app.js"></script>

  <script>
    const area = document.getElementById("areaAtendimento");

    const btnSairFaleClean =
      document.getElementById(
        "btnSairFaleClean"
      );

    const tokenFaleClean =
      localStorage.getItem(
        "access_token"
      );

    if (btnSairFaleClean) {
      btnSairFaleClean.style.display =
        tokenFaleClean
          ? "inline-block"
          : "none";
    }

    let atendimentoAtual = null;

    function destacarBotao(tipo) {
      const btnAluno = document.getElementById("btnAluno");
      const btnNaoAluno = document.getElementById("btnNaoAluno");

      btnAluno.style.border = tipo === "aluno" ? "3px solid #1F4E79" : "";
      btnNaoAluno.style.border = tipo === "nao-aluno" ? "3px solid #1F4E79" : "";

      btnAluno.style.boxShadow = tipo === "aluno" ? "0 0 0 3px rgba(31,78,121,.15)" : "";
      btnNaoAluno.style.boxShadow = tipo === "nao-aluno" ? "0 0 0 3px rgba(31,78,121,.15)" : "";
    }

    function getToken() {
      return localStorage.getItem("access_token");
    }

    function mostrarAluno() {
      if (atendimentoAtual === "aluno") {
        atendimentoAtual = null;
        area.innerHTML = "";
        destacarBotao(null);
        return;
      }

      atendimentoAtual = "aluno";
      destacarBotao("aluno");
      
      const token = getToken();

      if (!token) {
        window.location.href = "login.html?next=fale-com-a-clean.html?tipo=aluno";
        return;
      }

      area.innerHTML = `
        <div class="assunto">
          <h3>Escreva sua mensagem</h3>

          <label><b>Assunto</b></label>
          <input
            id="assuntoAluno"
            type="text"
            placeholder="Ex.: acesso, pagamento, curso, aula, reembolso..."
            style="width:100%; padding:12px; border:1px solid #ddd; border-radius:6px; margin:6px 0 12px;"
          >

          <label><b>Mensagem</b></label>
          <textarea
            id="mensagemAluno"
            placeholder="Descreva sua dúvida ou solicitação"
            style="width:100%; min-height:130px; padding:12px; border:1px solid #ddd; border-radius:6px; margin-top:6px;"
          ></textarea>

          <button id="btnEnviarMensagemAluno" class="btn" style="margin-top:12px;" onclick="enviarMensagemAluno()">
            Enviar mensagem
          </button>

          <div id="msgAluno" style="margin-top:10px;"></div>

          <button class="btn" type="button" onclick="toggleHistoricoAtendimentos()">
            Atendimentos anteriores
          </button>

          <div
            id="historicoAtendimentos"
            class="list"
            style="display:none; margin:14px 0;"
          ></div>
        </div>
      `;
    }

    function mostrarNaoAluno() {
      if (atendimentoAtual === "nao-aluno") {
        atendimentoAtual = null;
        area.innerHTML = "";
        destacarBotao(null);
        return;
      }

      atendimentoAtual = "nao-aluno";
      destacarBotao("nao-aluno");

      area.innerHTML = `
        <div class="assunto">
          <p>Mande para o nosso WhatsApp:</p>

          <div class="list">
            <a
              class="btn"
              href="https://wa.me/5597991892699?text=Oi%2C%20Quality%21%20Gostaria%20de%20um%20curso%20espec%C3%ADfico."
              target="_blank"
            >
              Quero um curso específico
            </a>

            <a
              class="btn"
              href="https://wa.me/5597991892699?text=Oi%2C%20Quality%21%20Gostaria%20de%20saber%20quais%20cursos%20est%C3%A3o%20dispon%C3%ADveis."
              target="_blank"
            >
              Quais cursos estão disponíveis
            </a>

            <a
              class="btn"
              href="https://wa.me/5597991892699?text=Oi%2C%20Quality%21%20Gostaria%20de%20saber%20por%20quanto%20tempo%20terei%20acesso%20ao%20curso."
              target="_blank"
            >
              Por quanto tempo acesso o curso
            </a>

            <a
              class="btn"
              href="https://wa.me/5597991892699?text=Oi%2C%20Quality%21%0AGostaria%20de%20saber%20o%20seguinte%3A%0A"
              target="_blank"
            >
              Dúvidas em geral
            </a>
          </div>
        </div>
      `;
    }

    async function enviarMensagemAluno() {
      const assunto = document.getElementById("assuntoAluno").value.trim();
      const mensagem = document.getElementById("mensagemAluno").value.trim();
      const msg = document.getElementById("msgAluno");

      if (!assunto) {
        msg.textContent = "Por favor preencha o campo 'Assunto'";
        msg.style.color = "#8a1f1f";
        return;
      }

      if (!mensagem) {
        msg.textContent = "Por favor preencha o campo 'Mensagem'";
        msg.style.color = "#8a1f1f";
        return;
      }

      try {
        await apiPostAuth("/me/atendimentos", {
          assunto,
          mensagem
        });

        msg.style.color = "#2f5e46";
        document.getElementById("btnEnviarMensagemAluno").style.display = "none";

        msg.innerHTML = `
          Mensagem enviada com sucesso!<br/>
          A Clean responderá pelo atendimento interno.

          <div style="margin-top:14px; display:flex; gap:10px; flex-wrap:wrap;">
            <a class="btn" href="index.html">VOLTAR À PÁGINA INICIAL</a>
            <a class="btn" href="cursos.html">IR PARA MEUS CURSOS</a>
          </div>
        `;

        document.getElementById("assuntoAluno").value = "";
        document.getElementById("mensagemAluno").value = "";

      } catch (err) {
        msg.textContent = "Erro ao enviar mensagem: " + err.message;
        msg.style.color = "#8a1f1f";
        console.error(err);
      }
    }
  
    (function abrirFormularioAlunoSeVierDoLogin() {
      const params = new URLSearchParams(window.location.search);

      if (params.get("tipo") === "aluno") {
        mostrarAluno();
      }
    })();
  
    let historicoAtendimentosAberto = false;

    function formatarDataAtendimento(dataISO) {
      if (!dataISO) return "-";
      return new Date(dataISO).toLocaleString("pt-BR");
    }

    async function toggleHistoricoAtendimentos() {
      const box = document.getElementById("historicoAtendimentos");
      if (!box) return;

      historicoAtendimentosAberto = !historicoAtendimentosAberto;

      if (!historicoAtendimentosAberto) {
        box.style.display = "none";
        return;
      }

      box.style.display = "block";
      box.innerHTML = "<p>Carregando atendimentos anteriores...</p>";

      try {
        const dados = await apiGetAuth("/me/atendimentos");

        if (!dados || dados.length === 0) {
          box.innerHTML = `
            <div class="assunto">
              Ainda não há atendimentos realizados.
            </div>
          `;
          return;
        }

        box.innerHTML = dados.map(a => `
          <div class="assunto">
            <b>${a.assunto}</b><br/>
            <span style="opacity:.85;">
              Data: ${formatarDataAtendimento(a.criado_em)}<br/>
              Status: ${a.status}
            </span>

            <div style="margin-top:10px; white-space:pre-wrap;">
              <b>Sua mensagem:</b><br/>
              ${a.mensagem}
            </div>

            <div style="margin-top:10px; white-space:pre-wrap;">
              <b>Resposta da Clean:</b><br/>
              ${a.resposta_admin || "Ainda não respondido."}
            </div>
          </div>
        `).join("");

      } catch (err) {
        console.error(err);
        box.innerHTML = `
          <div class="assunto">
            Erro ao carregar atendimentos anteriores.
          </div>
        `;
      }
    }

    const anoAtual =
      document.getElementById(
        "ano_atual"
      );

    if (anoAtual) {
      anoAtual.textContent =
        new Date().getFullYear();
    }
  </script>
</body>
</html>
