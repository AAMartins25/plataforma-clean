<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <script src="js/sessao.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Fale com a Quality</title>
  <link rel="stylesheet" href="css/style.css"/>
  <script src="js/cabecalho.js?v=altura6-1" defer></script>
  <script src="js/rodape.js" defer></script>
  <link id="hover-aluno-css" rel="stylesheet" href="css/hover-aluno.css?v=1" media="not all">
</head>

<body class="atendimento-page">
  <header
    style="
      padding-top:0.5rem;
      padding-bottom:1.5rem;
      position:relative;
    "
  >
    <div
      style="
        margin-top:2rem;
        display:flex;
        justify-content:center;
        align-items:center;
      "
    >
      <h1
      >
        Falar com a Quality
      </h1>
    </div>

    <nav class="ro-header-icon-actions"
      style="
        position:absolute;
        right:1.5rem;
        top:1.8125rem;
        display:flex;
        gap:0.625rem;
        align-items:center;
      "
    >
      <a
        class="btn"
        href="index.html?atendimento=aberto"
        title="Voltar"
        style="font-weight:normal;"
      >
        ⇦
      </a>

      <a
        class="btn"
        href="index.html"
        title="Início"
      >
        ⌂
      </a>

      <a
        id="btnSairFaleClean"
        class="btn"
        href="#"
        onclick="sairComConfirmacao(); return false;"
        title="Sair"
        style="display:none; font-weight:normal;"
      >
        ⎋
      </a>

    </nav>
  </header>

  <main class="container">
    <div class="card">

      <div style="
        display:flex;
        gap:0.625rem;
        flex-wrap:wrap;
        margin-bottom:1rem;
        justify-content:center;
      ">
        <button
          id="btnAluno"
          class="btn fale-clean-btn-tipo"
          onclick="mostrarAluno()"
        >
          ALUNO
        </button>

        <button
          id="btnNaoAluno"
          class="btn fale-clean-btn-tipo"
          onclick="mostrarNaoAluno()"
        >
          NÃO ALUNO
        </button>
      </div>

      <div id="areaAtendimento"></div>
    </div>
  </main>

  <footer>
    <p>
      © <span id="ano_atual">2026</span> Quality
    </p>
  </footer>

  <script src="js/app.js?v=importacao-20261120-1"></script>

  <script>
    const area = document.getElementById("areaAtendimento");

    const btnSairFaleClean =
      document.getElementById(
        "btnSairFaleClean"
      );

    const tokenFaleClean =
      localStorage.getItem(
        "access_token"
      );

    if (btnSairFaleClean) {
      btnSairFaleClean.style.display =
        tokenFaleClean
          ? "inline-block"
          : "none";
    }

    let atendimentoAtual = null;

    function destacarBotao(tipo) {
      document.getElementById("hover-aluno-css").media = tipo === "aluno" ? "all" : "not all";

      const btnAluno =
        document.getElementById("btnAluno");

      const btnNaoAluno =
        document.getElementById("btnNaoAluno");

      btnAluno.classList.toggle(
        "fale-clean-btn-tipo-ativo",
        tipo === "aluno"
      );

      btnNaoAluno.classList.toggle(
        "fale-clean-btn-tipo-ativo",
        tipo === "nao-aluno"
      );
    }

    function getToken() {
      return localStorage.getItem("access_token");
    }

    function mostrarAluno() {
      if (atendimentoAtual === "aluno") {
        atendimentoAtual = null;
        area.innerHTML = "";
        destacarBotao(null);
        return;
      }

      atendimentoAtual = "aluno";
      destacarBotao("aluno");
      
      const token = getToken();

      if (!token) {
        window.location.href = "login.html?next=fale-com-a-clean.html?tipo=aluno";
        return;
      }

      area.innerHTML = `

        <div class="assunto">

          <div class="fale-clean-form-titulo">
            Escreva sua mensagem
          </div>

          <label><b>Assunto</b></label>

          <input
            id="assuntoAluno"
            type="text"
            placeholder="Ex.: acesso, pagamento, curso, aula, reembolso..."
            style="width:100%; padding:0.75rem; border:0.0625rem solid #ddd; border-radius:0.375rem; margin:0.375rem 0 0.75rem;"
          >

          <label><b>Mensagem</b></label>

          <textarea
            id="mensagemAluno"
            placeholder="Descreva sua dúvida ou solicitação"
            style="width:100%; min-height:8.125rem; padding:0.75rem; border:0.0625rem solid #ddd; border-radius:0.375rem; margin-top:0.375rem;"
          ></textarea>

          <button
            id="btnEnviarMensagemAluno"
            class="btn fale-clean-btn-acao"
            onclick="enviarMensagemAluno()"
          >
            Enviar mensagem
          </button>

          <div id="msgAluno" style="margin-top:0.625rem;"></div>

        </div>


        <div class="assunto fale-clean-mensagens-anteriores">

          <button
            class="btn fale-clean-btn-acao"
            type="button"
            onclick="toggleHistoricoAtendimentos()"
          >
            Mensagens anteriores
          </button>

          <div
            id="historicoAtendimentos"
            class="list"
            style="display:none; margin:0.875rem 0;"
          ></div>

        </div>

      `;
    }

    function mostrarNaoAluno() {
      if (atendimentoAtual === "nao-aluno") {
        atendimentoAtual = null;
        area.innerHTML = "";
        destacarBotao(null);
        return;
      }

      atendimentoAtual = "nao-aluno";
      destacarBotao("nao-aluno");

      area.innerHTML = `
        <div class="assunto fale-clean-whatsapp-area">
          <p class="fale-clean-whatsapp-titulo">
            Atendimento no WhatsApp. Escolha uma opção
          </p>

          <div class="list">
            <a
              class="btn fale-clean-btn-whatsapp"
              href="https://wa.me/5597991892699?text=Oi%2C%20Quality%21%20Gostaria%20de%20um%20curso%20espec%C3%ADfico."
              target="_blank"
            >
              Quero um curso específico
            </a>

            <a
              class="btn fale-clean-btn-whatsapp"
              href="https://wa.me/5597991892699?text=Oi%2C%20Quality%21%20Gostaria%20de%20saber%20quais%20cursos%20est%C3%A3o%20dispon%C3%ADveis."
              target="_blank"
            >
              Quais cursos estão disponíveis
            </a>

            <a
              class="btn fale-clean-btn-whatsapp"
              href="https://wa.me/5597991892699?text=Oi%2C%20Quality%21%20Gostaria%20de%20saber%20por%20quanto%20tempo%20terei%20acesso%20ao%20curso."
              target="_blank"
            >
              Por quanto tempo acesso o curso
            </a>

            <a
              class="btn fale-clean-btn-whatsapp"
              href="https://wa.me/5597991892699?text=Oi%2C%20Quality%21%0AGostaria%20de%20saber%20o%20seguinte%3A%0A"
              target="_blank"
            >
              Dúvidas em geral
            </a>
          </div>
        </div>
      `;
    }

    async function enviarMensagemAluno() {
      const assunto = document.getElementById("assuntoAluno").value.trim();
      const mensagem = document.getElementById("mensagemAluno").value.trim();
      const msg = document.getElementById("msgAluno");

      if (!assunto) {
        msg.textContent = "Por favor preencha o campo 'Assunto'";
        msg.style.color = "#8a1f1f";
        return;
      }

      if (!mensagem) {
        msg.textContent = "Por favor preencha o campo 'Mensagem'";
        msg.style.color = "#8a1f1f";
        return;
      }

      try {
        await apiPostAuth("/me/atendimentos", {
          assunto,
          mensagem
        });

        msg.style.color = "#2f5e46";
        document.getElementById("btnEnviarMensagemAluno").style.display = "none";

        msg.innerHTML = `
          Mensagem enviada com sucesso!<br/>
          A Clean responderá pelo atendimento interno.

          <div style="margin-top:0.875rem; display:flex; gap:0.625rem; flex-wrap:wrap;">
            <a class="btn" href="index.html">VOLTAR À PÁGINA INICIAL</a>
            <a class="btn" href="cursos.html">IR PARA MEUS CURSOS</a>
          </div>
        `;

        document.getElementById("assuntoAluno").value = "";
        document.getElementById("mensagemAluno").value = "";

      } catch (err) {
        msg.textContent = "Erro ao enviar mensagem: " + err.message;
        msg.style.color = "#8a1f1f";
        console.error(err);
      }
    }
  
    (function abrirFormularioAlunoSeVierDoLogin() {
      const params = new URLSearchParams(window.location.search);

      if (params.get("tipo") === "aluno") {
        mostrarAluno();
      }
    })();
  
    let historicoAtendimentosAberto = false;

    function formatarDataAtendimento(dataISO) {
      if (!dataISO) return "-";
      return new Date(dataISO).toLocaleString("pt-BR");
    }

    async function toggleHistoricoAtendimentos() {
      const box = document.getElementById("historicoAtendimentos");
      if (!box) return;

      historicoAtendimentosAberto = !historicoAtendimentosAberto;

      if (!historicoAtendimentosAberto) {
        box.style.display = "none";
        return;
      }

      box.style.display = "block";

      try {
        const dados = await apiGetAuth("/me/atendimentos");

        if (!dados || dados.length === 0) {
          box.innerHTML = `
            <div class="fale-clean-sem-historico">
              Não há atendimento anterior
            </div>
          `;
          return;
        }

        box.innerHTML = dados.map(a => `
          <div class="assunto">
            <b>${a.assunto}</b><br/>
            <span style="opacity:.85;">
              Data: ${formatarDataAtendimento(a.criado_em)}<br/>
              Status: ${a.status}
            </span>

            <div style="margin-top:0.625rem; white-space:pre-wrap;">
              <b>Sua mensagem:</b><br/>
              ${a.mensagem}
            </div>

            <div style="margin-top:0.625rem; white-space:pre-wrap;">
              <b>Resposta da Clean:</b><br/>
              ${a.resposta_admin || "Ainda não respondido."}
            </div>
          </div>
        `).join("");

      } catch (err) {
        console.error(err);
        box.innerHTML = `
          <div class="assunto">
            Erro ao carregar atendimentos anteriores.
          </div>
        `;
      }
    }

    const anoAtual =
      document.getElementById(
        "ano_atual"
      );

    if (anoAtual) {
      anoAtual.textContent =
        new Date().getFullYear();
    }
  </script>
</body>
</html>
