<!DOCTYPE html>
<html lang="pt-BR" class="curso-funcionalidades-root">
<head>
  <script src="js/sessao.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Curso</title>
  <link rel="stylesheet" href="css/style.css?v=estavel-20261121-1"/>
  <link rel="stylesheet" href="css/curso-funcionalidades.css?v=8"/>
  <script src="js/cabecalho.js?v=estavel-20261121-1" defer></script>
  <script src="js/rodape.js" defer></script>
  <link rel="stylesheet" href="css/hover-aluno.css?v=1">
  <link rel="stylesheet" href="css/estudo-estavel.css?v=estavel-20261121-1">
  <style>
    .curso-page #titulo_curso { transform: translateY(3px); }
  </style>
</head>

<body class="curso-page" data-page="curso">

  <header class="curso-header ro-header ro-estudo-estavel" data-navegacao-padrao>
    <div class="ro-header-titles">
    <div class="curso-header-titulo">
      <h1 id="titulo_curso">&#8203;</h1>
      <script>document.getElementById("titulo_curso").textContent = new URLSearchParams(location.search).get("curso_nome") || "Curso";</script>
    </div>

    </div>
    <div class="ro-header-navigation">    <div class="curso-header-acoes">
      <a
        class="btn ro-nav-control"
        href="javascript:void(0)"
        onclick="
          localStorage.removeItem('voltar_para_curso');
          localStorage.removeItem('voltar_para_disciplinas');
          localStorage.removeItem('voltar_para_assuntos');
          window.location.replace('cursos.html');
        "
        aria-label="Voltar" data-ro-simbolo="⇦" title="Voltar"
      ><span class="ro-nav-label">
        ⇦
      </span></a>

      <a
        class="btn ro-nav-control"
        href="javascript:void(0)"
        onclick="
          localStorage.setItem('pagina_antes_inicio', window.location.href);
          window.location.replace('index.html');
        "
        aria-label="Página inicial" data-ro-simbolo="⌂" title="Página inicial"
      ><span class="ro-nav-label">
        ⌂
      </span></a>

      <a
        class="btn ro-nav-control"
        href="javascript:void(0)"
        onclick="sairComConfirmacao()"
        aria-label="Sair" data-ro-simbolo="⎋" title="Sair"
      ><span class="ro-nav-label">
        ⎋
      </span></a>
    </div>
    </div>
  </header>

  <main class="container">
    <div class="card">
      <div class="list" id="acoes_curso"></div>
    </div>

  </main>

  <footer>
  <p>© <span id="ano_atual">2026</span> AAMartins</p>
</footer>

  <script src="js/app.js?v=importacao-20261120-1"></script>

  <script>
    const anoAtual = document.getElementById("ano_atual");
    if (anoAtual) {
      anoAtual.textContent = new Date().getFullYear();
    }
  </script>

</body>
</html>
