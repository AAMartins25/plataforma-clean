<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <script src="js/sessao.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Disciplinas do curso expirado</title>
  <link rel="stylesheet" href="css/style.css"/>
  <script src="js/cabecalho.js" defer></script>
</head>

<body class="consulta-expirada-page">
  <header>
    <div id="nome_aluno_logado"></div>
    <div class="historico-header-identificacao">
      <h1 id="titulo_curso">📘 Curso</h1>
      <h2>Disciplinas</h2>
    </div>

    <nav class="ro-header-icon-actions">
      <a class="btn" href="javascript:void(0)" onclick="voltarCursoExpirado()" title="Voltar" aria-label="Voltar">⇦</a>
      <a class="btn" href="index.html" title="Início" aria-label="Início">⌂</a>
      <a class="btn" href="javascript:void(0)" onclick="logout()" title="Sair" aria-label="Sair">⎋</a>
    </nav>
  </header>

  <main class="container">
    <div class="card">
      <div id="lista_disciplinas" class="list">
        <p>Carregando disciplinas...</p>
      </div>
    </div>
  </main>

  <footer>
    <p>© 2026 RO</p>
  </footer>

  <script>
    const API_BASE = "https://plataforma-quality-backend.onrender.com";

    function qs(name) {
      return new URLSearchParams(window.location.search).get(name);
    }

    function getToken() {
      return localStorage.getItem("access_token");
    }

    function contextoExpirado() {
      return new URLSearchParams(['contratacao_id', 'demonstracao_id']
        .filter(key => qs(key)).map(key => [key, qs(key)])).toString();
    }

    function logout() {
      Sessao.encerrar();
      window.location.href = "index.html";
    }

    function esc(s) {
      return String(s ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;");
    }

    function voltarCursoExpirado() {
      const cursoId = qs("curso_id");
      const cursoNome = qs("curso_nome") || "";
      const dataInicio = qs("data_inicio") || "";
      const dataFim = qs("data_fim") || "";

      window.location.href =
        `curso-expirado.html?curso_id=${encodeURIComponent(cursoId || "")}` +
        `&curso_nome=${encodeURIComponent(cursoNome)}` +
        `&data_inicio=${encodeURIComponent(dataInicio)}` +
        `&data_fim=${encodeURIComponent(dataFim)}&${contextoExpirado()}`;
    }

    async function apiGet(path) {
      const token = getToken();

      const res = await Sessao.fetch(`${API_BASE}${path}`, {
        headers: token ? {
          "Authorization": `Bearer ${token}`
        } : {}
      });

      if (!res.ok) {
        const txt = await res.text();
        throw new Error(`Erro ${res.status} em ${path}\n${txt}`);
      }

      return res.json();
    }

    async function carregarDisciplinasExpirado() {
      try {
        const aluno = await apiGet("/me");
        const nome = document.getElementById("nome_aluno_logado");
        const partes = String(aluno?.nome || "").trim().split(/\s+/).filter(Boolean);
        nome.textContent = partes[0] || "";
        nome.title = partes.length > 1 ? `${partes[0]} ${partes[partes.length - 1]}` : (partes[0] || "");

        const cursoId = qs("curso_id");
        const cursoNome = qs("curso_nome") || "Curso";

        document.getElementById("titulo_curso").innerText = `📘 ${cursoNome}`;

        if (!cursoId) {
          document.getElementById("lista_disciplinas").innerHTML =
            "<p>Curso não identificado.</p>";
          return;
        }

        const disciplinas = await apiGet(`/me/cursos-expirados/${cursoId}/disciplinas?${contextoExpirado()}`);

        if (!disciplinas || disciplinas.length === 0) {
          document.getElementById("lista_disciplinas").innerHTML =
            "<p>Nenhuma disciplina encontrada.</p>";
          return;
        }

        document.getElementById("lista_disciplinas").innerHTML =
          disciplinas.map(d => `
            <div class="disciplina">
              <div style="font-weight:bold;">
                ${esc(d.nome)}
              </div>
            </div>
          `).join("");

      } catch (err) {
        document.querySelector("main").innerHTML = `
          <div class="card">
            <h2>Erro ao carregar disciplinas</h2>
            <pre style="white-space:pre-wrap">${esc(err.message)}</pre>
          </div>
        `;
      }
    }

    carregarDisciplinasExpirado();
  </script>
</body>
</html>
