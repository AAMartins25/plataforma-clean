  <!DOCTYPE html>
  <html lang="pt-BR">
  <head>
  <script src="js/sessao.js"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Cursos</title>
    <link rel="stylesheet" href="css/style.css"/>
    <link rel="stylesheet" href="css/meus-cursos.css?v=1"/>
    <script src="js/cabecalho.js" defer></script>
  <script src="js/rodape.js" defer></script>
</head>
  <body class="cursos-page" data-page="cursos">
   <header class="cursos-header">
      <div style="text-align:center; margin-top:0.5rem;">
        <h1 style="margin:0;">Meus Cursos</h1>
      </div>

      <div class="cursos-header-acoes">
        <a
          id="btnVoltarMinhaArea"
          class="btn"
          href="minha-area.html"
          title="Voltar"
          style="display:none;"
        >
          ⇦
        </a>

        <a
          class="btn"
          href="javascript:void(0)"
          onclick="window.location.replace('index.html')"
          title="Página inicial"
        >
          ⌂
        </a>

        <a
          class="btn"
          href="javascript:void(0)"
          onclick="sairComConfirmacao()"
          title="Sair"
        >
          ⎋
        </a>
      </div>
    </header>

    <main class="container" id="conteudo">
      <section id="card_cursos_ativos" aria-label="Cursos ativos">
        <div id="lista" class="list"></div>
      </section>

      <section class="card" id="card_cursos_expirados" style="display:none;" aria-labelledby="titulo_cursos_expirados">
        <h2 id="titulo_cursos_expirados" class="cursos-status-titulo">
          <button id="btnCursosExpirados" type="button" onclick="alternarCursosExpirados()" aria-expanded="false" aria-controls="lista_expirados">
            <svg class="meus-cursos-icone" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
            <span>Cursos com acesso expirado</span>
            <span class="meus-cursos-seta" aria-hidden="true"></span>
          </button>
        </h2>
        <div id="lista_expirados" class="list" style="display:none;"></div>
      </section>

    </main>

    <footer>
      <p>© <span id="ano_atual">2026</span> Quality</p>
    </footer>

    <script src="js/app.js?v=meus-cursos-visual1"></script>

    <script>
      document.getElementById("ano_atual").innerText = new Date().getFullYear();

      async function configurarVoltarMinhaArea() {
        const btnVoltar =
          document.getElementById(
            "btnVoltarMinhaArea"
          );

        if (!btnVoltar) {
          return;
        }

        try {
          const me =
            await apiGetAuth(
              "/me"
            );

          const quantidadeAreas =
            Number(!!me?.is_admin) +
            Number(!!me?.is_vendedor) +
            Number(!!me?.is_aluno);

          btnVoltar.style.display =
            quantidadeAreas > 1
              ? "inline-block"
              : "none";

        } catch (err) {
          console.error(
            "Erro ao verificar áreas do usuário:",
            err
          );

          btnVoltar.style.display =
            "none";
        }
      }

      configurarVoltarMinhaArea(); 

    </script>

  </body>
  </html>
