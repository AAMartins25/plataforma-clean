  <!DOCTYPE html>
  <html lang="pt-BR">
  <head>
  <script src="js/sessao.js"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Cursos</title>
    <link rel="stylesheet" href="css/style.css"/>
    <link rel="stylesheet" href="css/meus-cursos.css?v=9"/>
  <link rel="stylesheet" href="css/home-cursos-cabecalhos.css?v=2">
    <script src="js/cabecalho.js?v=altura6-1" defer></script>
  <script src="js/rodape.js" defer></script>
</head>
  <body class="cursos-page" data-page="cursos">
   <header class="cursos-header">
      <div class="cursos-titulo" style="text-align:center; margin-top:0.5rem;">
        <h1 style="margin:0;"><span class="cursos-titulo-texto"><svg class="cursos-titulo-livros" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="#d64e4b" d="M3 1h17a2 2 0 0 1 2 2v4H5a3 3 0 0 1-2-6Z"/><path fill="#f8edcf" d="M5 3h15v2H5a1 1 0 0 1 0-2Z"/><path fill="#e5a929" d="M2 8h17a3 3 0 0 1 0 6H2V8Z"/><path fill="#fff4d9" d="M4 10h15a1 1 0 0 1 0 2H4v-2Z"/><path fill="#377dab" d="M5 15h17v6a2 2 0 0 1-2 2H5a4 4 0 0 1 0-8Z"/><path fill="#f5edda" d="M5 17h15v4H5a2 2 0 0 1 0-4Z"/></svg><span>Meus Cursos</span></span></h1>
      </div>

      <div class="cursos-header-acoes">
        <a
          id="btnVoltarMinhaArea"
          class="btn"
          href="minha-area.html"
          title="Voltar"
          style="display:none;"
        >
          ⇦
        </a>

        <a
          class="btn"
          href="javascript:void(0)"
          onclick="window.location.replace('index.html')"
          title="Página inicial"
        >
          ⌂
        </a>

        <a
          class="btn"
          href="javascript:void(0)"
          onclick="sairComConfirmacao()"
          title="Sair"
        >
          ⎋
        </a>
      </div>
    </header>

    <main class="container" id="conteudo">
      <div class="card" id="card_cursos_ativos">
        <div id="lista" class="list" aria-live="polite" aria-busy="true"><p role="status">Carregando...</p></div>
      </div>

      <div class="card" id="card_cursos_expirados" style="display:none;">
        <div
          onclick="alternarCursosExpirados()"
          style="cursor:pointer;"
        >
          <h2 class="cursos-status-titulo">
            Cursos com acesso expirado
          </h2>
        </div>

        <div id="lista_expirados" class="list" style="display:none;"></div>
      </div>

    </main>

    <footer>
      <p>© <span id="ano_atual">2026</span> Quality</p>
    </footer>

    <script src="js/app.js?v=cursos-carregamento-1"></script>

    <script>
      document.getElementById("ano_atual").innerText = new Date().getFullYear();

      async function configurarVoltarMinhaArea() {
        const btnVoltar =
          document.getElementById(
            "btnVoltarMinhaArea"
          );

        if (!btnVoltar) {
          return;
        }

        try {
          const me =
            await obterPerfilMeusCursos();

          const quantidadeAreas =
            Number(!!me?.is_admin) +
            Number(!!me?.is_vendedor) +
            Number(!!me?.is_aluno);

          btnVoltar.style.display =
            quantidadeAreas > 1
              ? "inline-block"
              : "none";

        } catch (err) {
          console.error(
            "Erro ao verificar áreas do usuário:",
            err
          );

          btnVoltar.style.display =
            "none";
        }
      }

      configurarVoltarMinhaArea(); 

    </script>

  </body>
  </html>
