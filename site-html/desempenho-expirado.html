<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <script src="js/sessao.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Meu desempenho</title>
  <link rel="stylesheet" href="css/style.css"/>
  <script src="js/cabecalho.js" defer></script>
</head>

<body class="desempenho-expirado-page">
  <header>
    <div id="nome_aluno_logado"></div>
    <div class="historico-header-identificacao">
      <h1 id="titulo_topo">📘 Curso</h1>
      <h2>Meu desempenho</h2>
    </div>

    <nav class="ro-header-icon-actions">
      <a class="btn" href="javascript:void(0)" onclick="voltarCursoExpirado()" title="Voltar" aria-label="Voltar">⇦</a>
      <a class="btn" href="index.html" title="Início" aria-label="Início">⌂</a>
      <a class="btn" href="javascript:void(0)" onclick="logout()" title="Sair" aria-label="Sair">⎋</a>
    </nav>
  </header>

  <main class="container">
    <div class="card">
      <div id="lista_disciplinas" class="list">
        <p>Carregando desempenho...</p>
      </div>
    </div>
  </main>

  <footer>
    <p>© 2026 RO</p>
  </footer>

  <script>
    const API_BASE = "https://plataforma-quality-backend.onrender.com";

    function qs(name) {
      return new URLSearchParams(window.location.search).get(name);
    }

    function getToken() {
      return localStorage.getItem("access_token");
    }

    function logout() {
      Sessao.encerrar();
      window.location.href = "index.html";
    }

    function esc(s) {
      return String(s ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;");
    }

    function voltarCursoExpirado() {
      const cursoId = qs("curso_id");
      const cursoNome = qs("curso_nome") || "";
      const dataInicio = qs("data_inicio") || "";
      const dataFim = qs("data_fim") || "";

      window.location.href =
        `curso-expirado.html?curso_id=${encodeURIComponent(cursoId || "")}` +
        `&curso_nome=${encodeURIComponent(cursoNome)}` +
        `&data_inicio=${encodeURIComponent(dataInicio)}` +
        `&data_fim=${encodeURIComponent(dataFim)}&${contextoDesempenho()}`;
    }

    function alternarLista(id) {
      const el = document.getElementById(id);
      if (!el) return;
      el.style.display = el.style.display === "none" ? "block" : "none";
    }

    async function apiGet(path) {
      const token = getToken();

      const res = await Sessao.fetch(`${API_BASE}${path}`, {
        headers: token ? {
          "Authorization": `Bearer ${token}`
        } : {}
      });

      if (!res.ok) {
        const txt = await res.text();
        throw new Error(`Erro ${res.status} em ${path}\n${txt}`);
      }

      return res.json();
    }

    let desempenhoAtual;
    function contextoDesempenho() {
      const query = new URLSearchParams();
      for (const key of ['contratacao_id', 'demonstracao_id']) {
        if (qs(key)) query.set(key, qs(key));
      }
      return query.toString();
    }
    async function carregarDisciplinasDoCursoExpirado(cursoId) {
      desempenhoAtual = await apiGet(`/me/cursos-expirados/${cursoId}/desempenho?${contextoDesempenho()}`);
      return desempenhoAtual.disciplinas;
    }
    async function carregarAssuntosDaDisciplina(id) {
      return desempenhoAtual.disciplinas.find(d => Number(d.id) === Number(id))?.assuntos || [];
    }
    async function calcularNotaAssunto(assuntoId) {
      const assunto = desempenhoAtual.disciplinas.flatMap(d => d.assuntos).find(a => Number(a.id) === Number(assuntoId));
      const baterias = assunto?.baterias || [];
      const totalBaterias = baterias.length;
      const feitas = baterias.filter(b => b.status_aluno === "FEITA" && b.percentual_acerto !== null);
      const bateriasFeitas = feitas.length;
      const somaPercentuais = feitas.reduce((soma, b) => soma + Number(b.percentual_acerto), 0);

      if (totalBaterias === 0 || bateriasFeitas !== totalBaterias) {
        return null;
      }

      const mediaPercentual = somaPercentuais / totalBaterias;
      const nota = mediaPercentual / 10;

      return Number(nota.toFixed(1));
    }

    async function carregarDesempenhoExpirado() {
      try {
        const aluno = await apiGet("/me");
        const nome = document.getElementById("nome_aluno_logado");
        const partes = String(aluno?.nome || "").trim().split(/\s+/).filter(Boolean);
        nome.textContent = partes[0] || "";
        nome.title = partes.length > 1 ? `${partes[0]} ${partes[partes.length - 1]}` : (partes[0] || "");

        const cursoId = qs("curso_id");
        const cursoNome = qs("curso_nome") || "Curso";

        document.getElementById("titulo_topo").innerText = `📘 ${cursoNome}`;

        if (!cursoId) {
          document.getElementById("lista_disciplinas").innerHTML =
            "<p>Curso não identificado.</p>";
          return;
        }

        const disciplinas = await carregarDisciplinasDoCursoExpirado(cursoId);

        if (!disciplinas || disciplinas.length === 0) {
          document.getElementById("lista_disciplinas").innerHTML =
            "<p>Nenhuma disciplina encontrada.</p>";
          return;
        }

        let htmlDisciplinas = "";

        for (const disciplina of disciplinas) {
          const assuntos = await carregarAssuntosDaDisciplina(disciplina.id);
          const idListaAssuntos = `assuntos_disciplina_${disciplina.id}`;

          let htmlAssuntos = "";

          for (const assunto of assuntos) {
            const notaAssunto = await calcularNotaAssunto(assunto.id);

            htmlAssuntos += `
              <div style="
                padding:10px 12px;
                border:1px solid #ddd;
                border-radius:8px;
                margin-top:10px;
              ">
                <div style="
                  display:flex;
                  justify-content:space-between;
                  align-items:center;
                  gap:12px;
                  flex-wrap:wrap;
                ">
                  <div style="
                    font-weight:normal;
                    font-size:0.92rem;
                    margin-left:28px;
                  ">
                    ${esc(assunto.nome)}
                  </div>

                  <div
                    title="Desempenho nas questões deste assunto"
                    style="
                      font-weight:bold;
                      color:${notaAssunto !== null && notaAssunto <= 5 ? '#d32f2f' : '#003b7a'};
                    "
                  >
                    ${notaAssunto !== null ? String(notaAssunto).replace(".", ",") : ""}
                  </div>
                </div>
              </div>
            `;
          }

          htmlDisciplinas += `
            <div class="disciplina">
              <div
                onclick="alternarLista('${idListaAssuntos}')"
                style="
                  display:flex;
                  justify-content:space-between;
                  align-items:center;
                  gap:12px;
                  flex-wrap:wrap;
                  cursor:pointer;
                "
              >
                <div style="font-weight:bold;">
                  ${esc(disciplina.nome)}
                </div>
              </div>

              <div id="${idListaAssuntos}" style="display:none; margin-top:12px;">
                ${
                  htmlAssuntos || `
                    <p style="
                      margin-left:68px;
                      font-size:0.9rem;
                      opacity:.85;
                    ">
                      Não há assuntos nesta disciplina
                    </p>
                  `
                }
              </div>
            </div>
          `;
        }

        document.getElementById("lista_disciplinas").innerHTML = htmlDisciplinas;

      } catch (err) {
        document.querySelector("main").innerHTML = `
          <div class="card">
            <h2>Erro ao carregar desempenho</h2>
            <pre style="white-space:pre-wrap">${esc(err.message)}</pre>
          </div>
        `;
      }
    }

    carregarDesempenhoExpirado();
  </script>
</body>
</html>
