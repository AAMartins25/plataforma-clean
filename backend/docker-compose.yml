version: "3.9"

services:
  postgres:
    image: postgres:15
    container_name: postgres_plataforma
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init_data.sql:/docker-entrypoint-initdb.d/init_data.sql

volumes:
  postgres_data:
